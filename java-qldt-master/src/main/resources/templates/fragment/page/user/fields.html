<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="form-fields">
      <div class="flex flex-col gap-3">
         <div class="form-control">
            <label class="label" for="fullName">
               <span
                  class="label-text font-bold"
                  th:text="#{users.field.full_name}"
               ></span>
            </label>
            <input
               id="fullName"
               type="text"
               name="fullName"
               class="input w-full"
               th:classappend="${#fields.hasErrors('fullName')} ? ' input-error'"
               th:field="*{fullName}"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.fullName}"
            />
            <div id="fullName-error" class="ml-3">
               <span
                  class="label-text-alt text-error"
                  th:if="${#fields.hasErrors('fullName')}"
                  th:errors="*{fullName}"
               ></span>
            </div>
         </div>

         <div class="form-control">
            <label class="label" for="userCode"
               ><span
                  class="label-text font-bold"
                  th:text="#{users.field.user_code}"
               ></span
            ></label>
            <input
               id="userCode"
               type="text"
               name="userCode"
               class="input w-full"
               th:field="*{userCode}"
               th:readonly="${form.readonly}"
            />
         </div>

         <div
            class="form-control flex items-center gap-4 border p-3 rounded-lg border-gray-300"
            th:unless="${form.readonly}"
         >
            <span class="label font-bold" th:text="#{users.field.roles}"></span>
            <label class="label justify-start gap-3" th:each="role : ${roles}">
               <input
                  type="checkbox"
                  name="roleIds"
                  class="checkbox"
                  th:value="${role.id}"
                  th:checked="${data.roleIds != null and data.roleIds.contains(role.id)}"
               />
               <span
                  class="label-text"
                  th:text="#{roles.__${role.name}__}"
               ></span>
            </label>
         </div>

         <div class="form-control">
            <label class="label" for="email">
               <span
                  class="label-text font-bold"
                  th:text="#{users.field.email}"
               ></span>
            </label>
            <input
               id="email"
               type="email"
               name="email"
               class="input w-full"
               th:classappend="${#fields.hasErrors('email')} ? ' input-error'"
               th:field="*{email}"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.email}"
            />
            <div id="email-error" class="ml-3">
               <span
                  class="label-text-alt text-error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
               ></span>
            </div>
         </div>

         <div class="form-control">
            <label class="label" for="username">
               <span
                  class="label-text font-bold"
                  th:text="#{users.field.username}"
               ></span>
            </label>
            <input
               id="username"
               type="text"
               name="username"
               class="input w-full"
               th:classappend="${#fields.hasErrors('username')} ? ' input-error'"
               th:field="*{username}"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.username}"
            />
            <div id="username-error" class="ml-3">
               <span
                  class="label-text-alt text-error"
                  th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"
               ></span>
            </div>
         </div>

         <div class="form-control" th:unless="${form.readonly}">
            <label class="label" for="password">
               <span
                  class="label-text font-bold"
                  th:text="#{users.field.password}"
               ></span>
            </label>
            <input
               id="password"
               type="password"
               name="password"
               class="input w-full"
               th:classappend="${#fields.hasErrors('password')} ? ' input-error'"
               th:placeholder="${data.id != null ? #messages.msg('users.field.password.placeholder') : ''}"
               th:attr="validate-data=${form.validationRules.password}"
            />
            <div id="password-error" class="ml-3">
               <span
                  class="label-text-alt text-error"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
               ></span>
            </div>
         </div>

         <div class="form-control">
            <label class="label" for="phone">
               <span
                  class="label-text font-bold"
                  th:text="#{users.field.phone}"
               ></span>
            </label>
            <input
               id="phone"
               type="text"
               name="phone"
               class="input w-full"
               th:classappend="${#fields.hasErrors('phone')} ? ' input-error'"
               th:field="*{phone}"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.phone}"
            />
            <div id="phone-error" class="ml-3">
               <span
                  class="label-text-alt text-error"
                  th:if="${#fields.hasErrors('phone')}"
                  th:errors="*{phone}"
               ></span>
            </div>
         </div>
      </div>
   </th:block>
</html>
