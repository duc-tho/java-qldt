<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <head>
      <title th:text="${#messages.msg(pageTitle)}"></title>
   </head>

   <body>
      <th:block layout:fragment="actions">
         <a
            th:if="${form.readonly}"
            th:href="${form.actionUrl + '/edit'}"
            class="btn btn-primary btn-sm"
         >
            <span
               class="iconify inline"
               data-icon="bi:pencil-square"
               data-width="16"
            ></span>
            <span th:text="#{users.action.edit}"></span>
         </a>
         <button
            th:if="${form.readonly}"
            type="button"
            class="btn btn-error btn-outline btn-sm"
            x-data
            th:attr="data-delete-url=${form.actionUrl + '/delete'}, data-delete-name=${form.data.fullName}"
            x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
         >
            <span
               class="iconify inline"
               data-icon="bi:trash"
               data-width="16"
            ></span>
            <span th:text="#{users.action.delete}"></span>
         </button>
      </th:block>

      <th:block layout:fragment="page-content">
         <div th:replace="~{fragment/crud/form :: crud-form(${form})}"></div>
      </th:block>
   </body>
</html>
