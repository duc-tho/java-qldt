<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
<body><th:block layout:fragment="page-content">
  <form method="get" class="grid gap-3 sm:grid-cols-3 mb-5"><input class="input w-full" name="search" th:value="${search}" th:placeholder="#{student-groups.search}"><select class="select w-full" name="departmentId"><option value="" th:text="#{student-groups.filter.department}"></option><option th:each="department : ${departments}" th:value="${department.id}" th:selected="${department.id == departmentId}" th:text="${department.name}"></option></select><button class="btn" th:text="#{crud.table.search}"></button></form>
  <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" th:if="${!#lists.isEmpty(topics)}"><article class="card card-border border-base-300 shadow-sm" th:each="topic : ${topics}"><div class="card-body p-6"><h2 class="card-title" th:text="${topic.title}"></h2><p th:text="${topic.department.name}"></p><p th:text="${topic.description}"></p><p th:text="${#strings.listJoin(topic.advisers.![fullName], ', ')}"></p><div class="card-actions justify-end" th:if="${isLeader and isOpen}"><button th:if="${topic.id == selectedTopicId}" class="btn btn-success" type="button" disabled aria-disabled="true"><span class="iconify" data-icon="bi:check-lg"></span><span th:text="#{student-groups.action.selected}"></span></button><form th:unless="${topic.id == selectedTopicId}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/topics/{topicId}(periodId=${group.registrationPeriod.id},groupId=${group.id},topicId=${topic.id})}" method="post"><button class="btn btn-primary" th:text="#{student-groups.action.select-topic}"></button></form></div></div></article></div>
  <div role="alert" class="alert alert-info" th:if="${#lists.isEmpty(topics)}" th:text="#{crud.table.empty}"></div>
</th:block></body></html>
