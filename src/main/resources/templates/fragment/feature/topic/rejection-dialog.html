<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="rejection-dialog(item, action)">
      <dialog th:replace="~{fragment/base/dialog :: dialog(|reject_item_${item.id}|, ~{::rejection-dialog-content}, #{crud.delete.close})}">
         <section th:fragment="rejection-dialog-content">
            <h3 class="text-lg font-semibold" th:text="#{topics.action.reject}"></h3>
            <div th:replace="~{fragment/feature/topic/rejection-reason :: field(false)}"></div>
            <div class="modal-action">
               <th:block th:replace="~{fragment/feature/topic/rejection-dialog :: postWithTextarea(${action.getUrl(item)}, #{topics.action.reject}, 'btn btn-sm btn-error')}"></th:block>
               <th:block th:replace="~{fragment/base/button :: modalClose(|reject_item_${item.id}|, #{crud.form.cancel}, 'btn btn-sm')}"></th:block>
            </div>
         </section>
      </dialog>
   </th:block>
   <button th:fragment="postWithTextarea(url, label, classes)"
      type="button" th:class="${classes}" th:attr="data-post-url=${url}"
      x-on:click="$el.closest('.modal-box').querySelector('textarea').reportValidity() &amp;&amp; postAction($el.dataset.postUrl, $el.closest('.modal-box').querySelector('textarea').value)">
      <th:block th:insert="~{fragment/base/button :: iconLabel(${label}, null)}"></th:block>
   </button>
</html>
