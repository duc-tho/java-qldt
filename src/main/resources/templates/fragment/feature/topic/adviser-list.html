<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <ul th:fragment="advisers(advisers, classes, showContact)" th:class="${classes}">
      <li th:each="adviser : ${advisers}"
         th:class="${showContact} ? 'rounded-field border border-base-300 bg-base-200/50 p-4' : 'rounded-field border border-base-300 bg-base-200/50 p-3'">
         <p th:class="${showContact} ? 'font-semibold' : 'text-sm font-semibold'"
            th:text="${adviser.fullName}"></p>
         <p th:class="${showContact} ? 'mt-0.5 font-mono text-sm text-base-content/70' : 'font-mono text-sm text-base-content/70'"
            th:text="${adviser.userCode}"></p>
         <div class="mt-3 space-y-1.5 border-t border-base-300 pt-3 text-sm" th:if="${showContact}">
            <a class="link link-hover flex min-w-0 items-center gap-2 text-primary"
               th:href="|mailto:${adviser.email}|">
               <span class="iconify shrink-0" data-icon="bi:envelope"></span>
               <span class="truncate" th:text="${adviser.email}"></span>
            </a>
            <p class="flex items-center gap-2 text-base-content/70"
               th:if="${adviser.phone != null and !adviser.phone.isBlank()}">
               <span class="iconify" data-icon="bi:telephone"></span>
               <span th:text="${adviser.phone}"></span>
            </p>
         </div>
      </li>
   </ul>
</html>
