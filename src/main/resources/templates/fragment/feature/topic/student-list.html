<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="student-list(period, topics, departments, search, departmentId)">
      <form th:replace="~{fragment/shared/filter-bar :: get(@{/dot/{id}/de-tai(id=${period.id})}, 'mb-5 grid gap-3 sm:grid-cols-3', ~{::#student-topic-filters})}">
         <th:block id="student-topic-filters" th:fragment="student-topic-filters">
         <input th:if="${selectionGroupId != null}" type="hidden" name="nhomId" th:value="${selectionGroupId}">
         <th:block th:replace="~{fragment/base/input :: query('search', ${search}, #{student-groups.search}, 'text', 'input w-full')}"></th:block>
         <select th:replace="~{fragment/base/select :: query('departmentId', 'select w-full', ~{::#student-topic-department-options})}">
            <th:block id="student-topic-department-options" th:fragment="student-topic-department-options">
            <option value="" th:text="#{student-groups.filter.department}"></option>
            <option th:each="department : ${departments}" th:value="${department.id}"
               th:selected="${department.id == departmentId}" th:text="${department.name}"></option>
            </th:block>
         </select>
         <th:block th:replace="~{fragment/base/button :: submit(#{crud.table.search}, null, 'btn btn-sm', false)}"></th:block>
         </th:block>
      </form>
      <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" th:if="${!#lists.isEmpty(topics)}">
         <th:block th:each="topic : ${topics}">
            <article th:replace="~{fragment/base/card :: card(~{::student-topic-header}, ~{::student-topic-body}, ~{::student-topic-footer})}">
               <header th:fragment="student-topic-header" class="card-body pb-0">
                  <h2 class="card-title text-lg font-semibold" th:text="${topic.title}"></h2>
               </header>
               <section th:fragment="student-topic-body" class="card-body pt-2">
                  <p class="text-sm text-base-content/70" th:text="${topic.department.name}"></p>
                  <p class="line-clamp-3" th:text="${topic.description}"></p>
                  <p class="text-sm" th:text="${#strings.listJoin(topic.advisers.![fullName], ', ')}"></p>
                  <div class="card-actions justify-end">
                     <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{periodId}/de-tai/{topicId}(periodId=${period.id},topicId=${topic.id},nhomId=${selectionGroupId})}, #{crud.action.detail}, null, 'btn btn-sm btn-outline', null)}"></th:block>
                     <th:block th:if="${canChooseTopic == true}">
                        <th:block th:if="${selectedTopicId == topic.id}">
                           <th:block th:replace="~{fragment/base/button :: disabled(#{student-groups.action.selected}, 'bi:check-lg', 'btn btn-sm btn-success', null)}"></th:block>
                        </th:block>
                        <form th:unless="${selectedTopicId == topic.id}" method="post"
                           th:action="@{/dot/{periodId}/nhom/{groupId}/de-tai(periodId=${period.id},groupId=${selectionGroupId})}">
                           <input type="hidden" name="topicId" th:value="${topic.id}">
                           <th:block th:replace="~{fragment/base/button :: submit(#{student-groups.action.select-topic}, null, 'btn btn-sm btn-primary', false)}"></th:block>
                        </form>
                     </th:block>
                  </div>
               </section>
               <th:block th:fragment="student-topic-footer"></th:block>
            </article>
         </th:block>
      </div>
      <th:block th:if="${#lists.isEmpty(topics)}"><th:block th:replace="~{fragment/base/alert :: text('alert alert-info', 'alert', #{crud.table.empty})}"></th:block></th:block>
   </th:block>
</html>
