<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <section th:fragment="section(section)" class="space-y-4" th:attr="aria-labelledby=${section.id + '-title'}">
      <div class="flex flex-wrap items-center justify-between gap-3">
         <h2 class="text-xl font-semibold" th:id="${section.id + '-title'}" th:text="${section.title}"></h2>
         <span class="badge badge-ghost" th:text="${#lists.size(section.cards)}"></span>
      </div>

      <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" th:if="${!#lists.isEmpty(section.cards)}">
         <th:block th:each="card : ${section.cards}">
            <th:block th:replace="~{fragment/feature/work/period-card :: card(${card})}"></th:block>
         </th:block>
      </div>

      <th:block th:if="${#lists.isEmpty(section.cards)}">
         <th:block th:replace="~{fragment/shared/empty-state :: centered('bi:calendar-x', ${section.emptyMessage}, null)}"></th:block>
      </th:block>
   </section>
</html>
