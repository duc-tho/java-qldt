<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <body>
      <section
         class="mt-8 border-t border-base-300 pt-6"
         sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')"
         th:fragment="result-publication(period)"
      >
         <th:block th:if="${error != null}"><th:block th:replace="~{fragment/base/alert :: iconText('alert alert-error alert-soft mb-5', 'alert', #{__${error}__}, 'bi:exclamation-circle')}" ></th:block></th:block>

         <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
            <div>
               <h2 class="text-xl font-semibold" th:text="#{result-publications.title}"></h2>
               <p class="mt-1 text-sm text-base-content/70" th:text="#{result-publications.description}"></p>
            </div>
            <span
               class="badge badge-soft"
               th:if="${latestPublication != null}"
               th:classappend="${latestPublication.action.name() == 'PUBLISHED'} ? ' badge-success' : ' badge-warning'"
               th:text="#{__${'result-publications.action.' + latestPublication.action.name()}__}"
            ></span>
         </div>

         <div class="mt-4 flex flex-wrap gap-3">
            <form method="post" th:action="@{/dot/{id}/ket-qua/cong-bo(id=${period.id})}" th:if="${latestPublication == null or latestPublication.action.name() == 'REVOKED'}">
               <th:block th:replace="~{fragment/base/button :: submit(#{result-publications.action.publish}, 'bi:send-check', 'btn btn-sm btn-primary', ${!canPublishResults})}"></th:block>
            </form>
            <th:block th:if="${latestPublication != null and latestPublication.action.name() == 'PUBLISHED'}">
               <th:block th:replace="~{fragment/base/button :: modalOpen('revoke_publication', #{result-publications.action.revoke}, 'bi:x-circle', 'btn btn-sm btn-error btn-outline')}"></th:block>
            </th:block>
         </div>

         <p
            class="mt-3 text-sm text-base-content/70"
            th:if="${(latestPublication == null or latestPublication.action.name() == 'REVOKED') and !canPublishResults}"
            th:text="#{result-publications.not-ready}"
         ></p>

         <th:block th:replace="~{fragment/feature/result/publication-history :: history}"></th:block>

         <dialog th:replace="~{fragment/base/dialog :: dialog('revoke_publication', ~{::#revoke-publication-content}, #{crud.delete.close})}">
            <section id="revoke-publication-content">
               <form method="post" th:action="@{/dot/{id}/ket-qua/thu-hoi(id=${period.id})}" th:object="${revocationForm}">
                  <h3 class="text-lg font-semibold" th:text="#{result-publications.action.revoke}"></h3>
                  <div class="mt-4"
                     th:replace="~{fragment/base/field-shell :: field('reason', #{result-publications.column.reason}, true, null, false, ~{::#publication-reason-control})}">
                     <th:block id="publication-reason-control" th:fragment="publication-reason-control"
                        th:replace="~{fragment/base/textarea :: bound('reason', 'textarea min-h-28 w-full', null, true, 500)}"></th:block>
                  </div>
                  <div class="modal-action">
                     <th:block th:replace="~{fragment/base/button :: submit(#{result-publications.action.revoke}, null, 'btn btn-sm btn-error', false)}"></th:block>
                     <th:block th:replace="~{fragment/base/button :: modalClose('revoke_publication', #{crud.form.cancel}, 'btn btn-sm')}"></th:block>
                  </div>
               </form>
            </section>
         </dialog>
      </section>
   </body>
</html>
