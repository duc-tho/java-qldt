<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="content">
      <div th:if="${registration == null}"
         class="flex min-h-64 flex-col items-center justify-center gap-4 p-5 text-center">
         <span class="iconify text-4xl text-base-content/40" data-icon="bi:journal-plus"></span>
         <p class="text-base-content/70" th:text="#{student-groups.topic.empty}"></p>
         <th:block th:if="${isLeader and isOpen}">
            <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{periodId}/de-tai(periodId=${group.registrationPeriod.id},nhomId=${group.id})}, #{student-groups.action.select-topic}, null, 'btn btn-sm btn-primary', null)}"></th:block>
         </th:block>
      </div>

      <div th:if="${registration != null}" class="space-y-5 p-5 md:p-7">
         <div>
            <div class="flex flex-wrap gap-2">
               <th:block th:replace="~{fragment/base/badge :: text(|#{student-groups.topic-code}: #${registration.topic.id}|, 'badge badge-primary badge-soft')}"></th:block>
               <th:block th:replace="~{fragment/base/badge :: text(|#{topics.column.department}: ${registration.topic.department.name}|, 'badge badge-info badge-soft')}"></th:block>
            </div>
            <h2 class="mt-3 text-xl font-semibold leading-snug"
               th:text="${registration.topic.title}"></h2>
         </div>

         <div class="grid gap-3 border-t border-base-300 pt-5"
            th:classappend="${registration.topic.advisers.size() > 1} ? ' md:grid-cols-2' : ' md:grid-cols-1'">
            <div class="rounded-box border border-base-300 bg-base-200/40 p-4"
               th:each="adviser : ${registration.topic.advisers}">
               <p class="text-sm font-semibold uppercase tracking-wide text-base-content/70"
                  th:text="#{student-groups.adviser}"></p>
               <p class="mt-2 font-semibold" th:text="${adviser.fullName}"></p>
               <div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-base-content/70">
                  <span th:text="${adviser.userCode}"></span>
                  <span th:text="${adviser.email}"></span>
                  <span th:if="${adviser.phone != null}" th:text="${adviser.phone}"></span>
               </div>
            </div>
         </div>

         <div class="rounded-box border border-base-300 bg-base-200/40 p-4">
            <h3 class="font-semibold text-lg" th:text="#{student-groups.topic.content}"></h3>
            <p class="mt-2 whitespace-pre-line text-sm leading-relaxed text-base-content"
               th:text="${registration.topic.description}"></p>
         </div>

         <div class="flex flex-wrap items-center justify-between gap-3 border-t border-base-300 pt-4">
            <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{periodId}/de-tai/{topicId}(periodId=${group.registrationPeriod.id},topicId=${registration.topic.id},nhomId=${group.id})}, #{student-groups.action.topic-detail}, 'bi:eye', 'btn btn-ghost btn-sm', null)}"></th:block>
            <th:block th:if="${isLeader and isOpen and canEditRegistration}">
               <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{periodId}/de-tai(periodId=${group.registrationPeriod.id},nhomId=${group.id})}, #{student-groups.action.change-topic}, null, 'btn btn-outline btn-sm', null)}"></th:block>
            </th:block>
         </div>
         <th:block th:if="${registration.status.name() == 'PENDING'}">
            <th:block th:replace="~{fragment/base/alert :: iconText('alert alert-info alert-soft text-sm', 'alert', #{student-groups.topic.change-note}, 'bi:info-circle')}"></th:block>
         </th:block>
      </div>
   </th:block>
</html>
