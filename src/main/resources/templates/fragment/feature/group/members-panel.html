<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="panel">
      <section th:replace="~{fragment/base/card :: section('card card-border border-base-300 lg:col-span-2', ~{::#group-members-card})}">
         <th:block id="group-members-card" th:fragment="group-members-card">
            <div class="card-body gap-5">
               <div class="flex flex-wrap items-center justify-between gap-3">
                  <h2 class="card-title text-lg font-semibold">
                     <span class="iconify" data-icon="bi:people"></span>
                     <span th:text="#{student-groups.members}"></span>
                  </h2>
                  <th:block th:replace="~{fragment/base/badge :: text(#{student-groups.slots-remaining(${5 - members.size()})}, 'badge badge-primary badge-soft')}"></th:block>
               </div>
               <th:block th:replace="~{fragment/base/alert :: iconText('alert alert-info alert-soft text-sm', 'alert', #{student-groups.member-rule}, 'bi:info-circle')}"></th:block>

               <ul class="space-y-3">
                  <li th:each="member : ${members}">
                     <div th:replace="~{fragment/shared/person-row :: row(${#strings.substring(member.student.fullName, 0, 1)}, ${member.student.fullName}, ${member.student.userCode}, 'w-10', 'flex-wrap justify-between rounded-box border border-base-300 p-3', ~{::#group-member-actions})}">
                        <th:block id="group-member-actions" th:fragment="group-member-actions">
                           <th:block th:if="${member.leader}">
                              <th:block th:replace="~{fragment/base/badge :: text(#{student-groups.leader}, 'badge badge-warning badge-soft badge-sm')}"></th:block>
                           </th:block>
                           <div class="flex gap-1" th:if="${isLeader and isOpen and canEditRegistration and !member.leader}">
                              <form th:action="@{/dot/{periodId}/nhom/{groupId}/truong-nhom(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post">
                                 <input type="hidden" name="memberId" th:value="${member.id}">
                                 <th:block th:replace="~{fragment/base/button :: submitIcon(#{student-groups.action.transfer-leader}, 'bi:star', 'btn btn-ghost btn-sm')}"></th:block>
                              </form>
                              <form th:action="@{/dot/{periodId}/nhom/{groupId}/thanh-vien/{memberId}/xoa(periodId=${group.registrationPeriod.id},groupId=${group.id},memberId=${member.id})}" method="post">
                                 <th:block th:replace="~{fragment/base/button :: submitIcon(#{student-groups.action.remove-member}, 'bi:trash', 'btn btn-ghost btn-sm text-error')}"></th:block>
                              </form>
                           </div>
                        </th:block>
                     </div>
                  </li>
               </ul>

               <div th:if="${isLeader and isOpen and canEditRegistration and members.size() < 5}"
                  th:object="${addMemberForm}" class="rounded-box border border-dashed border-base-300 p-4">
                  <p class="font-medium" th:text="#{student-groups.slots-remaining(${5 - members.size()})}"></p>
                  <form class="mt-3 flex flex-col gap-2 sm:flex-row"
                     th:action="@{/dot/{periodId}/nhom/{groupId}/thanh-vien(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post">
                     <th:block th:replace="~{fragment/base/input :: bound('studentCode', 'text', 'input w-full', #{student-groups.field.student-code}, false, null)}"></th:block>
                     <th:block th:replace="~{fragment/base/button :: submit(#{student-groups.action.add-member}, null, 'btn btn-sm btn-primary', false)}"></th:block>
                  </form>
                  <p class="mt-2 text-sm text-base-content/70" th:text="#{student-groups.member-note}"></p>
                  <span class="text-error text-sm" th:if="${#fields.hasErrors('studentCode')}"
                     th:errors="*{studentCode}"></span>
                  <th:block th:if="${#fields.hasGlobalErrors()}">
                     <th:block th:replace="~{fragment/base/alert :: globalErrorsPlain('alert alert-error mt-3')}"></th:block>
                  </th:block>
               </div>

               <div class="border-t border-base-300 pt-4">
                  <h3 class="font-semibold text-lg" th:text="#{student-groups.leader-responsibilities}"></h3>
                  <ul class="mt-2 list-disc space-y-1 pl-5 text-sm text-base-content/70">
                     <li th:text="#{student-groups.leader-task.members}"></li>
                     <li th:text="#{student-groups.leader-task.report}"></li>
                     <li th:text="#{student-groups.leader-task.topic}"></li>
                  </ul>
               </div>
            </div>
         </th:block>
      </section>
   </th:block>
</html>
