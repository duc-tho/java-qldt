<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <div th:fragment="field(name, readonly, validationRule)" class="flex flex-col gap-1"
      th:with="isReviewer=${name == 'reviewerDeadline'}, isCouncil=${name == 'councilDate'}"
      th:attr="x-show=${isReviewer} ? 'periodType === &quot;TLCN&quot; || periodType === &quot;KLTN&quot;' : (${isCouncil} ? 'periodType === &quot;KLTN&quot;' : null)">
      <th:block th:unless="${isReviewer or isCouncil}">
         <div th:replace="~{fragment/base/field-label :: label(${name}, #{registration-periods.field.__${name}__}, ${!readonly}, #{registration-periods.help.__${name}__})}"></div>
      </th:block>
      <div th:if="${isReviewer or isCouncil}" class="flex items-center gap-1">
         <label class="label gap-0.5 p-0 text-sm font-medium text-base-content" th:for="${name}">
            <span th:text="#{registration-periods.field.__${name}__}"></span>
            <span th:unless="${readonly}"
               th:attr="data-required-for=${name}, x-show=${isReviewer} ? 'periodType === &quot;TLCN&quot; || periodType === &quot;KLTN&quot;' : 'periodType === &quot;KLTN&quot;'"
               class="text-error" aria-hidden="true" x-cloak>*</span>
         </label>
         <span class="tooltip tooltip-right inline-flex cursor-help text-base-content/70 focus-visible:outline-2 focus-visible:outline-primary"
            tabindex="0" th:attr="data-tip=#{registration-periods.help.__${name}__}, data-help-for=${name}, title=#{registration-periods.help.__${name}__}, aria-label=#{registration-periods.help.__${name}__}">
            <span class="iconify" data-icon="bi:exclamation-circle" data-width="16"></span>
         </span>
      </div>
      <th:block th:unless="${readonly}">
         <th:block th:replace="~{fragment/base/input :: datePicker(
            ${name},
            ${validationRule},
            ${!isReviewer and !isCouncil},
            ${isReviewer} ? '$el.disabled = !(periodType === &quot;TLCN&quot; || periodType === &quot;KLTN&quot;); $el.required = !$el.disabled' : (${isCouncil} ? '$el.disabled = periodType !== &quot;KLTN&quot;; $el.required = !$el.disabled' : null),
            ${isReviewer or isCouncil} ? 'periodType' : null,
            ${isReviewer} ? 'TLCN,KLTN' : (${isCouncil} ? 'KLTN' : null),
            ${isReviewer} ? #{registration_periods.validation.reviewer_deadline.required} : (${isCouncil} ? #{registration_periods.validation.council_date.required} : null)
         )}"></th:block>
      </th:block>
      <th:block th:if="${readonly}" th:with="value=*{__${name}__}">
         <th:block th:replace="~{fragment/base/readonly-value :: value(${name}, ${value == null ? '—' : #temporals.format(value, 'dd/MM/yyyy HH:mm')})}"></th:block>
      </th:block>
      <div th:replace="~{fragment/base/field-shell :: errors(${name}, ${readonly})}"></div>
   </div>
</html>
