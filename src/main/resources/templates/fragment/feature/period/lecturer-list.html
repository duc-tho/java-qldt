<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="lecturer-list(openPeriods, closedPeriods, topicsByPeriodId, work, workPeriods, taskCounts)">
      <section th:if="${work != null}">
         <h2 class="text-xl font-semibold" th:text="${work == 'duyet'} ? #{navigation.item.topic-registrations} : #{navigation.item.council-workspace}"></h2>
         <div class="mt-5 grid gap-5 md:grid-cols-2" th:if="${!#lists.isEmpty(workPeriods)}">
            <th:block th:each="period : ${workPeriods}">
               <th:block th:replace="~{fragment/feature/period/work-card :: card(${period}, ${work}, ${taskCounts[period.id]})}"></th:block>
            </th:block>
         </div>
         <th:block th:if="${#lists.isEmpty(workPeriods)}">
            <th:block th:replace="~{fragment/shared/empty-state :: centered('bi:calendar-x', #{registration_periods.work.empty}, null)}"></th:block>
         </th:block>
      </section>
      <th:block th:unless="${work != null}">
      <section aria-labelledby="open-proposals-title">
         <h2 id="open-proposals-title" class="text-xl font-semibold"
            th:text="#{topics.proposals.open-section}"></h2>
         <div class="mt-5 grid gap-5 md:grid-cols-2" th:if="${!#lists.isEmpty(openPeriods)}">
            <th:block th:each="period : ${openPeriods}">
               <article th:replace="~{fragment/feature/period/proposal-card :: period-card(${period}, ${topicsByPeriodId[period.id]}, true)}"></article>
            </th:block>
         </div>
         <p class="mt-4 text-sm text-base-content/70" th:if="${#lists.isEmpty(openPeriods)}"
            th:text="#{topics.proposals.open-empty}"></p>
      </section>

      <section class="mt-8" aria-labelledby="closed-proposals-title">
         <h2 id="closed-proposals-title" class="text-xl font-semibold"
            th:text="#{topics.proposals.closed-section}"></h2>
         <div class="mt-5 grid gap-5 md:grid-cols-2" th:if="${!#lists.isEmpty(closedPeriods)}">
            <th:block th:each="period : ${closedPeriods}">
               <article th:replace="~{fragment/feature/period/proposal-card :: period-card(${period}, ${topicsByPeriodId[period.id]}, false)}"></article>
            </th:block>
         </div>
         <p class="mt-4 text-sm text-base-content/70" th:if="${#lists.isEmpty(closedPeriods)}"
            th:text="#{topics.proposals.closed-empty}"></p>
      </section>
      </th:block>
   </th:block>
</html>
