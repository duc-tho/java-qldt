<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <article th:fragment="card(period, work, count)"
      th:replace="~{fragment/base/card :: section('card card-border border-base-300 bg-base-100', ~{::#period-work-card})}">
      <div id="period-work-card" th:fragment="period-work-card" class="card-body gap-4">
         <div class="flex flex-wrap items-center justify-between gap-3">
            <h3 class="card-title text-lg font-semibold" th:text="${period.name}"></h3>
            <span th:replace="~{fragment/base/badge :: text(${count}, 'badge badge-primary badge-soft')}"></span>
         </div>
         <th:block th:if="${work == 'duyet'}">
            <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/nhom(id=${period.id},canDuyet=true)}, #{navigation.item.topic-registrations}, 'bi:journal-check', 'btn btn-sm btn-primary self-start', null)}"></th:block>
         </th:block>
         <th:block th:if="${work == 'danh-gia'}">
            <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/danh-gia(id=${period.id})}, #{navigation.item.council-workspace}, 'bi:clipboard2-check', 'btn btn-sm btn-primary self-start', null)}"></th:block>
         </th:block>
      </div>
   </article>
</html>
