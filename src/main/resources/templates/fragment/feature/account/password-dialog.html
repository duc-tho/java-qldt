<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="dialog">
<dialog th:replace="~{fragment/base/dialog :: dialogOpen('change-password-dialog', ~{::#change-password-content}, ${passwordDialogOpen}, #{crud.delete.close})}">
            <section id="change-password-content">
               <h2
                  class="text-xl font-semibold"
                  th:text="#{account.action.change_password}"
               ></h2>
               <form
                  method="post"
                  th:action="@{/tai-khoan/password}"
                  th:object="${passwordData}"
                  class="mt-5 flex flex-col gap-4"
                  data-live-validation
                  novalidate
                  x-data="formValidation"
                  @submit.prevent="submit"
               >
                  <th:block th:if="${#fields.hasAnyErrors()}">
                     <th:block th:replace="~{fragment/base/alert :: validationErrors('alert alert-error alert-soft flex flex-col gap-2', null)}"></th:block>
                  </th:block>
                  <div th:replace="~{fragment/shared/validated-field :: field('current-password', #{account.field.current_password}, true, ~{fragment/base/input :: validatedBound('currentPassword', 'current-password', 'password', true, ${passwordValidationRules.currentPassword})}, null, null)}"></div>
                  <div th:replace="~{fragment/shared/validated-field :: field('new-password', #{account.field.new_password}, true, ~{fragment/base/input :: validatedBound('newPassword', 'new-password', 'password', true, ${passwordValidationRules.newPassword})}, null, null)}"></div>
                  <div th:replace="~{fragment/shared/validated-field :: field('confirm-password', #{account.field.confirm_password}, true, ~{fragment/base/input :: validatedMatch('confirmPassword', 'confirm-password', '#new-password', ${passwordValidationRules.confirmPassword}, #{account.validation.confirm_password.mismatch})}, null, null)}"></div>
                  <div class="modal-action">
                     <th:block th:replace="~{fragment/base/button :: modalClose('change-password-dialog', #{crud.form.cancel}, 'btn btn-sm btn-ghost')}"></th:block>
                     <th:block th:replace="~{fragment/base/button :: submit(#{crud.form.save}, null, 'btn btn-sm btn-primary', false)}"></th:block>
                  </div>
               </form>
            </section>
         </dialog>
   </th:block>
</html>
