<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="form-fields">
      <div th:replace="~{fragment/base/input :: field('title', #{announcements.field.title}, 'text', null, ${form.readonly}, ${form.validationRules.title}, true, null)}"></div>
      <div th:replace="~{fragment/base/textarea :: field('content', #{announcements.field.content}, 8, ${form.readonly}, ${form.validationRules.content}, true, null)}"></div>
      <div class="flex flex-col gap-1" th:unless="${form.readonly}">
         <div th:replace="~{fragment/base/field-label :: label('roleIds', #{announcements.field.audience}, true, null)}"></div>
         <th:block th:each="role : ${roles}">
            <div th:replace="~{fragment/base/checkbox :: field('roleIds', ${role.id}, #{roles.__${role.name}__}, false)}"></div>
         </th:block>
         <span
            class="text-error text-sm mt-1 block"
            th:if="${#fields.hasErrors('roleIds')}"
            th:errors="*{roleIds}"
         ></span>
      </div>
   </th:block>
</html>
