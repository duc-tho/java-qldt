<form
   method="post"
   th:action="@{/login}"
   class="flex flex-col items-center gap-4"
   id="login-form"
   th:fragment="login-form"
   th:object="${data}"
   x-data="formValidation"
   @submit.prevent="submit"
   novalidate
>
   <fieldset
      class="fieldset bg-base-200 border-base-300 rounded-box w-sm md:w-md lg:w-lg border p-6 shadow-lg gap-1"
   >
      <th:block th:if="${param.error}">
         <th:block th:replace="~{fragment/base/alert :: text('alert alert-error alert-soft', 'alert', #{login.error.invalid})}"></th:block>
      </th:block>
      <th:block th:if="${param.logout}">
         <th:block th:replace="~{fragment/base/alert :: text('alert alert-success alert-soft', 'alert', #{login.logout.success})}"></th:block>
      </th:block>
      <th:block th:if="${#fields.hasAnyErrors()}">
         <th:block th:replace="~{fragment/base/alert :: validationErrors('alert alert-error alert-soft flex gap-2 flex-col', null)}"></th:block>
      </th:block>
      <div th:replace="~{fragment/shared/validated-field :: field('login-email', #{login.field.email}, true, ~{fragment/base/input :: validatedNamed('login-email', 'email', 'email', #{login.field.email}, *{email}, ${validationRules.email}, true)}, 'my-1.5 flex flex-col gap-1', 'ml-3')}"></div>
      <div th:replace="~{fragment/shared/validated-field :: field('login-password', #{login.field.password}, true, ~{fragment/base/input :: validatedNamed('login-password', 'password', 'password', #{login.field.password}, null, ${validationRules.password}, true)}, 'my-1.5 flex flex-col gap-1', 'ml-3')}"></div>
      <th:block th:replace="~{fragment/base/button :: submit(#{login.action.submit}, null, 'btn btn-sm btn-primary mt-3', false)}"></th:block>
   </fieldset>
</form>
