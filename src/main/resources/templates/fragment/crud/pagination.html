<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block
      th:fragment="crud-pagination(data)"
      th:with="currentPage=${data.number}, totalPages=${data.totalPages},
        startPage=${currentPage < 4 ? 0 : (currentPage - 3)},
        endPage=${currentPage > totalPages - 5 ? totalPages - 1 : currentPage + 3}"
   >
      <div class="join" th:if="${totalPages > 1}">
         <th:block th:replace="~{fragment/crud/pagination :: pageButton(${currentPage - 1}, null, 'bi:chevron-left', ${data.first}, false, #{crud.pagination.previous})}"></th:block>

         <th:block th:if="${startPage > 0}">
            <th:block th:replace="~{fragment/crud/pagination :: pageButton(0, 1, null, false, false, null)}"></th:block>
         </th:block>

         <th:block th:if="${startPage > 1}">
            <th:block th:replace="~{fragment/crud/pagination :: ellipsis()}"></th:block>
         </th:block>

         <th:block th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}">
            <th:block th:replace="~{fragment/crud/pagination :: pageButton(${pageNumber}, ${pageNumber + 1}, null, false, ${pageNumber == currentPage}, null)}"></th:block>
         </th:block>

         <th:block th:if="${endPage < totalPages - 2}">
            <th:block th:replace="~{fragment/crud/pagination :: ellipsis()}"></th:block>
         </th:block>

         <th:block th:if="${endPage < totalPages - 1}">
            <th:block th:replace="~{fragment/crud/pagination :: pageButton(${totalPages - 1}, ${totalPages}, null, false, false, null)}"></th:block>
         </th:block>

         <th:block th:replace="~{fragment/crud/pagination :: pageButton(${currentPage + 1}, null, 'bi:chevron-right', ${data.last}, false, #{crud.pagination.next})}"></th:block>
      </div>
   </th:block>

   <button th:fragment="pageButton(page, label, icon, disabled, active, ariaLabel)"
      type="button" class="join-item btn btn-sm" th:classappend="${active} ? ' btn-active'"
      th:disabled="${disabled}" th:attr="data-page=${page}, aria-label=${ariaLabel}"
      x-on:click="submitQuery($el.dataset.page)">
      <th:block th:insert="~{fragment/base/button :: iconLabel(${label}, ${icon})}"></th:block>
   </button>

   <button th:fragment="ellipsis()" type="button"
      class="join-item btn btn-sm btn-disabled" disabled aria-hidden="true">
      <th:block th:insert="~{fragment/base/button :: iconLabel(null, 'bi:three-dots')}"></th:block>
   </button>
</html>
