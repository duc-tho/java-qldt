<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="crud-pagination(data, baseUrl)"
    th:with="listUrl=${baseUrl}, currentPage=${data.number}, totalPages=${data.totalPages},
        startPage=${currentPage < 4 ? 0 : (currentPage - 3)},
        endPage=${currentPage > totalPages - 5 ? totalPages - 1 : currentPage + 3}">
    <div class="join" th:if="${totalPages > 1}">
        <button type="button" class="join-item btn btn-sm" th:disabled="${data.first}"
            th:attr="hx-get=${listUrl}, hx-vals=|{'page': '${currentPage - 1}'}|, aria-label=#{crud.pagination.previous}"
            hx-target="#crud-table" hx-swap="outerHTML"
            hx-include="[name='search'], [name='sort'], [name='dir'], [name='size'], [name^='filters[']">
            <span class="iconify" data-icon="bi:chevron-left" aria-hidden="true"></span>
        </button>

        <button type="button" class="join-item btn btn-sm" th:if="${startPage > 0}"
            th:attr="hx-get=${listUrl}, hx-vals=|{'page': '0'}|" hx-target="#crud-table" hx-swap="outerHTML"
            hx-include="[name='search'], [name='sort'], [name='dir'], [name='size'], [name^='filters[']">1</button>

        <button type="button" class="join-item btn btn-sm btn-disabled" th:if="${startPage > 1}"
            aria-hidden="true">
            <span class="iconify" data-icon="bi:three-dots"></span>
        </button>

        <button type="button" class="join-item btn btn-sm"
            th:each="pageNumber : ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${pageNumber == currentPage} ? 'btn-active'"
            th:attr="hx-get=${listUrl}, hx-vals=|{'page': '${pageNumber}'}|"
            hx-target="#crud-table" hx-swap="outerHTML"
            hx-include="[name='search'], [name='sort'], [name='dir'], [name='size'], [name^='filters[']"
            th:text="${pageNumber + 1}"></button>

        <button type="button" class="join-item btn btn-sm btn-disabled" th:if="${endPage < totalPages - 2}"
            aria-hidden="true">
            <span class="iconify" data-icon="bi:three-dots"></span>
        </button>

        <button type="button" class="join-item btn btn-sm" th:if="${endPage < totalPages - 1}"
            th:attr="hx-get=${listUrl}, hx-vals=|{'page': '${totalPages - 1}'}|"
            hx-target="#crud-table" hx-swap="outerHTML"
            hx-include="[name='search'], [name='sort'], [name='dir'], [name='size'], [name^='filters[']"
            th:text="${totalPages}"></button>

        <button type="button" class="join-item btn btn-sm" th:disabled="${data.last}"
            th:attr="hx-get=${listUrl}, hx-vals=|{'page': '${currentPage + 1}'}|, aria-label=#{crud.pagination.next}"
            hx-target="#crud-table" hx-swap="outerHTML"
            hx-include="[name='search'], [name='sort'], [name='dir'], [name='size'], [name^='filters[']">
            <span class="iconify" data-icon="bi:chevron-right" aria-hidden="true"></span>
        </button>
    </div>
</th:block>

</html>
