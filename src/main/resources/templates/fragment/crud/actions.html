<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="crud-actions(actions, item)">
      <div class="flex items-center justify-end gap-1">
         <th:block th:each="action, actionStat : ${actions}">
            <th:block
               th:if="${actionStat.count <= T(com.nhom11.qldt.core.table.ActionDef).INLINE_ACTION_LIMIT and action.isVisible(item)}"
            >
               <th:block th:if="${action.isPost()}">
                  <th:block th:replace="~{fragment/crud/actions :: postAction(${action.getUrl(item)}, ${#messages.msg(action.label())}, ${action.icon()}, 'btn btn-ghost btn-sm')}"></th:block>
               </th:block>
               <th:block th:if="${action.isReject()}">
                  <th:block th:replace="~{fragment/base/button :: modalOpen(|reject_item_${item.id}|, ${#messages.msg(action.label())}, ${action.icon()}, 'btn btn-ghost btn-sm text-error')}"></th:block>
                  <th:block th:replace="~{fragment/feature/topic/rejection-dialog :: rejection-dialog(${item}, ${action})}"></th:block>
               </th:block>
               <th:block th:if="${!action.isDelete() and !action.isPost() and !action.isReject()}">
                  <th:block th:replace="~{fragment/base/button :: linkStyled(${action.getUrl(item)}, ${#messages.msg(action.label())}, ${action.icon()}, 'btn btn-ghost btn-sm', null)}"></th:block>
               </th:block>
               <th:block th:if="${action.isDelete()}">
                  <th:block th:replace="~{fragment/crud/delete-action :: deleteStyled(${action.getUrl(item)}, ${action.getName(item)}, ${#messages.msg(action.label())}, 'btn btn-ghost btn-sm text-error', ${action.icon()})}"></th:block>
               </th:block>
            </th:block>
         </th:block>

         <div
            th:if="${T(com.nhom11.qldt.core.table.ActionDef).hasVisibleOverflow(actions, item)}"
            class="dropdown"
         >
            <th:block th:replace="~{fragment/crud/actions :: popoverToggle(|more_action_menu_${item.id}|, |more_action_${item.id}|, #{crud.table.actions})}"></th:block>
            <ul
               class="dropdown menu bg-base-100 rounded-box w-40 p-2 shadow"
               popover
               th:id="|more_action_menu_${item.id}|"
               th:attr="style=|position-anchor: --more_action_${item.id};|"
            >
               <li
                  th:each="action, actionStat : ${actions}"
                  th:if="${actionStat.count > T(com.nhom11.qldt.core.table.ActionDef).INLINE_ACTION_LIMIT and action.isVisible(item)}"
               >
                  <th:block th:if="${action.isPost()}">
                     <th:block th:replace="~{fragment/crud/actions :: postAction(${action.getUrl(item)}, ${#messages.msg(action.label())}, ${action.icon()}, '')}"></th:block>
                  </th:block>
                  <th:block th:if="${action.isReject()}">
                     <th:block th:replace="~{fragment/base/button :: modalOpen(|reject_item_${item.id}|, ${#messages.msg(action.label())}, ${action.icon()}, 'text-error')}"></th:block>
                     <th:block th:replace="~{fragment/feature/topic/rejection-dialog :: rejection-dialog(${item}, ${action})}"></th:block>
                  </th:block>
                  <th:block th:if="${!action.isDelete() and !action.isPost() and !action.isReject()}">
                     <th:block th:replace="~{fragment/base/button :: linkStyled(${action.getUrl(item)}, ${#messages.msg(action.label())}, ${action.icon()}, '', null)}"></th:block>
                  </th:block>
                  <th:block th:if="${action.isDelete()}">
                     <th:block th:replace="~{fragment/crud/delete-action :: deleteStyled(${action.getUrl(item)}, ${action.getName(item)}, ${#messages.msg(action.label())}, 'text-error', ${action.icon()})}"></th:block>
                  </th:block>
               </li>
            </ul>
         </div>
      </div>
   </th:block>

   <button th:fragment="postAction(url, label, icon, classes)"
      type="button" th:class="${classes}" th:attr="data-post-url=${url}"
      x-on:click="postAction($el.dataset.postUrl)">
      <th:block th:insert="~{fragment/base/button :: iconLabel(${label}, ${icon})}"></th:block>
   </button>

   <button th:fragment="popoverToggle(id, anchor, label)"
      type="button" class="btn btn-ghost btn-sm btn-square"
      th:attr="popovertarget=${id}, style=|anchor-name: --${anchor};|"
      th:aria-label="${label}">
      <th:block th:insert="~{fragment/base/button :: iconLabel(null, 'bi:three-dots')}"></th:block>
   </button>
</html>
