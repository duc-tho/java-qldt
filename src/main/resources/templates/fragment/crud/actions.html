<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="crud-actions(actions, item)">
      <div class="flex items-center justify-end gap-1">
         <th:block th:each="action, actionStat : ${actions}">
            <th:block
               th:if="${actionStat.count <= T(com.nhom11.qldt.core.table.ActionDef).INLINE_ACTION_LIMIT and action.isVisible(item)}"
            >
               <button
                  th:if="${action.isPost()}"
                  type="submit"
                  class="btn btn-ghost btn-xs"
                  th:attr="formaction=${action.getUrl(item)}, formmethod='post'"
               >
                     <span
                        class="iconify"
                        th:attr="data-icon=${action.icon()}"
                        data-width="14"
                     ></span>
                     <span th:text="${#messages.msg(action.label())}"></span>
               </button>
               <th:block th:if="${action.isReject()}">
                  <button
                     type="button"
                     class="btn btn-ghost btn-xs text-error"
                     th:attr="onclick=|document.getElementById('reject_item_${item.id}').showModal()|"
                  >
                     <span class="iconify" th:attr="data-icon=${action.icon()}" data-width="14"></span>
                     <span th:text="${#messages.msg(action.label())}"></span>
                  </button>
                  <dialog th:id="|reject_item_${item.id}|" class="modal">
                     <div class="modal-box">
                        <form method="post" th:action="${action.getUrl(item)}">
                           <h3 class="text-lg font-bold" th:text="#{topics.action.reject}"></h3>
                           <label class="form-control mt-4">
                              <span class="label" th:text="#{topics.field.rejection-reason}"></span>
                              <textarea class="textarea w-full" name="reason" required maxlength="500"></textarea>
                           </label>
                           <div class="modal-action">
                              <button class="btn btn-error" th:text="#{topics.action.reject}"></button>
                              <button type="button" class="btn" th:attr="onclick=|document.getElementById('reject_item_${item.id}').close()|" th:text="#{crud.form.cancel}"></button>
                           </div>
                        </form>
                     </div>
                     <form method="dialog" class="modal-backdrop"><button>close</button></form>
                  </dialog>
               </th:block>
               <a
                  th:if="${!action.isDelete() and !action.isPost() and !action.isReject()}"
                  th:href="${action.getUrl(item)}"
                  class="btn btn-ghost btn-xs"
               >
                  <span
                     class="iconify"
                     th:attr="data-icon=${action.icon()}"
                     data-width="14"
                  ></span>
                  <span th:text="${#messages.msg(action.label())}"></span>
               </a>
               <button
                  th:if="${action.isDelete()}"
                  type="button"
                  class="btn btn-ghost btn-xs text-error"
                  th:attr="data-delete-url=${action.getUrl(item) + '/delete'}, data-delete-name=${action.getName(item)}"
                  x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
               >
                  <span
                     class="iconify"
                     th:attr="data-icon=${action.icon()}"
                     data-width="14"
                  ></span>
                  <span th:text="${#messages.msg(action.label())}"></span>
               </button>
            </th:block>
         </th:block>

         <div
            th:if="${T(com.nhom11.qldt.core.table.ActionDef).hasVisibleOverflow(actions, item)}"
            class="dropdown"
         >
            <button
               type="button"
               class="btn btn-ghost btn-xs btn-square"
               th:attr="popovertarget=|more_action_menu_${item.id}|, style=|anchor-name: --more_action_${item.id};|"
            >
               <span
                  class="iconify"
                  data-icon="bi:three-dots"
                  data-width="14"
               ></span>
            </button>
            <ul
               class="dropdown menu bg-base-100 rounded-box w-40 p-2 shadow"
               popover
               th:id="|more_action_menu_${item.id}|"
               th:attr="style=|position-anchor: --more_action_${item.id};|"
            >
               <li
                  th:each="action, actionStat : ${actions}"
                  th:if="${actionStat.count > T(com.nhom11.qldt.core.table.ActionDef).INLINE_ACTION_LIMIT and action.isVisible(item)}"
               >
                  <button
                     th:if="${action.isPost()}"
                     type="submit"
                     th:attr="formaction=${action.getUrl(item)}, formmethod='post'"
                  >
                        <span
                           class="iconify"
                           th:attr="data-icon=${action.icon()}"
                           data-width="14"
                        ></span>
                        <span th:text="${#messages.msg(action.label())}"></span>
                  </button>
                  <th:block th:if="${action.isReject()}">
                     <button
                        type="button"
                        class="text-error"
                        th:attr="onclick=|document.getElementById('reject_item_${item.id}').showModal()|"
                     >
                        <span class="iconify" th:attr="data-icon=${action.icon()}" data-width="14"></span>
                        <span th:text="${#messages.msg(action.label())}"></span>
                     </button>
                     <dialog th:id="|reject_item_${item.id}|" class="modal">
                        <div class="modal-box">
                           <form method="post" th:action="${action.getUrl(item)}">
                              <h3 class="text-lg font-bold" th:text="#{topics.action.reject}"></h3>
                              <label class="form-control mt-4">
                                 <span class="label" th:text="#{topics.field.rejection-reason}"></span>
                                 <textarea class="textarea w-full" name="reason" required maxlength="500"></textarea>
                              </label>
                              <div class="modal-action">
                                 <button class="btn btn-error" th:text="#{topics.action.reject}"></button>
                                 <button type="button" class="btn" th:attr="onclick=|document.getElementById('reject_item_${item.id}').close()|" th:text="#{crud.form.cancel}"></button>
                              </div>
                           </form>
                        </div>
                        <form method="dialog" class="modal-backdrop"><button>close</button></form>
                     </dialog>
                  </th:block>
                  <a
                     th:if="${!action.isDelete() and !action.isPost() and !action.isReject()}"
                     th:href="${action.getUrl(item)}"
                  >
                     <span
                        class="iconify"
                        th:attr="data-icon=${action.icon()}"
                        data-width="14"
                     ></span>
                     <span th:text="${#messages.msg(action.label())}"></span>
                  </a>
                  <button
                     th:if="${action.isDelete()}"
                     type="button"
                     class="text-error"
                     th:attr="data-delete-url=${action.getUrl(item) + '/delete'}, data-delete-name=${action.getName(item)}"
                     x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
                  >
                     <span
                        class="iconify"
                        th:attr="data-icon=${action.icon()}"
                        data-width="14"
                     ></span>
                     <span th:text="${#messages.msg(action.label())}"></span>
                  </button>
               </li>
            </ul>
         </div>
      </div>
   </th:block>
</html>
