<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="delete-modal">
      <dialog
         id="crud-delete-modal"
         class="modal"
         x-data="crudDeleteModal"
         x-on:crud-delete-request.window="open($event.detail)"
         x-ref="dialog"
      >
         <form method="post" x-ref="form" class="modal-box p-0">
            <input
               type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"
            />
            <template x-for="id in ids" :key="id">
               <input type="hidden" name="ids" :value="id" />
            </template>
            <th:block th:replace="~{fragment/base/dialog :: panel(#{crud.delete.title}, 'bi:exclamation-triangle', 'text-error', ~{::#delete-dialog-content}, ~{::#delete-dialog-actions})}">
               <p id="delete-dialog-content">
                  <span th:text="#{crud.delete.confirm}"></span>
                  <span class="font-semibold" x-text="name"></span>?
               </p>
               <th:block id="delete-dialog-actions">
                  <th:block th:replace="~{fragment/base/button :: modalRefClose(#{crud.delete.cancel}, 'bi:x-lg', 'btn btn-sm btn-ghost')}"></th:block>
                  <th:block th:replace="~{fragment/base/button :: submit(#{crud.delete.submit}, 'bi:trash', 'btn btn-sm btn-error', false)}"></th:block>
               </th:block>
            </th:block>
         </form>
         <form method="dialog" class="modal-backdrop">
            <th:block th:replace="~{fragment/base/button :: dialogDismiss(#{crud.delete.close})}"></th:block>
         </form>
      </dialog>
   </th:block>
</html>
