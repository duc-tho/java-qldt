<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="crud-table(table, extraFilters)">
      <div id="crud-table" x-data="crudTable">
         <form method="get" th:action="${table.baseUrl}" x-ref="queryForm">
            <input type="hidden" name="page" th:value="${table.data.number}" />
            <input type="hidden" name="sort" th:value="${table.sortField}" />
            <input type="hidden" name="dir" th:value="${table.sortDir}" />
            <th:block th:if="${extraFilters != null}">
               <th:block th:replace="${extraFilters}"></th:block>
            </th:block>

            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
               <div class="flex items-center gap-2">
                  <th:block th:replace="~{fragment/crud/table-controls :: reload(#{crud.table.reload})}"></th:block>
               </div>

               <div class="flex flex-wrap items-center gap-2">
                  <input
                     th:if="${!#lists.isEmpty(table.searchableColumns)}"
                     type="search"
                     name="search"
                     th:value="${table.search}"
                     th:placeholder="#{crud.table.search}"
                     class="input input-md w-56"
                     x-on:change="submitQuery(0)"
                  />
                  <th:block th:if="${table.bulkDeleteEnabled}">
                     <th:block th:replace="~{fragment/crud/table-controls :: batchDelete(${table.bulkDeleteUrl}, #{crud.delete.batch}, #{crud.table.delete_selected})}"></th:block>
                  </th:block>
                  <th:block th:if="${table.canCreate and (tableCanCreate == null or tableCanCreate)}">
                     <th:block th:replace="~{fragment/base/button :: linkStyled(${table.createUrl}, #{crud.action.add}, 'bi:plus-lg', 'btn btn-primary btn-sm', null)}"></th:block>
                  </th:block>
               </div>
            </div>

            <div class="overflow-x-auto rounded-box border-2 border-base-300">
               <th:block th:replace="~{fragment/base/table :: table('table table-zebra w-full min-w-max text-sm [&_th]:min-w-32 [&_td]:min-w-32 table-md', ~{::#crud-table-head}, ~{::#crud-table-body})}">
                  <thead id="crud-table-head" th:fragment="crud-table-head" class="bg-base-200">
                     <tr>
                        <th th:if="${table.bulkDeleteEnabled}" class="w-10">
                           <input
                              type="checkbox"
                              id="crud-select-all"
                              class="checkbox checkbox-sm"
                              th:title="#{crud.table.select_all}"
                              x-bind:checked="allSelected"
                              x-on:change="toggleAll($event)"
                           />
                        </th>
                        <th:block th:each="col : ${table.columns}">
                           <th
                              th:with="isSorted=${col.field == table.sortField},
                                        isAsc=${col.field == table.sortField && table.sortDir == 'asc'},
                                        isDesc=${col.field == table.sortField && table.sortDir == 'desc'}"
                           >
                              <th:block th:if="${col.sortable}">
                                 <th:block th:replace="~{fragment/crud/table-controls :: sort(${col.field}, ${#messages.msg(col.label)}, ${isSorted}, ${isAsc}, ${isDesc})}"></th:block>
                              </th:block>
                              <span
                                 th:unless="${col.sortable}"
                                 class="text-sm"
                                 th:text="${#messages.msg(col.label)}"
                              ></span>
                           </th>
                        </th:block>
                        <th
                           class="text-right min-w-fit"
                           th:text="#{crud.table.actions}"
                        ></th>
                     </tr>
                     <tr th:if="${!#lists.isEmpty(table.filterableColumns)}">
                        <th th:if="${table.bulkDeleteEnabled}">
                           <th:block th:replace="~{fragment/crud/table-controls :: search(#{crud.table.search})}"></th:block>
                        </th>
                        <th:block th:each="col : ${table.columns}">
                           <th>
                              <input
                                 th:if="${col.filterable}"
                                 type="search"
                                 class="input input-md w-full"
                                 th:name="|filters[${col.field}]|"
                                 th:value="${table.filters[col.field]}"
                                 th:placeholder="${'Tìm kiếm theo ' + #messages.msg(col.label)}"
                                 x-on:change="submitQuery(0)"
                              />
                           </th>
                        </th:block>
                        <th></th>
                     </tr>
                  </thead>
                  <th:block id="crud-table-body" th:fragment="crud-table-body">
                  <tbody th:if="${!table.data.empty}">
                     <tr
                        th:each="item : ${table.data.content}"
                        class="cursor-pointer transition-colors hover:bg-base-200"
                     >
                        <td th:if="${table.bulkDeleteEnabled}">
                           <input
                              type="checkbox"
                              name="ids"
                              class="checkbox checkbox-sm"
                              th:value="${item.id}"
                              x-model="selectedIds"
                           />
                        </td>
                        <th:block th:each="col : ${table.columns}">
                           <td>
                              <span
                                 th:if="${col.field == 'status'}"
                                 class="badge badge-soft"
                                 th:classappend="${item.status.name() == 'PUBLISHED' or item.status.name() == 'APPROVED'} ? ' badge-success' : (${item.status.name() == 'WITHDRAWN'} ? ' badge-neutral' : (${item.status.name() == 'REJECTED'} ? ' badge-error' : ' badge-warning'))"
                                 th:text="${col.getValue(item)}"
                              ></span>
                              <span
                                 th:if="${col.field == 'stage'}"
                                 class="badge badge-primary badge-soft"
                                 th:text="${col.getValue(item)}"
                              ></span>
                              <a
                                 th:unless="${col.field == 'status' or col.field == 'stage'}"
                                 th:href="${table.baseUrl + '/' + item.id}"
                                 class="block"
                                 th:text="${col.getValue(item)}"
                              ></a>
                           </td>
                        </th:block>
                        <td>
                           <th:block
                              th:replace="~{fragment/crud/actions :: crud-actions(${table.actions}, ${item})}"
                           ></th:block>
                        </td>
                     </tr>
                  </tbody>
                  <tbody th:if="${table.data.empty}">
                     <tr>
                        <td
                           th:attr="colspan=${#lists.size(table.columns) + (table.bulkDeleteEnabled ? 2 : 1)}"
                           class="text-center text-base-content/70 py-6"
                           th:text="#{crud.table.empty}"
                        ></td>
                     </tr>
                  </tbody>
                  </th:block>
               </th:block>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-3 mt-4">
               <div
                  class="flex items-center gap-2 text-sm text-base-content/70"
               >
                  <span
                     th:text="|#{crud.table.page} ${table.data.totalPages == 0 ? 0 : table.data.number + 1} / ${table.data.totalPages}|"
                  ></span>

                  <select
                     name="size"
                     class="select select-md w-20"
                     x-on:change="submitQuery(0)"
                  >
                     <option
                        th:each="pageSize : ${table.pageSizeOptions}"
                        th:value="${pageSize}"
                        th:selected="${pageSize == table.pageSize}"
                        th:text="${pageSize}"
                     ></option>
                  </select>

                  <span th:text="#{crud.table.per_page}"></span>
               </div>

               <div
                  th:replace="~{fragment/crud/pagination :: crud-pagination(${table.data})}"
               ></div>
            </div>
         </form>
      </div>
   </th:block>
</html>
