<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="crud-form(form)">
      <form
         th:unless="${form.readonly}"
         method="post"
         th:action="${form.actionUrl}"
         th:object="${data}"
         th:class="${form.layoutClass}"
         novalidate
         x-data="formValidation"
         @submit.prevent="submit"
      >
         <div class="flex flex-col gap-5">
            <th:block th:if="${#fields.hasAnyErrors()}">
               <th:block th:replace="~{fragment/base/alert :: validationErrors('alert alert-error alert-soft flex gap-2 flex-col', 'assertive')}"></th:block>
            </th:block>

            <th:block
               th:replace="~{${form.fieldsTemplate} :: form-fields}"
            ></th:block>

            <div
               class="flex items-center justify-end gap-3 pt-2 border-t border-base-300"
            >
               <th:block th:replace="~{fragment/base/button :: linkStyled(${form.backUrl}, #{crud.form.cancel}, null, 'btn btn-ghost btn-sm', null)}"></th:block>
               <th:block th:replace="~{fragment/base/button :: submit(#{crud.form.save}, 'bi:check-lg', 'btn btn-primary btn-sm', false)}"></th:block>
            </div>
         </div>
      </form>

      <div
         th:if="${form.readonly}"
         th:class="|flex flex-col gap-5 ${form.layoutClass}|"
         th:object="${data}"
      >
         <th:block
            th:replace="~{${form.fieldsTemplate} :: form-fields}"
         ></th:block>
      </div>
   </th:block>
</html>
