<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="crud-form(form)">
    <form th:unless="${form.readonly}" method="post" th:action="${form.actionUrl}" th:object="${form.data}"
        class="w-full lg:w-1/2" novalidate x-data="formValidation" @submit.prevent="submit">

        <div class="flex flex-col gap-5">
            <div th:if="${#fields.hasAnyErrors()}" role="alert" aria-live="assertive"
                class="alert alert-error alert-soft flex gap-2 flex-col">
                <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
            </div>

            <th:block th:replace="~{${form.fieldsTemplate} :: form-fields(${form.data}, ${form.readonly}, ${form.validationRules})}"></th:block>

            <div class="flex items-center justify-end gap-3 pt-2 border-t border-base-300">
                <a th:href="${form.backUrl}" class="btn btn-ghost btn-sm" th:text="#{crud.form.cancel}"></a>
                <button type="submit" class="btn btn-primary btn-sm">
                    <span class="iconify inline" data-icon="bi:check-lg" data-width="16"></span>
                    <span th:text="#{crud.form.save}"></span>
                </button>
            </div>
        </div>
    </form>

    <div th:if="${form.readonly}" class="flex w-full flex-col gap-5 lg:w-1/2" th:object="${form.data}">
        <th:block th:replace="~{${form.fieldsTemplate} :: form-fields(${form.data}, ${form.readonly}, ${form.validationRules})}"></th:block>
    </div>
</th:block>

</html>
