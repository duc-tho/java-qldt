<div class="navbar bg-base-200">
   <div class="navbar-start">
      <label
         for="my-drawer-4"
         th:aria-label="#{navigation.action.open-sidebar}"
         class="btn btn-square btn-ghost drawer-button"
         ><span
            class="iconify inline"
            data-icon="bi:list"
            data-width="20"
         ></span
      ></label>
   </div>
   <div class="navbar-center">
      <a href="/" class="btn btn-ghost text-xl">QLĐT</a>
   </div>
   <div class="navbar-end">
      <button
         class="btn btn-ghost btn-circle"
         th:aria-label="#{navigation.action.search}"
      >
         <span
            class="iconify inline"
            data-icon="bi:search"
            data-width="20"
         ></span></button
      ><button
         class="btn btn-ghost btn-circle"
         th:aria-label="#{navigation.action.notifications}"
      >
         <div class="indicator">
            <span
               class="iconify inline"
               data-icon="bi:bell"
               data-width="20"
            ></span
            ><span class="badge badge-xs badge-primary indicator-item"></span>
         </div>
      </button>
      <form method="post" th:action="@{/logout}">
         <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
         /><button
            type="submit"
            class="btn btn-ghost btn-circle"
            th:aria-label="#{navigation.action.logout}"
         >
            <span
               class="iconify inline"
               data-icon="bi:box-arrow-right"
               data-width="20"
            ></span>
         </button>
      </form>
   </div>
</div>
