<div class="navbar relative z-30 bg-base-200">
   <div class="navbar-start gap-1">
      <th:block th:replace="~{fragment/ui/navigation-actions :: drawerToggle('my-drawer-4', #{navigation.action.close-sidebar}, 'sidebar-toggle-open btn btn-sm btn-square btn-ghost drawer-button', 'bi:arrow-bar-left')}"></th:block>
      <th:block th:replace="~{fragment/ui/navigation-actions :: drawerToggle('my-drawer-4', #{navigation.action.open-sidebar}, 'sidebar-toggle-closed btn btn-sm btn-square btn-ghost drawer-button', 'bi:arrow-bar-right')}"></th:block>
      <th:block th:replace="~{fragment/ui/navigation-actions :: navLink('/', #{navigation.item.home}, 'bi:house', 'btn btn-sm btn-ghost gap-2 px-3', true)}"></th:block>
   </div>
   <div class="navbar-end gap-1">
      <th:block sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
         <th:block th:replace="~{fragment/ui/navigation-actions :: navLink('/thong-bao', #{navigation.action.notifications}, 'bi:bell', 'btn btn-sm btn-square btn-ghost', false)}"></th:block>
      </th:block>
      <span
         class="flex size-10 items-center justify-center text-base-content/70"
         role="img"
         sec:authorize="!hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')"
         xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
         th:aria-label="#{navigation.action.notifications}"
      >
         <span class="iconify" data-icon="bi:bell" data-width="20" aria-hidden="true"></span>
      </span>
      <details class="dropdown dropdown-end" th:if="${currentUser != null}">
         <summary th:replace="~{fragment/ui/navigation-actions :: menuSummary(#{navigation.item.account}, 'btn btn-sm btn-ghost h-auto min-h-10 gap-2 px-2 py-1', ~{::#account-menu-summary})}">
            <th:block id="account-menu-summary" th:fragment="account-menu-summary">
            <span class="hidden min-w-0 max-w-40 text-right sm:block">
               <span class="block truncate text-sm font-semibold" th:text="${currentUser.fullName}"></span>
               <span class="block truncate text-sm text-base-content/70">
                  <span
                     th:each="role, iter : ${currentUser.roles}"
                     th:text="|#{roles.__${role.name}__}${iter.last ? '' : ' / '}|"
                  ></span>
               </span>
            </span>
            <div th:replace="~{fragment/base/avatar :: initial(${#strings.substring(currentUser.fullName, 0, 1)}, 'size-9', '')}"></div>
            </th:block>
         </summary>
         <ul
            class="dropdown-content menu z-50 mt-3 w-64 rounded-box bg-base-100 p-2 shadow-lg"
         >
            <li class="menu-title">
               <span th:text="${currentUser.fullName}"></span>
            </li>
            <li class="menu-disabled">
               <span th:text="${currentUser.email}"></span>
            </li>
            <li class="menu-disabled">
               <span
                  th:each="role, iter : ${currentUser.roles}"
                  th:text="|#{roles.__${role.name}__}${iter.last ? '' : ', '}|"
               ></span>
            </li>
            <li>
               <a href="/tai-khoan"
                  ><span class="iconify" data-icon="bi:person-gear"></span
                  ><span th:text="#{navigation.item.account}"></span
               ></a>
            </li>
            <li>
               <form method="post" th:action="@{/logout}">
                  <input
                     type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}"
                  /><th:block th:replace="~{fragment/base/button :: submitContent('flex w-full items-center gap-2 text-left', ~{::nav-logout-content})}">
                     <th:block th:fragment="nav-logout-content">
                     <span class="iconify" data-icon="bi:box-arrow-right"></span
                     ><span th:text="#{navigation.action.logout}"></span>
                     </th:block>
                  </th:block>
               </form>
            </li>
         </ul>
      </details>
   </div>
</div>
