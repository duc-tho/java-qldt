<div class="navbar bg-base-200">
   <div class="navbar-start">
      <label
         for="my-drawer-4"
         th:aria-label="#{navigation.action.open-sidebar}"
         class="btn btn-square btn-ghost drawer-button"
         ><span
            class="iconify inline"
            data-icon="bi:list"
            data-width="20"
         ></span
      ></label>
   </div>
   <div class="navbar-center">
      <a href="/" class="btn btn-ghost text-xl">QLĐT</a>
   </div>
   <div class="navbar-end">
      <details class="dropdown dropdown-end" th:if="${currentUser != null}">
         <summary
            class="btn btn-ghost btn-circle"
            th:aria-label="#{navigation.item.account}"
         >
            <div class="avatar avatar-placeholder">
               <div class="flex w-9 items-center justify-center rounded-full bg-primary text-primary-content">
                  <span
                     th:text="${#strings.substring(currentUser.fullName, 0, 1)}"
                  ></span>
               </div>
            </div>
         </summary>
         <ul
            class="dropdown-content menu z-10 mt-3 w-64 rounded-box bg-base-100 p-2 shadow-lg"
         >
            <li class="menu-title">
               <span th:text="${currentUser.fullName}"></span>
            </li>
            <li class="menu-disabled">
               <span th:text="${currentUser.email}"></span>
            </li>
            <li class="menu-disabled">
               <span
                  th:each="role, iter : ${currentUser.roles}"
                  th:text="|#{roles.__${role.name}__}${iter.last ? '' : ', '}|"
               ></span>
            </li>
            <li>
               <a href="/account"
                  ><span class="iconify" data-icon="bi:person-gear"></span
                  ><span th:text="#{navigation.item.account}"></span
               ></a>
            </li>
            <li>
               <form method="post" th:action="@{/logout}">
                  <input
                     type="hidden"
                     th:name="${_csrf.parameterName}"
                     th:value="${_csrf.token}"
                  /><button type="submit" class="flex w-full items-center gap-2 text-left">
                     <span class="iconify" data-icon="bi:box-arrow-right"></span
                     ><span th:text="#{navigation.action.logout}"></span>
                  </button>
               </form>
            </li>
         </ul>
      </details>
   </div>
</div>
