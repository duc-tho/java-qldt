<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="registrations(registrations)">
      <div class="mt-4 overflow-x-auto rounded-box border-2 border-base-300">
         <table class="table table-zebra min-w-max [&_th]:min-w-32 [&_td]:min-w-32">
            <thead class="bg-base-200">
               <tr>
                  <th th:text="#{student-groups.field.name}"></th>
                  <th th:text="#{student-groups.topic}"></th>
                  <th th:text="#{announcements.column.status}"></th>
               </tr>
            </thead>
            <tbody>
               <tr th:each="registration : ${registrations}">
                  <td th:text="${registration.studentGroup.name}"></td>
                  <td th:text="${registration.topic.title}"></td>
                  <td
                     th:text="#{topic-registrations.status.__${registration.status.name()}__}"
                  ></td>
               </tr>
               <tr th:if="${#lists.isEmpty(registrations)}">
                  <td
                     colspan="3"
                     class="text-center text-base-content/50"
                     th:text="#{crud.table.empty}"
                  ></td>
               </tr>
            </tbody>
         </table>
      </div>
   </th:block>
</html>
