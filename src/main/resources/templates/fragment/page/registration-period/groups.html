<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <a
            class="btn btn-ghost btn-sm"
            href="/registration-periods/groups"
            th:text="#{crud.form.cancel}"
         ></a>
      </th:block>
      <th:block layout:fragment="page-content">
         <p class="mb-4 text-base-content/60" th:text="${period.name}"></p>
         <div
            th:replace="~{fragment/page/registration-period/registrations :: registrations(${registrations})}"
         ></div>
      </th:block>
   </body>
</html>
