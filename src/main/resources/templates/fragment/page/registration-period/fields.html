<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="form-fields">
      <div
         class="flex flex-col gap-6"
         x-data="{ periodType: '' }"
         x-init="periodType = $el.querySelector('#periodType').value"
      >
         <fieldset class="fieldset">
            <legend
               class="fieldset-legend"
               th:text="#{registration-periods.section.general}"
            ></legend>
            <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
               <div class="form-control">
                  <label
                     class="label"
                     for="name"
                     th:text="#{registration-periods.field.name}"
                  ></label
                  ><input
                     id="name"
                     name="name"
                     class="input w-full"
                     th:classappend="${#fields.hasErrors('name')} ? ' input-error'"
                     th:field="*{name}"
                     th:readonly="${form.readonly}"
                     th:attr="validate-data=${form.validationRules.name}"
                  />
                  <div id="name-error">
                     <span
                        class="text-error text-sm mt-1 block"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}"
                     ></span>
                  </div>
               </div>
               <div class="form-control">
                  <label
                     class="label"
                     for="periodType"
                     th:text="#{registration-periods.field.type}"
                  ></label
                  ><select
                     id="periodType"
                     th:field="*{periodType}"
                     x-model="periodType"
                     class="select w-full"
                     th:classappend="${#fields.hasErrors('periodType')} ? ' select-error'"
                     th:disabled="${form.readonly}"
                     th:attr="validate-data=${form.validationRules.periodType}"
                  >
                     <option value=""></option>
                     <option
                        th:each="type : ${periodTypes}"
                        th:value="${type}"
                        th:text="#{period-types.__${type.name()}__}"
                     ></option>
                  </select>
                  <div id="periodType-error">
                     <span
                        class="text-error text-sm mt-1 block"
                        th:if="${#fields.hasErrors('periodType')}"
                        th:errors="*{periodType}"
                     ></span>
                  </div>
               </div>
            </div>
         </fieldset>
         <fieldset class="fieldset">
            <legend
               class="fieldset-legend"
               th:text="#{registration-periods.section.registration-and-publication}"
            ></legend>
            <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
               <th:block
                  th:each="field : ${ {'lecturerRegistrationStart', 'lecturerRegistrationEnd', 'studentRegistrationStart', 'studentRegistrationEnd'} }"
               >
                  <div class="form-control">
                     <label
                        class="label"
                        th:for="${field}"
                        th:text="#{registration-periods.field.__${field}__}"
                     ></label>
                     <input
                        type="text"
                        readonly
                        data-date-picker
                        placeholder="dd/MM/yyyy HH:mm"
                        th:field="*{__${field}__}"
                        class="input w-full"
                        th:classappend="${#fields.hasErrors(field)} ? ' input-error'"
                        th:attr="validate-data=${form.validationRules.get(field)}, data-date-picker-mode=${form.readonly} ? 'display' : 'edit'"
                     />
                     <div th:id="|${field}-error|">
                        <span
                           class="text-error text-sm mt-1 block"
                           th:if="${#fields.hasErrors(field)}"
                           th:errors="*{__${field}__}"
                        ></span>
                     </div>
                  </div>
               </th:block>
            </div>
         </fieldset>
         <fieldset class="fieldset">
            <legend
               class="fieldset-legend"
               th:text="#{registration-periods.section.evaluation}"
            ></legend>
            <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
               <th:block
                  th:each="field : ${ {'reportDeadline', 'reviewerDeadline', 'councilDate'} }"
               >
                  <div
                     class="form-control"
                     th:attr="x-show=${field == 'reviewerDeadline'} ? 'periodType === &quot;TLCN&quot; || periodType === &quot;KLTN&quot;' : (${field == 'councilDate'} ? 'periodType === &quot;KLTN&quot;' : null)"
                  >
                     <label
                        class="label"
                        th:for="${field}"
                        th:text="#{registration-periods.field.__${field}__}"
                     ></label>
                     <input
                        type="text"
                        readonly
                        data-date-picker
                        placeholder="dd/MM/yyyy HH:mm"
                        th:field="*{__${field}__}"
                        class="input w-full"
                        th:classappend="${#fields.hasErrors(field)} ? ' input-error'"
                        th:attr="validate-data=${form.validationRules.get(field)}, data-date-picker-mode=${form.readonly} ? 'display' : 'edit', x-effect=${field == 'reviewerDeadline'} ? '$el.disabled = !(periodType === &quot;TLCN&quot; || periodType === &quot;KLTN&quot;)' : (${field == 'councilDate'} ? '$el.disabled = periodType !== &quot;KLTN&quot;' : null)"
                     />
                     <div th:id="|${field}-error|">
                        <span
                           class="text-error text-sm mt-1 block"
                           th:if="${#fields.hasErrors(field)}"
                           th:errors="*{__${field}__}"
                        ></span>
                     </div>
                  </div>
               </th:block>
            </div>
         </fieldset>
      </div>
   </th:block>
</html>
