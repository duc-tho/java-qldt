<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><th:block th:fragment="form-fields(data, isReadonly, validationRules)"><div class="grid grid-cols-1 gap-3 md:grid-cols-2"><div class="form-control"><label class="label">Tên đợt</label><input name="name" class="input w-full" th:value="*{name}" th:readonly="${isReadonly}"/></div><div class="form-control"><label class="label">Loại đợt</label><select name="periodType" class="select w-full" th:disabled="${isReadonly}"><option th:each="type:${periodTypes}" th:value="${type}" th:text="${type}" th:selected="${type==data.periodType}"></option></select></div><div th:each="field:${ {'lecturerRegistrationStart','lecturerRegistrationEnd','topicPublicationAt','studentRegistrationStart','studentRegistrationEnd','reportDeadline','reviewerDeadline','councilDate'} }" class="form-control"><label class="label" th:text="${field}"></label><input type="datetime-local" th:name="${field}" class="input w-full" th:value="${#temporals.format(__${field}__, 'yyyy-MM-dd''T''HH:mm')}" th:readonly="${isReadonly}"/></div></div></th:block></html>
