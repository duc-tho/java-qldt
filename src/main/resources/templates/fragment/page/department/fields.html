<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="form-fields(data, isReadonly, validationRules)">
    <div class="grid grid-cols-1 gap-3 md:grid-cols-2">
        <div class="form-control">
            <label class="label" for="code"><span class="label-text font-bold" th:text="#{departments.field.code}"></span></label>
            <input id="code" type="text" name="code" class="input w-full" th:classappend="${#fields.hasErrors('code')} ? ' input-error'" th:value="*{code}" th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.code}" />
            <span class="label-text-alt text-error" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
        </div>
        <div class="form-control">
            <label class="label" for="name"><span class="label-text font-bold" th:text="#{departments.field.name}"></span></label>
            <input id="name" type="text" name="name" class="input w-full" th:classappend="${#fields.hasErrors('name')} ? ' input-error'" th:value="*{name}" th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.name}" />
            <span class="label-text-alt text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
    </div>
</th:block>
</html>
