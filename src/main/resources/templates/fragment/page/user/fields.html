<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="form-fields(data, isReadonly, validationRules)">
    <div class="flex flex-col gap-3">
        <div class="form-control">
            <label class="label" for="fullName">
                <span class="label-text font-bold" th:text="#{users.field.full_name}"></span>
            </label>
            <input id="fullName" type="text" name="fullName" class="input w-full"
                th:classappend="${#fields.hasErrors('fullName')} ? ' input-error'" th:value="*{fullName}"
                th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.fullName}" />
            <div id="fullName-error" class="ml-3">
                <span class="label-text-alt text-error" th:if="${#fields.hasErrors('fullName')}"
                    th:errors="*{fullName}"></span>
            </div>
        </div>

        <div class="form-control">
            <label class="label" for="userCode"><span class="label-text font-bold" th:text="#{users.field.user_code}"></span></label>
            <input id="userCode" type="text" name="userCode" class="input w-full" th:value="*{userCode}" th:readonly="${isReadonly}" />
        </div>

        <div class="form-control">
            <label class="label" for="departmentId"><span class="label-text font-bold" th:text="#{users.field.department}"></span></label>
            <select id="departmentId" name="departmentId" class="select w-full" th:disabled="${isReadonly}">
                <option value=""></option>
                <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}" th:selected="${department.id == data.departmentId}"></option>
            </select>
        </div>

        <div class="form-control" th:unless="${isReadonly}">
            <span class="label-text font-bold" th:text="#{users.field.roles}"></span>
            <label class="label justify-start gap-3" th:each="role : ${roles}">
                <input type="checkbox" name="roleIds" class="checkbox" th:value="${role.id}" th:checked="${data.roleIds != null and data.roleIds.contains(role.id)}" />
                <span class="label-text" th:text="${role.name}"></span>
            </label>
        </div>

        <div class="form-control">
            <label class="label" for="email">
                <span class="label-text font-bold" th:text="#{users.field.email}"></span>
            </label>
            <input id="email" type="email" name="email" class="input w-full"
                th:classappend="${#fields.hasErrors('email')} ? ' input-error'" th:value="*{email}"
                th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.email}" />
            <div id="email-error" class="ml-3">
                <span class="label-text-alt text-error" th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"></span>
            </div>
        </div>

        <div class="form-control">
            <label class="label" for="username">
                <span class="label-text font-bold" th:text="#{users.field.username}"></span>
            </label>
            <input id="username" type="text" name="username" class="input w-full"
                th:classappend="${#fields.hasErrors('username')} ? ' input-error'" th:value="*{username}"
                th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.username}" />
            <div id="username-error" class="ml-3">
                <span class="label-text-alt text-error" th:if="${#fields.hasErrors('username')}"
                    th:errors="*{username}"></span>
            </div>
        </div>

        <div class="form-control" th:unless="${isReadonly}">
            <label class="label" for="password">
                <span class="label-text font-bold" th:text="#{users.field.password}"></span>
            </label>
            <input id="password" type="password" name="password" class="input w-full"
                th:classappend="${#fields.hasErrors('password')} ? ' input-error'"
                th:placeholder="${data.id != null ? #messages.msg('users.field.password.placeholder') : ''}"
                th:attr="validate-data=${validationRules.password}" />
            <div id="password-error" class="ml-3">
                <span class="label-text-alt text-error" th:if="${#fields.hasErrors('password')}"
                    th:errors="*{password}"></span>
            </div>
        </div>

        <div class="form-control">
            <label class="label" for="phone">
                <span class="label-text font-bold" th:text="#{users.field.phone}"></span>
            </label>
            <input id="phone" type="text" name="phone" class="input w-full"
                th:classappend="${#fields.hasErrors('phone')} ? ' input-error'" th:value="*{phone}"
                th:readonly="${isReadonly}" th:attr="validate-data=${validationRules.phone}" />
            <div id="phone-error" class="ml-3">
                <span class="label-text-alt text-error" th:if="${#fields.hasErrors('phone')}"
                    th:errors="*{phone}"></span>
            </div>
        </div>
    </div>
</th:block>

</html>
