<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div
            class="card card-border border-base-300 shadow-sm overflow-x-auto"
         >
            <table class="table min-w-max [&_th]:min-w-32 [&_td]:min-w-32">
               <thead>
                  <tr>
                     <th th:text="#{student-groups.field.name}"></th>
                     <th
                        th:text="#{topic-registrations.field.registration-period}"
                     ></th>
                     <th th:text="#{student-groups.topic}"></th>
                     <th th:text="#{topic-registrations.field.department}"></th>
                     <th th:text="#{topics.column.status}"></th>
                     <th th:text="#{crud.table.actions}"></th>
                  </tr>
               </thead>
               <tbody>
                  <tr th:each="registration : ${registrations}">
                     <td th:text="${registration.studentGroup.name}"></td>
                     <td
                        th:text="${registration.studentGroup.registrationPeriod.name}"
                     ></td>
                     <td th:text="${registration.topic.title}"></td>
                     <td th:text="${registration.topic.department.name}"></td>
                     <td>
                        <span
                           class="badge badge-soft"
                           th:classappend="badge-warning"
                           th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"
                        ></span>
                     </td>
                     <td>
                        <a
                           class="btn btn-primary btn-sm"
                           th:href="@{/topic-registrations/{id}(id=${registration.id})}"
                           th:text="#{topic-registrations.action.review}"
                        ></a>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
         <div
            role="alert"
            class="alert alert-info"
            th:if="${#lists.isEmpty(registrations)}"
            th:text="#{crud.table.empty}"
         ></div>
      </th:block>
   </body>
</html>
