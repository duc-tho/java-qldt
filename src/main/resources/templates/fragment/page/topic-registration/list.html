<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <form method="get" th:action="@{/topic-registrations}" class="mb-4">
            <fieldset class="fieldset">
               <legend class="fieldset-legend" th:text="#{topic-registrations.filter.status}"></legend>
               <select class="select select-sm" name="status" onchange="this.form.submit()">
                  <option value="" th:selected="${selectedStatus == null}" th:text="#{topic-registrations.filter.all}"></option>
                  <option
                     th:each="reviewStatus : ${reviewStatuses}"
                     th:value="${reviewStatus.name()}"
                     th:selected="${selectedStatus == reviewStatus}"
                     th:text="#{__${'topic-registrations.status.' + reviewStatus.name()}__}"
                  ></option>
               </select>
            </fieldset>
         </form>
         <div
            class="card card-border border-base-300 shadow-sm overflow-x-auto"
         >
            <table class="table min-w-max [&_th]:min-w-32 [&_td]:min-w-32">
               <thead>
                  <tr>
                     <th th:text="#{student-groups.field.name}"></th>
                     <th
                        th:text="#{topic-registrations.field.registration-period}"
                     ></th>
                     <th th:text="#{student-groups.topic}"></th>
                     <th th:text="#{topic-registrations.field.department}"></th>
                     <th th:text="#{topics.column.status}"></th>
                     <th th:text="#{crud.table.actions}"></th>
                  </tr>
               </thead>
               <tbody>
                  <tr th:each="registration : ${registrations}">
                     <td><a class="link link-primary" th:href="@{/registration-periods/{periodId}/student-group/{groupId}(periodId=${registration.studentGroup.registrationPeriod.id},groupId=${registration.studentGroup.id})}" th:text="${registration.studentGroup.name}"></a></td>
                     <td
                        th:text="${registration.studentGroup.registrationPeriod.name}"
                     ></td>
                     <td th:text="${registration.topic.title}"></td>
                     <td th:text="${registration.topic.department.name}"></td>
                     <td>
                        <span
                           class="badge badge-soft"
                            th:classappend="${registration.status.name() == 'PENDING'} ? ' badge-warning' : (${registration.status.name() == 'APPROVED'} ? ' badge-success' : (${registration.status.name() == 'DRAFT'} ? ' badge-info' : ' badge-error'))"
                           th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"
                        ></span>
                     </td>
                     <td>
                        <a
                           class="btn btn-sm"
                           th:classappend="${registration.status.name() == 'PENDING'} ? ' btn-primary' : ' btn-outline'"
                           th:href="@{/topic-registrations/{id}(id=${registration.id})}"
                        >
                           <span th:if="${registration.status.name() == 'PENDING'}" th:text="#{topic-registrations.action.review}"></span>
                           <span th:unless="${registration.status.name() == 'PENDING'}" th:text="#{topic-registrations.action.detail}"></span>
                        </a>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
         <div
            role="alert"
            class="alert alert-info"
            th:if="${#lists.isEmpty(registrations)}"
            th:text="#{crud.table.empty}"
         ></div>
      </th:block>
   </body>
</html>
