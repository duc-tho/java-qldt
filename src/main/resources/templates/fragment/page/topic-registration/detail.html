<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div role="alert" class="alert alert-error mb-5" th:if="${error != null}"
            th:text="#{__${error}__}"></div>

         <article class="card card-border w-full max-w-4xl overflow-hidden border-base-300 bg-base-100 shadow-sm">
            <div class="card-body gap-0 p-0">
               <header class="flex flex-col justify-between gap-3 border-b border-base-300 bg-base-200/70 p-5 sm:flex-row sm:items-center sm:px-6">
                  <div class="min-w-0">
                     <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-base-content/60">
                        <span class="flex items-center gap-1.5">
                           <span class="iconify text-primary" data-icon="bi:calendar3"></span>
                           <span th:text="${registration.studentGroup.registrationPeriod.name}"></span>
                        </span>
                     </div>
                     <h2 class="mt-2 text-lg font-semibold">
                        <a class="link link-hover"
                           th:href="@{/registration-periods/{periodId}/student-group/{groupId}(periodId=${registration.studentGroup.registrationPeriod.id},groupId=${registration.studentGroup.id})}"
                           th:text="${registration.studentGroup.name}"></a>
                     </h2>
                  </div>
                  <span class="badge badge-soft self-start sm:self-auto"
                     th:classappend="${registration.status.name() == 'PENDING'} ? ' badge-warning' : (${registration.status.name() == 'APPROVED'} ? ' badge-success' : (${registration.status.name() == 'DRAFT'} ? ' badge-info' : ' badge-error'))"
                     th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"></span>
               </header>

               <div class="space-y-6 p-5 sm:p-6">
                  <section class="space-y-2">
                     <p class="text-xs font-medium text-base-content/60"
                        th:text="${registration.topic.department.name}"></p>
                     <h3 class="text-xl font-semibold leading-snug" th:text="${registration.topic.title}"></h3>
                     <p class="whitespace-pre-line text-sm leading-relaxed text-base-content/75"
                        th:text="${registration.topic.description}"></p>
                  </section>

                  <section class="border-t border-base-300 pt-5">
                     <h3 class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-base-content/60">
                        <span class="iconify text-primary" data-icon="bi:person-badge"></span>
                        <span th:text="#{topics.field.advisers}"></span>
                     </h3>
                     <ul class="grid gap-3 sm:grid-cols-2">
                        <li class="rounded-field border border-base-300 bg-base-200/50 p-3"
                           th:each="adviser : ${registration.topic.advisers}">
                           <p class="text-sm font-semibold" th:text="${adviser.fullName}"></p>
                           <p class="font-mono text-xs text-base-content/60" th:text="${adviser.userCode}"></p>
                        </li>
                     </ul>
                  </section>

                  <section class="border-t border-base-300 pt-5">
                     <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
                        <h3 class="flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-base-content/60">
                           <span class="iconify text-primary" data-icon="bi:people"></span>
                           <span th:text="#{student-groups.members}"></span>
                        </h3>
                        <span class="text-xs text-base-content/60"
                           th:text="#{topic-registrations.members-count(${#lists.size(members)})}"></span>
                     </div>
                     <ul class="divide-y divide-base-300 overflow-hidden rounded-field border border-base-300">
                        <li class="flex flex-wrap items-center gap-3 px-3 py-2.5"
                           th:each="member : ${members}">
                           <div class="avatar avatar-placeholder shrink-0">
                              <div class="w-8 rounded-full bg-primary/10 text-primary">
                                 <span class="text-xs font-semibold"
                                    th:text="${#strings.substring(member.student.fullName, 0, 1)}"></span>
                              </div>
                           </div>
                           <div class="min-w-0 flex-1">
                              <p class="text-sm font-medium" th:text="${member.student.fullName}"></p>
                              <p class="font-mono text-xs text-base-content/60"
                                 th:text="${member.student.userCode}"></p>
                           </div>
                           <span class="badge badge-primary badge-soft badge-sm" th:if="${member.leader}"
                              th:text="#{student-groups.leader}"></span>
                        </li>
                     </ul>
                  </section>

                  <section class="border-t border-base-300 pt-5"
                     th:if="${registration.status.name() == 'APPROVED'}">
                     <h3 class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-base-content/60">
                        <span class="iconify text-primary" data-icon="bi:paperclip"></span>
                        <span th:text="#{topic-registrations.report.current}"></span>
                     </h3>
                     <div th:if="${currentReport != null}">
                        <p class="mb-3 text-xs text-base-content/60"
                           th:text="${#temporals.format(currentReport.submittedAt, 'dd/MM/yyyy HH:mm')}"></p>
                        <div class="grid gap-2 sm:grid-cols-2">
                           <a class="flex min-w-0 items-center gap-3 rounded-field border border-base-300 bg-base-200/40 p-3 text-sm hover:bg-base-200"
                              th:each="file : ${reportFiles}"
                              th:href="@{/registration-periods/{periodId}/student-group/{groupId}/reports/files/{fileId}(periodId=${registration.studentGroup.registrationPeriod.id},groupId=${registration.studentGroup.id},fileId=${file.id})}">
                              <span class="iconify shrink-0 text-primary" data-icon="bi:file-earmark-arrow-down"></span>
                              <span class="min-w-0 flex-1 truncate" th:text="${file.originalName}"></span>
                              <span class="iconify shrink-0 text-base-content/50" data-icon="bi:download"></span>
                           </a>
                        </div>
                     </div>
                     <p class="text-sm text-base-content/60" th:if="${currentReport == null}"
                        th:text="#{report-submissions.empty}"></p>
                  </section>

                  <div role="alert" class="alert alert-error alert-soft"
                     th:if="${registration.rejectionReason != null}">
                     <span class="iconify" data-icon="bi:exclamation-circle"></span>
                     <div>
                        <p class="font-semibold" th:text="#{topic-registrations.field.reason}"></p>
                        <p th:text="${registration.rejectionReason}"></p>
                     </div>
                  </div>

                  <form id="reject-registration-form" class="space-y-2 border-t border-base-300 pt-5"
                     th:if="${isOpen and isPending}"
                     th:action="@{/topic-registrations/{id}/reject(id=${registration.id})}"
                     th:object="${rejectForm}" method="post">
                     <label class="fieldset">
                        <span class="fieldset-legend" th:text="#{topic-registrations.field.reason}"></span>
                        <textarea class="textarea w-full" rows="3" required maxlength="500"
                           th:field="*{reason}"></textarea>
                        <span class="text-sm text-error" th:errors="*{reason}"></span>
                        <span class="label" th:text="#{topic-registrations.reason-guidance}"></span>
                     </label>
                     <p class="text-sm text-error" th:if="${#fields.hasGlobalErrors()}"
                        th:errors="*{global}"></p>
                  </form>
               </div>

               <footer class="flex flex-wrap items-center justify-end gap-2 border-t border-base-300 bg-base-200/70 p-4 sm:px-6"
                  th:if="${isOpen and isPending}">
                  <button type="submit" form="reject-registration-form" class="btn btn-error btn-outline"
                     th:text="#{topic-registrations.action.reject}"></button>
                  <form th:action="@{/topic-registrations/{id}/approve(id=${registration.id})}" method="post">
                     <button class="btn btn-primary"
                        th:text="#{topic-registrations.action.approve}"></button>
                  </form>
               </footer>
               <div role="alert" class="alert alert-warning alert-soft m-5 sm:m-6"
                  th:if="${isPending and !isOpen}"
                  th:text="#{student-groups.locked}"></div>
            </div>
         </article>
         <section class="card card-border mt-6 w-full max-w-4xl border-base-300">
            <div class="card-body"
               th:insert="~{fragment/page/student-group/activity :: timeline(${activities})}"></div>
         </section>
      </th:block>
   </body>
</html>
