<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div
            role="alert"
            class="alert alert-error mb-5"
            th:if="${error != null}"
            th:text="#{__${error}__}"
         ></div>
         <div class="grid gap-5 lg:grid-cols-2">
            <section class="card card-border">
               <div class="card-body">
                  <h2
                     class="card-title"
                     th:text="${registration.studentGroup.name}"
                  ></h2>
                  <h3
                     class="font-semibold"
                     th:text="${registration.topic.title}"
                  ></h3>
                  <p th:text="${registration.topic.description}"></p>
                  <ul>
                     <li
                        th:each="member : ${members}"
                        th:text="${member.student.fullName}"
                     ></li>
                  </ul>
               </div>
            </section>
            <section class="card card-border">
               <div class="card-body">
                  <h2
                     class="card-title"
                     th:text="#{topic-registrations.page.detail.title}"
                  ></h2>
                  <span
                     class="badge badge-soft"
                     th:classappend="${registration.status.name() == 'PENDING'} ? ' badge-warning' : (${registration.status.name() == 'APPROVED'} ? ' badge-success' : ' badge-error')"
                     th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"
                  ></span>
                  <div
                     role="alert"
                     class="alert alert-error"
                     th:if="${registration.rejectionReason != null}"
                  >
                     <span
                        class="iconify"
                        data-icon="bi:exclamation-circle"
                     ></span>
                     <div>
                        <h3
                           class="font-semibold"
                           th:text="#{topic-registrations.field.reason}"
                        ></h3>
                        <span th:text="${registration.rejectionReason}"></span>
                     </div>
                  </div>
                  <div class="card-actions" th:if="${isOpen and isPending}">
                     <form
                        th:action="@{/topic-registrations/{id}/approve(id=${registration.id})}"
                        method="post"
                     >
                        <button
                           class="btn btn-success"
                           th:text="#{topic-registrations.action.approve}"
                        ></button>
                     </form>
                     <button
                        class="btn btn-error"
                        onclick="reject_registration.showModal()"
                        th:text="#{topic-registrations.action.reject}"
                     ></button>
                  </div>
                  <div
                     role="alert"
                     class="alert alert-warning"
                     th:if="${isPending and !isOpen}"
                     th:text="#{student-groups.locked}"
                  ></div>
               </div>
            </section>
         </div>
         <dialog id="reject_registration" class="modal">
            <div class="modal-box">
               <form
                  th:action="@{/topic-registrations/{id}/reject(id=${registration.id})}"
                  th:object="${rejectForm}"
                  method="post"
               >
                  <h3
                     class="text-lg font-bold"
                     th:text="#{topic-registrations.action.reject}"
                  ></h3>
                  <label class="form-control mt-4"
                     ><span
                        class="label"
                        th:text="#{topic-registrations.field.reason}"
                     ></span
                     ><textarea
                        class="textarea w-full"
                        th:field="*{reason}"
                     ></textarea
                     ><span class="text-error" th:errors="*{reason}"></span
                  ></label>
                  <div class="modal-action">
                     <button
                        class="btn btn-error"
                        th:text="#{topic-registrations.action.reject}"
                     ></button
                     ><button
                        type="button"
                        class="btn"
                        onclick="reject_registration.close()"
                        th:text="#{crud.form.cancel}"
                     ></button>
                  </div>
               </form>
            </div>
            <form method="dialog" class="modal-backdrop">
               <button>close</button>
            </form>
         </dialog>
      </th:block>
   </body>
</html>
