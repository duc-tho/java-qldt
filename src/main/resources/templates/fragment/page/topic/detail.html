<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <form
            th:if="${form.readonly and canManageTopic and topic.status.name() == 'PROPOSED'}"
            th:action="${form.actionUrl + '/approve'}"
            method="post"
         >
            <button type="submit" class="btn btn-success btn-sm">
               <span class="iconify inline" data-icon="bi:check-circle" data-width="16"></span>
               <span th:text="#{topics.action.approve}"></span>
            </button>
         </form>
         <button
            th:if="${form.readonly and canManageTopic and topic.status.name() == 'PROPOSED'}"
            type="button"
            class="btn btn-error btn-outline btn-sm"
            onclick="reject_topic.showModal()"
         >
            <span class="iconify inline" data-icon="bi:x-circle" data-width="16"></span>
            <span th:text="#{topics.action.reject}"></span>
         </button>
         <a
            th:if="${form.readonly and canManageTopic}"
            th:href="${form.actionUrl + '/edit'}"
            class="btn btn-primary btn-sm"
         >
            <span
               class="iconify inline"
               data-icon="bi:pencil-square"
               data-width="16"
            ></span>
            <span th:text="#{topics.action.edit}"></span>
         </a>
         <button
            th:if="${form.readonly and canManageTopic}"
            type="button"
            class="btn btn-error btn-outline btn-sm"
            x-data
            th:attr="data-delete-url=${form.actionUrl + '/delete'}, data-delete-name=${form.data.title}"
            x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
         >
            <span
               class="iconify inline"
               data-icon="bi:trash"
               data-width="16"
            ></span>
            <span th:text="#{topics.action.delete}"></span>
         </button>
      </th:block>
      <th:block layout:fragment="page-content">
         <div role="alert" class="alert alert-error alert-soft mb-5" th:if="${topic.rejectionReason != null}">
            <span class="iconify" data-icon="bi:exclamation-circle"></span>
            <div>
               <h2 class="font-semibold" th:text="#{topics.field.rejection-reason}"></h2>
               <span th:text="${topic.rejectionReason}"></span>
            </div>
         </div>
         <div th:replace="~{fragment/crud/form :: crud-form(${form})}"></div>
         <section class="card card-border border-base-300 mt-5" th:if="${groupRegistrations != null}"><div class="card-body"><h2 class="card-title" th:text="#{student-groups.section.period-groups}"></h2><p class="text-sm text-base-content/60" th:if="${#lists.isEmpty(groupRegistrations)}" th:text="#{crud.table.empty}"></p><ul class="space-y-2" th:unless="${#lists.isEmpty(groupRegistrations)}"><li th:each="registration : ${groupRegistrations}"><a class="link link-primary" th:href="@{/registration-periods/{periodId}/student-group/{groupId}(periodId=${topic.registrationPeriod.id},groupId=${registration.studentGroup.id})}" th:text="${registration.studentGroup.name}"></a><span class="badge badge-soft badge-sm ml-2" th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"></span></li></ul></div></section>
         <dialog id="reject_topic" class="modal">
            <div class="modal-box">
               <form th:action="${form.actionUrl + '/reject'}" th:object="${rejectForm}" method="post">
                  <h3 class="text-lg font-bold" th:text="#{topics.action.reject}"></h3>
                  <label class="form-control mt-4">
                     <span class="label" th:text="#{topics.field.rejection-reason}"></span>
                     <textarea class="textarea w-full" th:field="*{reason}" maxlength="500"></textarea>
                     <span class="text-error" th:errors="*{reason}"></span>
                  </label>
                  <div class="modal-action">
                     <button class="btn btn-error" th:text="#{topics.action.reject}"></button>
                     <button type="button" class="btn" onclick="reject_topic.close()" th:text="#{crud.form.cancel}"></button>
                  </div>
               </form>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
         </dialog>
      </th:block>
   </body>
</html>
