<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="form-fields">
      <div class="flex flex-col gap-3">
         <div class="form-control">
            <label class="label" for="title">
               <span class="font-bold" th:text="#{topics.field.title}"></span>
            </label>
            <input
               th:field="*{title}"
               class="input w-full"
               th:classappend="${#fields.hasErrors('title')} ? ' input-error'"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.title}"
            />
            <div id="title-error">
               <span
                  class="text-error text-sm mt-1 block"
                  th:if="${#fields.hasErrors('title')}"
                  th:errors="*{title}"
               ></span>
            </div>
         </div>
         <div class="form-control">
            <label class="label" for="departmentId">
               <span
                  class="font-bold"
                  th:text="#{topics.field.department}"
               ></span>
            </label>
            <select
               th:field="*{departmentId}"
               class="select w-full"
               th:classappend="${#fields.hasErrors('departmentId')} ? ' select-error'"
               th:disabled="${form.readonly}"
            >
               <option
                  value=""
                  th:text="#{topics.field.department.placeholder}"
               ></option>
               <option
                  th:each="department : ${departments}"
                  th:value="${department.id}"
                  th:text="${department.name}"
               ></option>
            </select>
            <span
               class="text-error text-sm mt-1 block"
               th:if="${#fields.hasErrors('departmentId')}"
               th:errors="*{departmentId}"
            ></span>
         </div>
         <div class="form-control">
            <label class="label" for="description">
               <span
                  class="font-bold"
                  th:text="#{topics.field.description}"
               ></span>
            </label>
            <textarea
               th:field="*{description}"
               class="textarea w-full"
               th:classappend="${#fields.hasErrors('description')} ? ' textarea-error'"
               rows="6"
               th:readonly="${form.readonly}"
               th:attr="validate-data=${form.validationRules.description}"
            ></textarea>
            <div id="description-error">
               <span
                  class="text-error text-sm mt-1 block"
                  th:if="${#fields.hasErrors('description')}"
                  th:errors="*{description}"
               ></span>
            </div>
         </div>
         <div class="form-control">
             <label class="label" for="adviserIds" th:if="${form.readonly}">
               <span
                  class="font-bold"
                  th:text="#{topics.field.advisers}"
               ></span>
            </label>
             <div th:if="${form.readonly}" class="flex flex-wrap gap-2">
                <span class="badge badge-outline" th:each="lecturer : ${selectedLecturers}"
                   th:text="|${lecturer.fullName} (${lecturer.userCode})|"></span>
             </div>
             <th:block th:unless="${form.readonly}">
                <div th:replace="~{fragment/page/topic/adviser-picker :: picker}"></div>
             </th:block>
            <span
               class="text-error text-sm mt-1 block"
               th:if="${#fields.hasErrors('adviserIds')}"
               th:errors="*{adviserIds}"
            ></span>
         </div>
      </div>
   </th:block>
</html>
