<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <a class="btn btn-outline btn-sm" th:href="@{/registration-periods/{id}/councils(id=${period.id})}">
            <span class="iconify" data-icon="bi:arrow-left"></span>
            <span th:text="#{councils.action.back}"></span>
         </a>
      </th:block>

      <th:block layout:fragment="page-content">
         <form
            class="mx-auto w-full max-w-4xl space-y-6"
            method="post"
            th:action="${formAction}"
            th:object="${data}"
            x-data="councilMembers()"
         >
            <div role="alert" class="alert alert-error alert-soft" th:if="${#fields.hasGlobalErrors()}">
               <span class="iconify" data-icon="bi:exclamation-circle"></span>
               <p th:errors="*{global}"></p>
            </div>

            <section class="space-y-5">
               <div>
                  <h2 class="text-xl font-semibold" th:text="#{councils.section.identity}"></h2>
                  <p class="mt-1 text-sm text-base-content/60" th:text="${period.name}"></p>
               </div>
               <label class="fieldset">
                  <span class="label font-semibold" th:text="#{councils.field.name}"></span>
                  <input
                     class="input w-full"
                     maxlength="150"
                     th:classappend="${#fields.hasErrors('name')} ? ' input-error'"
                     th:field="*{name}"
                  />
                  <span class="mt-1 text-sm text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
               </label>
            </section>

            <section class="space-y-4 border-t border-base-300 pt-6">
               <div>
                  <h2 class="text-xl font-semibold" th:text="#{councils.field.members}"></h2>
                  <p class="mt-1 text-sm text-base-content/60" th:text="#{councils.members.help}"></p>
               </div>
               <label class="fieldset">
                  <span class="label font-semibold" th:text="#{councils.members.search}"></span>
                  <input
                     class="input w-full"
                     type="search"
                     x-model="search"
                     x-on:input.debounce.250ms="lookup()"
                     th:placeholder="#{councils.members.search-placeholder}"
                  />
               </label>
               <div class="rounded-box border border-base-300 bg-base-100" x-cloak x-show="results.length">
                  <template x-for="lecturer in results" :key="lecturer.id">
                     <button class="flex w-full items-center justify-between gap-3 px-3 py-2 text-left hover:bg-base-200" type="button" x-on:click="add(lecturer)">
                        <span x-text="lecturer.fullName"></span>
                        <span class="text-sm text-base-content/60" x-text="lecturer.userCode"></span>
                     </button>
                  </template>
               </div>
               <div class="space-y-2" x-show="members.length">
                  <template x-for="member in members" :key="member.id">
                     <div class="flex items-center justify-between rounded-field border border-base-300 px-3 py-2">
                        <input type="hidden" name="memberIds" :value="member.id" />
                        <div>
                           <p class="font-medium" x-text="member.fullName"></p>
                           <p class="text-sm text-base-content/60" x-text="member.userCode"></p>
                        </div>
                        <button
                           class="btn btn-error btn-ghost btn-xs"
                           type="button"
                           x-on:click="remove(member.id)"
                           th:aria-label="#{councils.members.remove}"
                           th:title="#{councils.members.remove}"
                        >
                           <span class="iconify" data-icon="bi:x-lg"></span>
                        </button>
                     </div>
                  </template>
               </div>
               <span class="text-sm text-error" th:if="${#fields.hasErrors('memberIds')}" th:errors="*{memberIds}"></span>

               <div class="grid gap-4 md:grid-cols-2">
                  <label class="fieldset">
                     <span class="label font-semibold" th:text="#{councils.field.chairperson}"></span>
                     <select class="select w-full" name="chairpersonId" x-model="chairperson" th:classappend="${#fields.hasErrors('chairpersonId')} ? ' select-error'">
                        <option value="" th:text="#{councils.members.select-role}"></option>
                        <template x-for="member in members" :key="member.id">
                           <option :value="member.id" x-text="member.fullName"></option>
                        </template>
                     </select>
                     <span class="mt-1 text-sm text-error" th:if="${#fields.hasErrors('chairpersonId')}" th:errors="*{chairpersonId}"></span>
                  </label>
                  <label class="fieldset">
                     <span class="label font-semibold" th:text="#{councils.field.secretary}"></span>
                     <select class="select w-full" name="secretaryId" x-model="secretary" th:classappend="${#fields.hasErrors('secretaryId')} ? ' select-error'">
                        <option value="" th:text="#{councils.members.select-role}"></option>
                        <template x-for="member in members.filter(item => String(item.id) !== String(chairperson))" :key="member.id">
                           <option :value="member.id" x-text="member.fullName"></option>
                        </template>
                     </select>
                     <span class="mt-1 text-sm text-error" th:if="${#fields.hasErrors('secretaryId')}" th:errors="*{secretaryId}"></span>
                  </label>
               </div>
            </section>

            <div class="flex justify-end gap-3 border-t border-base-300 pt-5">
               <a class="btn" th:href="@{/registration-periods/{id}/councils(id=${period.id})}" th:text="#{crud.form.cancel}"></a>
               <button class="btn btn-primary" type="submit" x-bind:disabled="members.length < 3 || !chairperson || !secretary">
                  <span class="iconify" data-icon="bi:floppy"></span>
                  <span th:text="#{crud.form.save}"></span>
               </button>
            </div>
         </form>

         <script th:inline="javascript">
            function councilMembers() {
               return {
                  search: '',
                  results: [],
                  members: /*[[${initialMembers}]]*/ [],
                  chairperson: /*[[${data.chairpersonId}]]*/ '',
                  secretary: /*[[${data.secretaryId}]]*/ '',
                  async lookup() {
                     if (this.search.trim().length < 2) {
                        this.results = [];
                        return;
                     }
                     const url = /*[[${'/registration-periods/' + period.id + '/councils/lecturers'}]]*/ '';
                     const response = await fetch(url + '?search=' + encodeURIComponent(this.search));
                     if (!response.ok) {
                        this.results = [];
                        return;
                     }
                     this.results = (await response.json()).filter(
                        item => !this.members.some(member => member.id === item.id),
                     );
                  },
                  add(item) {
                     if (this.members.length >= 5) return;
                     this.members.push(item);
                     this.search = '';
                     this.results = [];
                  },
                  remove(id) {
                     this.members = this.members.filter(item => item.id !== id);
                     if (String(this.chairperson) === String(id)) this.chairperson = '';
                     if (String(this.secretary) === String(id)) this.secretary = '';
                  },
               };
            }
         </script>
      </th:block>
   </body>
</html>
