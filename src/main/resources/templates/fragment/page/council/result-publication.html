<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <body>
      <section
         class="mt-8 border-t border-base-300 pt-6"
         sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')"
         th:fragment="result-publication(period)"
      >
         <div role="alert" class="alert alert-error alert-soft mb-5" th:if="${error != null}">
            <span class="iconify" data-icon="bi:exclamation-circle"></span>
            <span th:text="#{__${error}__}"></span>
         </div>

         <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
            <div>
               <h2 class="text-xl font-semibold" th:text="#{result-publications.title}"></h2>
               <p class="mt-1 text-sm text-base-content/60" th:text="#{result-publications.description}"></p>
            </div>
            <span
               class="badge badge-soft"
               th:if="${latestPublication != null}"
               th:classappend="${latestPublication.action.name() == 'PUBLISHED'} ? ' badge-success' : ' badge-warning'"
               th:text="#{__${'result-publications.action.' + latestPublication.action.name()}__}"
            ></span>
         </div>

         <div class="mt-4 flex flex-wrap gap-3">
            <form method="post" th:action="@{/registration-periods/{id}/result-publication(id=${period.id})}" th:if="${latestPublication == null or latestPublication.action.name() == 'REVOKED'}">
               <button class="btn btn-primary" type="submit" th:disabled="${!canPublishResults}">
                  <span class="iconify" data-icon="bi:send-check"></span>
                  <span th:text="#{result-publications.action.publish}"></span>
               </button>
            </form>
            <button
               class="btn btn-error btn-outline"
               type="button"
               onclick="revoke_publication.showModal()"
               th:if="${latestPublication != null and latestPublication.action.name() == 'PUBLISHED'}"
            >
               <span class="iconify" data-icon="bi:x-circle"></span>
               <span th:text="#{result-publications.action.revoke}"></span>
            </button>
         </div>

         <p
            class="mt-3 text-sm text-base-content/60"
            th:if="${(latestPublication == null or latestPublication.action.name() == 'REVOKED') and !canPublishResults}"
            th:text="#{result-publications.not-ready}"
         ></p>

         <div class="mt-4 overflow-x-auto" th:unless="${#lists.isEmpty(publicationHistory)}">
            <table class="table table-sm">
               <thead class="bg-base-200">
                  <tr>
                     <th th:text="#{result-publications.column.action}"></th>
                     <th th:text="#{result-publications.column.performer}"></th>
                     <th th:text="#{result-publications.column.time}"></th>
                     <th th:text="#{result-publications.column.reason}"></th>
                  </tr>
               </thead>
               <tbody>
                  <tr th:each="publication : ${publicationHistory}">
                     <td th:text="#{__${'result-publications.action.' + publication.action.name()}__}"></td>
                     <td th:text="${publication.performedBy.fullName}"></td>
                     <td class="tabular-nums" th:text="${#temporals.format(publication.performedAt, 'dd/MM/yyyy HH:mm')}"></td>
                     <td th:text="${publication.reason != null ? publication.reason : '—'}"></td>
                  </tr>
               </tbody>
            </table>
         </div>

         <dialog id="revoke_publication" class="modal">
            <div class="modal-box">
               <form method="post" th:action="@{/registration-periods/{id}/result-publication/revoke(id=${period.id})}" th:object="${revocationForm}">
                  <h3 class="text-lg font-semibold" th:text="#{result-publications.action.revoke}"></h3>
                  <label class="fieldset mt-4">
                     <span class="label font-semibold" th:text="#{result-publications.column.reason}"></span>
                     <textarea class="textarea min-h-28 w-full" maxlength="500" th:field="*{reason}" required></textarea>
                  </label>
                  <div class="modal-action">
                     <button class="btn btn-error" type="submit" th:text="#{result-publications.action.revoke}"></button>
                     <button class="btn" type="button" onclick="revoke_publication.close()" th:text="#{crud.form.cancel}"></button>
                  </div>
               </form>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
         </dialog>
      </section>
   </body>
</html>
