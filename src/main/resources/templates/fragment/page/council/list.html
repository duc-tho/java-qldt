<!doctype html>
<html
   xmlns:th="http://www.thymeleaf.org"
   xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
   layout:decorate="~{layout/page.html}"
>
   <body>
      <th:block layout:fragment="actions">
         <a
            class="btn btn-primary btn-sm"
            sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')"
            th:if="${managementOpen}"
            th:href="@{/registration-periods/{id}/councils/new(id=${period.id})}"
         >
            <span class="iconify" data-icon="bi:plus-lg"></span>
            <span th:text="#{councils.action.create}"></span>
         </a>
      </th:block>

      <th:block layout:fragment="page-content">
         <section class="space-y-6">
            <div>
               <p class="text-sm text-base-content/60" th:text="#{registration_periods.page.detail.title}"></p>
               <h2 class="text-xl font-semibold" th:text="${period.name}"></h2>
            </div>

            <div role="alert" class="alert alert-error alert-soft" th:if="${error != null}">
               <span class="iconify" data-icon="bi:exclamation-circle"></span>
               <span th:text="#{__${error}__}"></span>
            </div>

            <div role="alert" class="alert alert-info alert-soft" th:unless="${managementOpen}">
               <span class="iconify" data-icon="bi:info-circle"></span>
               <span th:text="#{councils.management-closed}"></span>
            </div>

            <div class="overflow-x-auto rounded-box border border-base-300">
               <table class="table table-sm">
                  <thead class="bg-base-200">
                     <tr>
                        <th th:text="#{councils.field.name}"></th>
                        <th th:text="#{councils.column.members}"></th>
                        <th th:text="#{councils.column.assignments}"></th>
                        <th class="text-right" sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')" th:text="#{crud.table.actions}"></th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="council : ${councils}">
                        <td class="font-medium" th:text="${council.name}"></td>
                        <td class="tabular-nums" th:text="${memberCounts.get(council.id)}"></td>
                        <td>
                           <span
                              class="badge badge-soft"
                              th:classappend="${assignedCounts.get(council.id) > 0} ? ' badge-success' : ' badge-ghost'"
                              th:text="${assignedCounts.get(council.id)}"
                           ></span>
                        </td>
                        <td class="text-right" sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')">
                           <div class="flex justify-end gap-2">
                              <a class="btn btn-outline btn-xs" th:href="@{/registration-periods/{periodId}/councils/{id}(periodId=${period.id},id=${council.id})}">
                                 <span class="iconify" data-icon="bi:eye"></span>
                                 <span th:text="#{councils.action.view}"></span>
                              </a>
                              <a class="btn btn-outline btn-xs" th:if="${managementOpen}" th:href="@{/registration-periods/{periodId}/councils/{id}/edit(periodId=${period.id},id=${council.id})}">
                                 <span class="iconify" data-icon="bi:pencil-square"></span>
                                 <span th:text="#{councils.action.edit}"></span>
                              </a>
                              <button
                                 class="btn btn-error btn-outline btn-xs"
                                 th:if="${managementOpen}"
                                 type="button"
                                 x-data
                                 th:attr="data-delete-url=@{/registration-periods/{periodId}/councils/{id}/delete(periodId=${period.id},id=${council.id})},data-delete-name=${council.name}"
                                 x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
                              >
                                 <span class="iconify" data-icon="bi:trash"></span>
                                 <span th:text="#{councils.action.delete}"></span>
                              </button>
                           </div>
                        </td>
                     </tr>
                     <tr th:if="${#lists.isEmpty(councils)}">
                        <td class="py-8 text-center text-base-content/60" colspan="4" th:text="#{councils.empty}"></td>
                     </tr>
                  </tbody>
               </table>
            </div>

         </section>
      </th:block>
   </body>
</html>
