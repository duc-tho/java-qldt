<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <a class="btn btn-outline btn-sm" th:href="@{/council-workspace}">
            <span class="iconify" data-icon="bi:arrow-left"></span>
            <span th:text="#{crud.form.back}"></span>
         </a>
      </th:block>
      <th:block layout:fragment="page-content">
         <section class="space-y-6">
            <div
               role="alert"
               class="alert alert-error alert-soft"
               th:if="${error != null}"
            >
               <span class="iconify" data-icon="bi:exclamation-circle"></span>
               <span th:text="#{__${error}__}"></span>
            </div>

            <div class="card card-border border-base-300">
               <div class="card-body gap-3">
                  <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-start">
                     <div>
                        <p
                           class="text-sm text-base-content/60"
                           th:text="${registration.topic.registrationPeriod.name}"
                        ></p>
                        <h2 class="card-title text-xl" th:text="${registration.topic.title}"></h2>
                        <p th:text="${registration.studentGroup.name}"></p>
                     </div>
                     <span
                        class="badge badge-success badge-soft"
                        th:if="${currentReport != null}"
                        th:text="#{report-submissions.status.SUBMITTED}"
                     ></span>
                  </div>
                  <div
                     role="alert"
                     class="alert alert-warning alert-soft"
                     th:if="${currentReport == null}"
                  >
                     <span class="iconify" data-icon="bi:file-earmark-x"></span>
                     <span th:text="#{evaluations.error.report-required}"></span>
                  </div>
                  <div class="flex flex-wrap gap-2" th:if="${currentReport != null}">
                     <a
                        class="btn btn-outline btn-sm"
                        th:each="file : ${reportFiles}"
                        th:href="@{/registration-periods/{periodId}/student-group/{groupId}/reports/files/{fileId}(periodId=${registration.topic.registrationPeriod.id},groupId=${registration.studentGroup.id},fileId=${file.id})}"
                     >
                        <span class="iconify" data-icon="bi:download"></span>
                        <span
                           th:text="#{report-submissions.action.download(${file.originalName})}"
                        ></span>
                     </a>
                  </div>
               </div>
            </div>

            <section>
               <h2 class="text-xl font-semibold" th:text="#{councils.workspace.my-evaluation}"></h2>
               <form
                  class="mt-4 space-y-4"
                  method="post"
                  th:action="@{/council-evaluations/{id}/draft(id=${registration.id})}"
                  th:object="${evaluationForm}"
                  th:if="${canEvaluate}"
               >
                  <label class="fieldset">
                     <span class="label font-semibold" th:text="#{councils.workspace.score}"></span>
                     <input
                        class="input w-full max-w-xs"
                        type="number"
                        min="0"
                        max="10"
                        step="0.01"
                        th:field="*{score}"
                     />
                  </label>
                  <label class="fieldset">
                     <span class="label font-semibold" th:text="#{councils.workspace.comment}"></span>
                     <textarea class="textarea min-h-28 w-full" th:field="*{comment}"></textarea>
                  </label>
                  <div class="flex flex-wrap justify-end gap-3">
                     <button
                        class="btn btn-outline"
                        type="submit"
                        formmethod="post"
                        th:formaction="@{/council-evaluations/{id}/draft(id=${registration.id})}"
                     >
                        <span class="iconify" data-icon="bi:floppy"></span>
                        <span th:text="#{councils.workspace.save-draft}"></span>
                     </button>
                     <button
                        class="btn btn-primary"
                        type="submit"
                        formmethod="post"
                        th:formaction="@{/council-evaluations/{id}/submit(id=${registration.id})}"
                     >
                        <span class="iconify" data-icon="bi:send-check"></span>
                        <span th:text="#{councils.workspace.submit-evaluation}"></span>
                     </button>
                  </div>
               </form>
               <div
                  role="alert"
                  class="alert alert-info alert-soft mt-4"
                  th:unless="${canEvaluate}"
               >
                  <span class="iconify" data-icon="bi:lock"></span>
                  <span
                     th:text="${evaluation != null and evaluation.status.name() == 'SUBMITTED'} ? #{evaluations.error.submitted-locked} : #{councils.workspace.evaluation-unavailable}"
                  ></span>
               </div>
            </section>

            <section>
               <h2 class="text-xl font-semibold" th:text="#{councils.workspace.evaluations}"></h2>
               <div class="mt-4 overflow-x-auto rounded-box border border-base-300">
                  <table class="table table-sm">
                     <thead class="bg-base-200">
                        <tr>
                           <th th:text="#{councils.workspace.evaluator}"></th>
                           <th th:text="#{councils.workspace.status}"></th>
                           <th th:text="#{councils.workspace.score}"></th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr th:each="item : ${evaluations}">
                           <td th:text="${item.evaluator.fullName}"></td>
                           <td>
                              <span
                                 class="badge badge-soft"
                                 th:classappend="${item.status.name() == 'SUBMITTED'} ? ' badge-success' : ' badge-warning'"
                                 th:text="#{__${'evaluations.status.' + item.status.name()}__}"
                              ></span>
                           </td>
                           <td th:text="${item.score != null ? item.score : '—'}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(evaluations)}">
                           <td
                              class="py-6 text-center text-base-content/60"
                              colspan="3"
                              th:text="#{councils.workspace.evaluations-empty}"
                           ></td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </section>

            <section class="border-t border-base-300 pt-6">
               <h2 class="text-xl font-semibold" th:text="#{councils.workspace.final-result}"></h2>
               <div class="mt-4" th:if="${finalResult != null}">
                  <p class="text-2xl font-semibold tabular-nums" th:text="${finalResult.finalScore}"></p>
                  <p
                     class="mt-2 text-base-content/70"
                     th:if="${finalResult.summaryComment != null}"
                     th:text="${finalResult.summaryComment}"
                  ></p>
               </div>
               <form
                  class="mt-4 space-y-4"
                  method="post"
                  th:action="@{/council-evaluations/{id}/finalize(id=${registration.id})}"
                  th:if="${councilEvaluation and canFinalize}"
                  th:object="${finalResultForm}"
               >
                  <label class="fieldset">
                     <span class="label font-semibold" th:text="#{councils.workspace.summary}"></span>
                     <textarea
                        class="textarea min-h-28 w-full"
                        th:field="*{summaryComment}"
                     ></textarea>
                  </label>
                  <div class="flex justify-end">
                     <button class="btn btn-primary" type="submit">
                        <span class="iconify" data-icon="bi:check2-circle"></span>
                        <span th:text="#{councils.workspace.finalize}"></span>
                     </button>
                  </div>
               </form>
               <p
                  class="mt-3 text-sm text-base-content/60"
                  th:if="${councilEvaluation and finalResult == null and !canFinalize}"
                  th:text="#{councils.workspace.finalize-unavailable}"
               ></p>
               <p
                  class="mt-3 text-sm text-base-content/60"
                  th:if="${!councilEvaluation and finalResult == null}"
                  th:text="#{councils.workspace.automatic-result-pending}"
               ></p>
            </section>
         </section>
      </th:block>
   </body>
</html>
