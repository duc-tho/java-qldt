<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <section class="space-y-5">
            <div>
               <h2
                  class="text-xl font-semibold"
                  th:text="#{councils.workspace.list.title}"
               ></h2>
               <p
                  class="mt-1 text-sm text-base-content/60"
                  th:text="#{councils.workspace.list.description}"
               ></p>
            </div>

            <div
               role="alert"
               class="alert alert-info alert-soft"
               th:if="${#lists.isEmpty(registrations)}"
            >
               <span class="iconify" data-icon="bi:info-circle"></span>
               <span th:text="#{councils.workspace.empty}"></span>
            </div>

            <div
               class="overflow-x-auto rounded-box border border-base-300"
               th:unless="${#lists.isEmpty(registrations)}"
            >
               <table class="table table-sm">
                  <thead class="bg-base-200">
                     <tr>
                        <th th:text="#{councils.workspace.topic}"></th>
                        <th th:text="#{councils.workspace.group}"></th>
                        <th th:text="#{councils.workspace.period}"></th>
                        <th class="text-right" th:text="#{crud.table.actions}"></th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="registration : ${registrations}">
                        <td class="font-medium" th:text="${registration.topic.title}"></td>
                        <td th:text="${registration.studentGroup.name}"></td>
                        <td th:text="${registration.topic.registrationPeriod.name}"></td>
                        <td class="text-right">
                           <a
                              class="btn btn-outline btn-sm"
                              th:href="@{/council-workspace/{id}(id=${registration.id})}"
                           >
                              <span class="iconify" data-icon="bi:clipboard2-check"></span>
                              <span th:text="#{councils.workspace.open}"></span>
                           </a>
                        </td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </section>
      </th:block>
   </body>
</html>
