<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <a class="btn btn-primary btn-sm" th:if="${managementOpen}" th:href="@{/registration-periods/{periodId}/councils/{id}/edit(periodId=${council.registrationPeriod.id},id=${council.id})}">
            <span class="iconify" data-icon="bi:pencil-square"></span>
            <span th:text="#{councils.action.edit}"></span>
         </a>
         <button
            class="btn btn-error btn-outline btn-sm"
            th:if="${managementOpen}"
            type="button"
            x-data
            th:attr="data-delete-url=@{/registration-periods/{periodId}/councils/{id}/delete(periodId=${council.registrationPeriod.id},id=${council.id})},data-delete-name=${council.name}"
            x-on:click="$dispatch('crud-delete-request', { url: $el.dataset.deleteUrl, name: $el.dataset.deleteName })"
         >
            <span class="iconify" data-icon="bi:trash"></span>
            <span th:text="#{councils.action.delete}"></span>
         </button>
      </th:block>

      <th:block layout:fragment="page-content">
         <section class="space-y-6">
            <div role="alert" class="alert alert-error alert-soft" th:if="${error != null}">
               <span class="iconify" data-icon="bi:exclamation-circle"></span>
               <span th:text="#{__${error}__}"></span>
            </div>

            <div role="alert" class="alert alert-info alert-soft" th:unless="${managementOpen}">
               <span class="iconify" data-icon="bi:info-circle"></span>
               <span th:text="#{councils.management-closed}"></span>
            </div>

            <div class="card card-border border-base-300">
               <div class="card-body gap-4">
                  <div>
                     <p class="text-sm text-base-content/60" th:text="${council.registrationPeriod.name}"></p>
                     <h2 class="card-title text-xl" th:text="${council.name}"></h2>
                  </div>
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
                     <div class="flex items-center gap-3 rounded-box border border-base-300 px-4 py-3" th:each="member : ${members}">
                        <div class="avatar avatar-placeholder">
                           <div class="w-10 rounded-full bg-base-200 text-base-content">
                              <span th:text="${#strings.substring(member.lecturer.fullName, 0, 1)}"></span>
                           </div>
                        </div>
                        <div class="min-w-0">
                           <p class="truncate font-medium" th:text="${member.lecturer.fullName}"></p>
                           <p class="text-sm text-base-content/60" th:text="#{__${'council-member-roles.' + member.memberRole.name()}__}"></p>
                        </div>
                     </div>
                  </div>
               </div>
            </div>

            <section>
               <h2 class="text-xl font-semibold" th:text="#{councils.section.assignments}"></h2>
               <p class="mt-1 text-sm text-base-content/60" th:text="#{councils.assignments.help}"></p>
               <div role="alert" class="alert alert-info alert-soft mt-4" th:if="${#lists.isEmpty(eligibleRegistrations)}">
                  <span class="iconify" data-icon="bi:info-circle"></span>
                  <span th:text="#{councils.assignments.empty}"></span>
               </div>
               <div class="mt-4 overflow-x-auto rounded-box border border-base-300" th:unless="${#lists.isEmpty(eligibleRegistrations)}">
                  <table class="table table-sm">
                     <thead class="bg-base-200">
                        <tr>
                           <th th:text="#{councils.column.topic}"></th>
                           <th th:text="#{councils.column.group}"></th>
                           <th class="text-right" th:text="#{crud.table.actions}"></th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr th:each="registration : ${eligibleRegistrations}">
                           <td class="font-medium" th:text="${registration.topic.title}"></td>
                           <td th:text="${registration.studentGroup.name}"></td>
                           <td class="text-right">
                              <form method="post" th:action="@{/registration-periods/{periodId}/councils/{councilId}/topics/{topicId}(periodId=${council.registrationPeriod.id},councilId=${council.id},topicId=${registration.topic.id})}">
                                 <button class="btn btn-outline btn-sm" type="submit">
                                    <span class="iconify" data-icon="bi:plus-circle"></span>
                                    <span th:text="#{councils.action.assign}"></span>
                                 </button>
                              </form>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </section>

            <section class="border-t border-base-300 pt-6">
               <h2 class="text-xl font-semibold" th:text="#{councils.section.assigned}"></h2>
               <div role="alert" class="alert alert-info alert-soft mt-4" th:if="${#lists.isEmpty(assignedRegistrations)}">
                  <span class="iconify" data-icon="bi:info-circle"></span>
                  <span th:text="#{councils.assigned.empty}"></span>
               </div>
               <div class="mt-4 overflow-x-auto rounded-box border border-base-300" th:unless="${#lists.isEmpty(assignedRegistrations)}">
                  <table class="table table-sm">
                     <thead class="bg-base-200">
                        <tr>
                           <th th:text="#{councils.column.topic}"></th>
                           <th th:text="#{councils.column.group}"></th>
                           <th th:text="#{councils.column.registration-status}"></th>
                           <th class="text-right" th:if="${managementOpen}" th:text="#{crud.table.actions}"></th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr th:each="registration : ${assignedRegistrations}">
                           <td class="font-medium" th:text="${registration.topic.title}"></td>
                           <td th:text="${registration.studentGroup.name}"></td>
                           <td>
                              <span class="badge badge-success badge-soft" th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"></span>
                           </td>
                           <td class="text-right" th:if="${managementOpen}">
                              <form method="post" th:action="@{/registration-periods/{periodId}/councils/{councilId}/topics/{topicId}/unassign(periodId=${council.registrationPeriod.id},councilId=${council.id},topicId=${registration.topic.id})}">
                                 <button class="btn btn-error btn-outline btn-sm" type="submit">
                                    <span class="iconify" data-icon="bi:x-circle"></span>
                                    <span th:text="#{councils.action.unassign}"></span>
                                 </button>
                              </form>
                           </td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </section>
         </section>
      </th:block>
   </body>
</html>
