<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><th:block th:fragment="form-fields(data, isReadonly, validationRules)"><div class="form-control"><label class="label" for="title">Tiêu đề</label><input id="title" name="title" class="input w-full" th:value="*{title}" th:readonly="${isReadonly}"/></div><div class="form-control"><label class="label" for="content">Nội dung</label><textarea id="content" name="content" class="textarea w-full" rows="8" th:text="*{content}" th:readonly="${isReadonly}"></textarea></div><div class="form-control" th:unless="${isReadonly}"><label class="label">Đối tượng</label><label class="label justify-start gap-2" th:each="role : ${roles}"><input name="roleIds" type="checkbox" class="checkbox" th:value="${role.id}" th:checked="${data.roleIds != null and data.roleIds.contains(role.id)}"/><span th:text="${role.name}"></span></label></div></th:block></html>
