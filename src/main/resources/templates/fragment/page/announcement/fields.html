<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <th:block th:fragment="form-fields">
      <div class="form-control">
         <label
            class="label"
            for="title"
            th:text="#{announcements.field.title}"
         ></label>
         <input
            th:field="*{title}"
            class="input w-full"
            th:classappend="${#fields.hasErrors('title')} ? ' input-error'"
            th:readonly="${form.readonly}"
            th:attr="validate-data=${form.validationRules.title}"
         />
         <div id="title-error">
            <span
               class="text-error text-sm mt-1 block"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}"
            ></span>
         </div>
      </div>
      <div class="form-control">
         <label
            class="label"
            for="content"
            th:text="#{announcements.field.content}"
         ></label>
         <textarea
            th:field="*{content}"
            class="textarea w-full"
            th:classappend="${#fields.hasErrors('content')} ? ' textarea-error'"
            rows="8"
            th:readonly="${form.readonly}"
            th:attr="validate-data=${form.validationRules.content}"
         ></textarea>
         <div id="content-error">
            <span
               class="text-error text-sm mt-1 block"
               th:if="${#fields.hasErrors('content')}"
               th:errors="*{content}"
            ></span>
         </div>
      </div>
      <div class="form-control" th:unless="${form.readonly}">
         <span class="label" th:text="#{announcements.field.audience}"></span>
         <label class="label justify-start gap-2" th:each="role : ${roles}">
            <input
               th:field="*{roleIds}"
               type="checkbox"
               class="checkbox"
               th:value="${role.id}"
            />
            <span th:text="#{roles.__${role.name}__}"></span>
         </label>
         <span
            class="text-error text-sm mt-1 block"
            th:if="${#fields.hasErrors('roleIds')}"
            th:errors="*{roleIds}"
         ></span>
      </div>
   </th:block>
</html>
