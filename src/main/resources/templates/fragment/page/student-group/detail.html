<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
<body><th:block layout:fragment="page-content">
  <div role="alert" class="alert alert-error mb-5" th:if="${error != null}" th:text="#{__${error}__}"></div>
  <div class="grid gap-5 xl:grid-cols-3">
    <section class="card card-border border-base-300 shadow-sm"><div class="card-body p-6"><div class="flex items-start gap-3"><span class="iconify text-primary text-2xl" data-icon="bi:people-fill"></span><div><p class="text-sm text-base-content/60" th:text="#{student-groups.page.detail.title}"></p><h2 class="card-title text-xl" th:text="${group.name}"></h2></div></div><p class="text-base-content/60" th:text="${group.registrationPeriod.name}"></p><span th:if="${registration != null}" class="badge badge-info badge-soft" th:text="#{__${'topic-registrations.status.' + registration.status.name()}__}"></span><p class="text-sm text-error" th:if="${registration != null and registration.rejectionReason != null}" th:text="${registration.rejectionReason}"></p><div class="card-actions mt-auto" th:if="${isLeader and isOpen and isDraftRegistration}"><form th:action="@{/registration-periods/{periodId}/student-group/{groupId}/request-approval(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><button class="btn btn-primary"><span class="iconify" data-icon="bi:send-check"></span><span th:text="#{topic-registrations.action.request-approval}"></span></button></form></div><div role="alert" class="alert alert-warning mt-auto" th:unless="${isOpen}" th:text="#{student-groups.locked}"></div></div></section>
    <section class="card card-border border-base-300 shadow-sm"><div class="card-body p-6"><div class="flex items-center gap-3"><span class="iconify text-primary text-2xl" data-icon="bi:person-lines-fill"></span><h2 class="card-title" th:text="#{student-groups.members}"></h2></div><ul class="space-y-3"><li class="flex items-center justify-between gap-3" th:each="member : ${members}"><div class="flex min-w-0 items-center gap-3"><div class="avatar avatar-placeholder"><div class="w-10 rounded-full bg-base-200 text-base-content"><span th:text="${#strings.substring(member.student.fullName, 0, 1)}"></span></div></div><div class="min-w-0"><p class="truncate font-medium" th:text="${member.student.fullName}"></p><span class="badge badge-warning badge-soft badge-sm" th:if="${member.leader}"><span class="iconify" data-icon="bi:star-fill"></span><span th:text="#{student-groups.leader}"></span></span></div></div><div th:if="${isLeader and isOpen and !member.leader}" class="flex shrink-0 gap-1"><form th:action="@{/registration-periods/{periodId}/student-group/{groupId}/leader(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><input type="hidden" name="memberId" th:value="${member.id}"><button class="btn btn-ghost btn-xs" th:title="#{student-groups.action.transfer-leader}"><span class="iconify" data-icon="bi:star"></span></button></form><form th:action="@{/registration-periods/{periodId}/student-group/{groupId}/members/{memberId}/delete(periodId=${group.registrationPeriod.id},groupId=${group.id},memberId=${member.id})}" method="post"><button class="btn btn-ghost btn-xs text-error" th:title="#{student-groups.action.remove-member}"><span class="iconify" data-icon="bi:trash"></span></button></form></div></li></ul><form th:if="${isLeader and isOpen}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/members(periodId=${group.registrationPeriod.id},groupId=${group.id})}" th:object="${addMemberForm}" method="post" class="mt-auto"><div class="join w-full"><input class="input join-item w-full" th:field="*{studentCode}" th:placeholder="#{student-groups.field.student-code}"><button class="btn btn-primary join-item"><span class="iconify" data-icon="bi:plus-lg"></span><span th:text="#{student-groups.action.add-member}"></span></button></div><span class="text-error text-sm" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></span><div role="alert" class="alert alert-error mt-3" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div></form></div></section>
    <section class="card card-border border-base-300 shadow-sm"><div class="card-body p-6"><div class="flex items-center gap-3"><span class="iconify text-primary text-2xl" data-icon="bi:folder2-open"></span><h2 class="card-title" th:text="#{student-groups.topic}"></h2></div><th:block th:if="${registration != null}"><h3 class="text-xl font-semibold" th:text="${registration.topic.title}"></h3><div class="flex flex-wrap gap-2"><span class="badge badge-outline badge-sm" th:text="${registration.topic.department.name}"></span><span class="badge badge-ghost badge-sm" th:each="adviser : ${registration.topic.advisers}" th:text="${adviser.fullName}"></span></div><p class="text-base-content/70" th:text="${registration.topic.description}"></p></th:block><p class="text-base-content/60" th:unless="${registration != null}" th:text="#{student-groups.topic.empty}"></p><div class="card-actions mt-auto" th:if="${isLeader and isOpen}"><a class="btn btn-outline" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/topics(periodId=${group.registrationPeriod.id},groupId=${group.id})}" th:text="${registration == null} ? #{student-groups.action.select-topic} : #{student-groups.action.change-topic}"></a></div></div></section>
  </div>
  <section class="card card-border border-base-300 shadow-sm" th:if="${registration != null}"><div class="card-body"><div class="flex items-center justify-between gap-3"><div><h2 class="card-title" th:text="#{report-submissions.title}"></h2><p class="text-sm text-base-content/60" th:text="#{report-submissions.description}"></p><p class="text-sm text-base-content/60"><span th:text="#{report-submissions.deadline}"></span><span> · </span><span class="tabular-nums" th:text="${#temporals.format(group.registrationPeriod.reportDeadline, 'dd/MM/yyyy HH:mm')}"></span></p></div><span class="badge badge-soft badge-success" th:if="${currentReport != null}" th:text="#{__${'report-submissions.status.' + currentReport.status.name()}__}"></span></div><div role="alert" class="alert alert-info alert-soft" th:if="${currentReport == null and !isReportUploadClosed and !isReportUploadNotStarted}" th:text="#{report-submissions.empty}"></div><div role="alert" class="alert alert-info alert-soft" th:if="${isReportUploadNotStarted}"><span class="iconify" data-icon="bi:clock"></span><span th:text="#{report-submissions.error.not-open}"></span></div><div role="alert" class="alert alert-warning alert-soft" th:if="${isReportUploadClosed}"><span class="iconify" data-icon="bi:lock"></span><span th:text="#{report-submissions.error.deadline-passed}"></span></div><form th:if="${canUploadReport}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/reports/{registrationId}(periodId=${group.registrationPeriod.id},groupId=${group.id},registrationId=${registration.id})}" method="post" enctype="multipart/form-data" class="flex flex-col gap-3 sm:flex-row"><input class="file-input file-input-primary w-full" type="file" name="files" multiple accept=".pdf,.docx,.zip,.rar" required><button class="btn btn-primary" type="submit"><span class="iconify" data-icon="bi:upload"></span><span th:text="#{report-submissions.action.upload}"></span></button></form><div class="overflow-x-auto"><table class="table table-sm"><thead><tr><th th:text="#{report-submissions.column.submitted-at}"></th><th th:text="#{report-submissions.column.status}"></th><th></th></tr></thead><tbody><tr th:each="submission : ${reportHistory}"><td th:text="${#temporals.format(submission.submittedAt, 'dd/MM/yyyy HH:mm')}"></td><td><span class="badge badge-soft" th:classappend="${submission.status.name() == 'REPLACED'} ? ' badge-ghost' : ' badge-success'" th:text="#{__${'report-submissions.status.' + submission.status.name()}__}"></span></td><td><a th:each="file : ${submission.files}" class="btn btn-xs btn-outline" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/reports/files/{fileId}(periodId=${group.registrationPeriod.id},groupId=${group.id},fileId=${file.id})}" th:text="${file.originalName}"></a></td></tr></tbody></table></div></div></section>
  <section class="mt-5 border-t border-base-300 pt-6" th:if="${publishedResult != null}"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-start"><div><p class="text-sm text-base-content/60" th:text="#{student-results.published}"></p><h2 class="text-xl font-semibold" th:text="#{student-results.title}"></h2><p class="mt-2 text-base-content/70" th:if="${publishedResult.summaryComment != null}" th:text="${publishedResult.summaryComment}"></p></div><div class="text-left sm:text-right"><p class="text-sm text-base-content/60" th:text="#{student-results.final-score}"></p><p class="text-3xl font-semibold tabular-nums text-success" th:text="${publishedResult.finalScore}"></p></div></div></section>
</th:block></body></html>
