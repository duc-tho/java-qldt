<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
<body>
<th:block layout:fragment="page-meta"><div class="ml-14 mt-3 flex flex-wrap items-center gap-2">
  <span class="badge badge-primary badge-soft" th:text="|#{student-groups.group-code}: #${group.id}|"></span>
  <span class="badge badge-info badge-soft" th:text="|#{student-groups.period-label} ${group.registrationPeriod.name}|"></span>
  <span class="badge badge-neutral badge-soft" th:text="|#{student-groups.created-at}: ${#temporals.format(group.createdAt, 'dd/MM/yyyy HH:mm')}|"></span>
  <span class="badge badge-secondary badge-soft" th:if="${leader != null}" th:text="|#{student-groups.leader}: ${leader.student.fullName} (${leader.student.userCode})|"></span>
</div></th:block>
<th:block layout:fragment="actions"><form th:if="${isLeader and (registration == null or isDraftRegistration)}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/request-approval(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><button class="btn btn-primary btn-sm" th:disabled="${!isOpen or !isDraftRegistration or members.size() < 3}" th:text="#{topic-registrations.action.request-approval}"></button></form></th:block>
<th:block layout:fragment="page-content">
  <div role="alert" class="alert alert-error" th:if="${error != null}" th:text="#{__${error}__}"></div>
  <section class="card card-border overflow-hidden" th:with="status=${registration == null ? 'NONE' : registration.status.name()}" th:classappend="${status == 'APPROVED'} ? ' border-success/50' : (${status == 'REJECTED'} ? ' border-error/50' : (${status == 'PENDING'} ? ' border-warning/50' : (${status == 'DRAFT'} ? ' border-info/50' : ' border-base-300')))"><div class="card-body gap-0 p-0">
    <div class="flex flex-wrap items-start justify-between gap-4 border-b border-base-300 p-5 md:px-7" th:classappend="${status == 'APPROVED'} ? ' bg-success/10' : (${status == 'REJECTED'} ? ' bg-error/10' : (${status == 'PENDING'} ? ' bg-warning/10' : (${status == 'DRAFT'} ? ' bg-info/10' : ' bg-base-200/40'))) ">
      <div class="flex min-w-0 flex-1 items-start gap-3">
        <span class="flex size-9 shrink-0 items-center justify-center rounded-full text-xl leading-none" th:classappend="${status == 'APPROVED'} ? ' bg-success text-success-content' : (${status == 'REJECTED'} ? ' bg-error text-error-content' : (${status == 'PENDING'} ? ' bg-warning text-warning-content' : (${status == 'DRAFT'} ? ' bg-info text-info-content' : ' bg-neutral text-neutral-content'))) "><span class="iconify text-inherit" th:attr="data-icon=${status == 'APPROVED' ? 'bi:check-circle' : (status == 'REJECTED' ? 'bi:x-circle' : (status == 'PENDING' ? 'bi:hourglass-split' : (status == 'DRAFT' ? 'bi:pencil-square' : 'bi:journal-plus')))}"></span></span>
        <div class="min-w-0">
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1"><h2 class="text-sm font-bold uppercase tracking-wide" th:text="#{__${'student-groups.status.' + status}__}"></h2><span class="text-xs text-base-content/60" th:if="${statusChangedAt != null}" th:text="|#{__${'student-groups.status.time.' + status}__}: ${#temporals.format(statusChangedAt, 'dd/MM/yyyy HH:mm')}|"></span></div>
          <p class="mt-1 text-sm leading-relaxed text-base-content/80" th:text="${#messages.msg(statusGuidanceKey, members.size())}"></p>
          <p class="mt-2 text-sm text-error" th:if="${registration != null and registration.status.name() == 'REJECTED' and registration.rejectionReason != null}"><span class="font-semibold" th:text="#{student-groups.status.reason}"></span> <span th:text="${registration.rejectionReason}"></span></p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2" th:with="deadline=${status == 'APPROVED' ? group.registrationPeriod.reportDeadline : group.registrationPeriod.studentRegistrationEnd}">
        <div class="rounded-box border border-base-300 bg-base-100/70 px-3 py-2 text-xs font-medium tabular-nums" th:if="${deadline != null}"><span th:text="${status == 'APPROVED'} ? #{student-groups.status.report-deadline} : (${status == 'PENDING'} ? #{student-groups.status.review-deadline} : #{student-groups.status.registration-deadline})"></span> <time th:text="${#temporals.format(deadline, 'dd/MM/yyyy HH:mm')}"></time></div>
        <form th:if="${isLeader and (registration == null or isDraftRegistration)}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/request-approval(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><button class="btn btn-primary btn-sm" th:disabled="${!isOpen or !isDraftRegistration or members.size() < 3}" th:text="#{topic-registrations.action.request-approval}"></button></form>
      </div>
    </div>
    <div th:if="${registration == null}" class="flex min-h-64 flex-col items-center justify-center gap-4 p-5 text-center"><span class="iconify text-4xl text-base-content/40" data-icon="bi:journal-plus"></span><p class="text-base-content/60" th:text="#{student-groups.topic.empty}"></p><a th:if="${isLeader and isOpen}" class="btn btn-primary" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/topics(periodId=${group.registrationPeriod.id},groupId=${group.id})}" th:text="#{student-groups.action.select-topic}"></a></div>
    <div th:if="${registration != null}" class="space-y-5 p-5 md:p-7">
      <div><div class="flex flex-wrap gap-2"><span class="badge badge-primary badge-soft" th:text="|#{student-groups.topic-code}: #${registration.topic.id}|"></span><span class="badge badge-info badge-soft" th:text="|#{topics.column.department}: ${registration.topic.department.name}|"></span></div><h2 class="mt-3 text-xl font-semibold leading-snug md:text-2xl" th:text="${registration.topic.title}"></h2></div>
      <div class="grid gap-3 border-t border-base-300 pt-5" th:classappend="${registration.topic.advisers.size() > 1} ? ' md:grid-cols-2' : ' md:grid-cols-1'"><div class="rounded-box border border-base-300 bg-base-200/40 p-4" th:each="adviser : ${registration.topic.advisers}"><p class="text-xs font-semibold uppercase tracking-wide text-base-content/60" th:text="#{student-groups.adviser}"></p><p class="mt-2 font-semibold" th:text="${adviser.fullName}"></p><div class="mt-1 flex flex-wrap gap-x-4 gap-y-1 text-sm text-base-content/70"><span th:text="${adviser.userCode}"></span><span th:text="${adviser.email}"></span><span th:if="${adviser.phone != null}" th:text="${adviser.phone}"></span></div></div></div>
      <div class="rounded-box border border-base-300 bg-base-200/40 p-4"><h3 class="font-semibold" th:text="#{student-groups.topic.content}"></h3><p class="mt-2 whitespace-pre-line text-sm leading-relaxed text-base-content/80" th:text="${registration.topic.description}"></p></div>
      <div class="flex flex-wrap items-center justify-between gap-3 border-t border-base-300 pt-4"><a class="btn btn-ghost btn-sm" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/topic(periodId=${group.registrationPeriod.id},groupId=${group.id})}"><span class="iconify" data-icon="bi:eye"></span><span th:text="#{student-groups.action.topic-detail}"></span></a><a th:if="${isLeader and isOpen and canEditRegistration}" class="btn btn-outline btn-sm" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/topics(periodId=${group.registrationPeriod.id},groupId=${group.id})}" th:text="#{student-groups.action.change-topic}"></a></div>
      <div class="alert alert-info alert-soft text-sm" th:if="${registration.status.name() == 'PENDING'}"><span class="iconify" data-icon="bi:info-circle"></span><span th:text="#{student-groups.topic.change-note}"></span></div>
    </div>
  </div></section>
  <div class="grid items-stretch gap-5 lg:grid-cols-3">
    <section class="card card-border border-base-300 lg:col-span-2"><div class="card-body gap-5">
      <div class="flex flex-wrap items-center justify-between gap-3"><h2 class="card-title"><span class="iconify" data-icon="bi:people"></span><span th:text="#{student-groups.members}"></span></h2><span class="badge badge-primary badge-soft" th:text="#{student-groups.slots-remaining(${5 - members.size()})}"></span></div>
      <div class="alert alert-info alert-soft text-sm"><span class="iconify" data-icon="bi:info-circle"></span><span th:text="#{student-groups.member-rule}"></span></div>
      <ul class="space-y-3"><li class="flex flex-wrap items-center justify-between gap-3 rounded-box border border-base-300 p-3" th:each="member : ${members}"><div class="flex min-w-0 items-center gap-3"><div class="avatar avatar-placeholder"><div class="w-10 rounded-full bg-base-200 text-base-content"><span th:text="${#strings.substring(member.student.fullName, 0, 1)}"></span></div></div><div><p class="font-semibold" th:text="${member.student.fullName}"></p><p class="text-sm text-base-content/60" th:text="${member.student.userCode}"></p></div><span class="badge badge-warning badge-soft badge-sm" th:if="${member.leader}" th:text="#{student-groups.leader}"></span></div><div class="flex gap-1" th:if="${isLeader and isOpen and canEditRegistration and !member.leader}"><form th:action="@{/registration-periods/{periodId}/student-group/{groupId}/leader(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><input type="hidden" name="memberId" th:value="${member.id}"><button class="btn btn-ghost btn-xs" th:title="#{student-groups.action.transfer-leader}"><span class="iconify" data-icon="bi:star"></span></button></form><form th:action="@{/registration-periods/{periodId}/student-group/{groupId}/members/{memberId}/delete(periodId=${group.registrationPeriod.id},groupId=${group.id},memberId=${member.id})}" method="post"><button class="btn btn-ghost btn-xs text-error" th:title="#{student-groups.action.remove-member}"><span class="iconify" data-icon="bi:trash"></span></button></form></div></li></ul>
      <div th:if="${isLeader and isOpen and canEditRegistration and members.size() < 5}" th:object="${addMemberForm}" class="rounded-box border border-dashed border-base-300 p-4"><p class="font-medium" th:text="#{student-groups.slots-remaining(${5 - members.size()})}"></p><form class="mt-3 flex flex-col gap-2 sm:flex-row" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/members(periodId=${group.registrationPeriod.id},groupId=${group.id})}" method="post"><input class="input w-full" th:field="*{studentCode}" th:placeholder="#{student-groups.field.student-code}"><button class="btn btn-primary" th:text="#{student-groups.action.add-member}"></button></form><p class="mt-2 text-xs text-base-content/60" th:text="#{student-groups.member-note}"></p><span class="text-error text-sm" th:if="${#fields.hasErrors('studentCode')}" th:errors="*{studentCode}"></span><div role="alert" class="alert alert-error mt-3" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div></div>
      <div class="border-t border-base-300 pt-4"><h3 class="font-semibold" th:text="#{student-groups.leader-responsibilities}"></h3><ul class="mt-2 list-disc space-y-1 pl-5 text-sm text-base-content/70"><li th:text="#{student-groups.leader-task.members}"></li><li th:text="#{student-groups.leader-task.report}"></li><li th:text="#{student-groups.leader-task.topic}"></li></ul></div>
    </div></section>
    <section class="card card-border border-base-300 relative"><div class="card-body min-h-0 lg:absolute lg:inset-0" th:insert="~{fragment/page/student-group/activity :: timeline(${activities})}"></div></section>
  </div>
  <section class="card card-border border-base-300" th:if="${isLeader and registration != null}"><div class="card-body"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="card-title" th:text="#{report-submissions.title}"></h2><p class="text-sm text-base-content/60" th:text="#{report-submissions.description}"></p><p class="text-sm text-base-content/60" th:if="${group.registrationPeriod.reportDeadline != null}" th:text="${#temporals.format(group.registrationPeriod.reportDeadline, 'dd/MM/yyyy HH:mm')}"></p></div><span class="badge badge-success badge-soft" th:if="${currentReport != null}" th:text="#{__${'report-submissions.status.' + currentReport.status.name()}__}"></span></div><div class="alert alert-info alert-soft" th:if="${currentReport == null and !isReportUploadClosed and !isReportUploadNotStarted}" th:text="#{report-submissions.empty}"></div><div class="alert alert-info alert-soft" th:if="${isReportUploadNotStarted}" th:text="#{report-submissions.error.not-open}"></div><div class="alert alert-warning alert-soft" th:if="${isReportUploadClosed}" th:text="#{report-submissions.error.deadline-passed}"></div><form th:if="${canUploadReport}" th:action="@{/registration-periods/{periodId}/student-group/{groupId}/reports/{registrationId}(periodId=${group.registrationPeriod.id},groupId=${group.id},registrationId=${registration.id})}" method="post" enctype="multipart/form-data" class="flex flex-col gap-3 sm:flex-row"><input class="file-input file-input-primary w-full" type="file" name="files" multiple accept=".pdf,.docx,.zip,.rar" required><button class="btn btn-primary" type="submit" th:text="#{report-submissions.action.upload}"></button></form><div class="overflow-x-auto"><table class="table table-sm"><thead><tr><th th:text="#{report-submissions.column.submitted-at}"></th><th th:text="#{report-submissions.column.status}"></th><th></th></tr></thead><tbody><tr th:each="submission : ${reportHistory}"><td th:text="${#temporals.format(submission.submittedAt, 'dd/MM/yyyy HH:mm')}"></td><td><span class="badge badge-soft" th:classappend="${submission.status.name() == 'REPLACED'} ? 'badge-ghost' : 'badge-success'" th:text="#{__${'report-submissions.status.' + submission.status.name()}__}"></span></td><td><a th:each="file : ${submission.files}" class="btn btn-xs btn-outline" th:href="@{/registration-periods/{periodId}/student-group/{groupId}/reports/files/{fileId}(periodId=${group.registrationPeriod.id},groupId=${group.id},fileId=${file.id})}" th:text="${file.originalName}"></a></td></tr></tbody></table></div></div></section>
  <section class="card card-border border-base-300" th:if="${publishedResult != null}"><div class="card-body flex flex-col justify-between gap-4 sm:flex-row sm:items-start"><div><p class="text-sm text-base-content/60" th:text="#{student-results.published}"></p><h2 class="card-title" th:text="#{student-results.title}"></h2><p class="mt-2" th:if="${publishedResult.summaryComment != null}" th:text="${publishedResult.summaryComment}"></p></div><div><p class="text-sm text-base-content/60" th:text="#{student-results.final-score}"></p><p class="text-3xl font-semibold text-success" th:text="${publishedResult.finalScore}"></p></div></div></section>
</th:block>
</body></html>
