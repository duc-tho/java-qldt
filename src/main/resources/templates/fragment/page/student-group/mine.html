<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" th:if="${!#lists.isEmpty(groups)}">
            <article class="card card-border h-full overflow-hidden border-base-300 bg-base-100 shadow-sm" th:each="summary : ${groups}">
               <div class="card-body gap-0 p-0">
                  <div class="border-b border-base-300 p-5">
                     <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0">
                           <h2 class="card-title text-lg" th:text="${summary.group.name}"></h2>
                           <p class="mt-1 text-sm font-medium text-primary" th:text="${summary.group.registrationPeriod.name}"></p>
                        </div>
                        <span class="badge badge-primary badge-soft shrink-0" th:text="|#${summary.group.id}|"></span>
                     </div>
                     <div class="mt-4 flex flex-wrap gap-2">
                        <span class="badge badge-neutral badge-soft badge-sm" th:if="${summary.group.registrationPeriod.periodType != null}" th:text="#{__${'period-types.' + summary.group.registrationPeriod.periodType.name()}__}"></span>
                        <span class="badge badge-neutral badge-soft badge-sm" th:if="${summary.registration == null}" th:text="#{student-groups.registration.empty}"></span>
                        <span class="badge badge-soft badge-sm" th:if="${summary.registration != null}" th:classappend="${summary.registration.status.name() == 'APPROVED'} ? ' badge-success' : (${summary.registration.status.name() == 'REJECTED'} ? ' badge-error' : (${summary.registration.status.name() == 'PENDING'} ? ' badge-warning' : ' badge-neutral'))" th:text="#{__${'topic-registrations.status.' + summary.registration.status.name()}__}"></span>
                     </div>
                  </div>

                  <div class="flex-1 space-y-5 p-5">
                     <div class="rounded-box border border-base-300 bg-base-200/40 p-4">
                        <p class="text-xs font-semibold uppercase tracking-wide text-base-content/60" th:text="#{student-groups.summary.topic-label}"></p>
                        <p class="mt-2 font-semibold leading-snug" th:text="${summary.registration != null} ? ${summary.registration.topic.title} : #{student-groups.topic.empty}"></p>
                        <p class="mt-1 text-sm text-base-content/65" th:if="${summary.registration != null}" th:text="|#{topics.column.department}: ${summary.registration.topic.department.name}|"></p>
                     </div>

                     <dl class="space-y-3 text-sm">
                        <div class="flex items-start justify-between gap-3">
                           <dt class="flex items-center gap-2 text-base-content/65"><span class="iconify" data-icon="bi:people"></span><span th:text="#{student-groups.summary.members-label}"></span></dt>
                           <dd class="text-right font-medium" th:text="#{student-groups.summary.members(${summary.memberCount})}"></dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                           <dt class="flex items-center gap-2 text-base-content/65"><span class="iconify" data-icon="bi:person-badge"></span><span th:text="#{student-groups.leader}"></span></dt>
                           <dd class="text-right font-medium" th:text="|${summary.leaderCode} (${summary.leaderName})|"></dd>
                        </div>
                        <div class="flex items-start justify-between gap-3" th:if="${summary.group.registrationPeriod.studentRegistrationEnd != null}">
                           <dt class="flex items-center gap-2 text-base-content/65"><span class="iconify" data-icon="bi:clock"></span><span th:text="#{student-groups.summary.deadline}"></span></dt>
                           <dd class="text-right font-medium tabular-nums" th:text="${#temporals.format(summary.group.registrationPeriod.studentRegistrationEnd, 'dd/MM/yyyy HH:mm')}"></dd>
                        </div>
                        <div class="flex items-start justify-between gap-3">
                           <dt class="flex items-center gap-2 text-base-content/65"><span class="iconify" data-icon="bi:calendar-plus"></span><span th:text="#{student-groups.created-at}"></span></dt>
                           <dd class="text-right font-medium tabular-nums" th:text="${#temporals.format(summary.group.createdAt, 'dd/MM/yyyy HH:mm')}"></dd>
                        </div>
                     </dl>

                     <div class="flex items-center justify-between gap-3 border-t border-base-300 pt-4" th:if="${!#lists.isEmpty(summary.students)}">
                        <span class="text-sm text-base-content/65" th:text="#{student-groups.summary.participants}"></span>
                        <div class="avatar-group -space-x-2">
                           <div class="avatar avatar-placeholder" th:each="member, memberStat : ${summary.students}" th:if="${memberStat.index < 4}" th:title="${member.fullName}">
                              <div class="w-8 rounded-full border-2 border-base-100 bg-primary text-xs font-semibold text-primary-content"><span th:text="${#strings.substring(member.fullName, 0, 1)}"></span></div>
                           </div>
                           <span class="badge badge-neutral badge-soft relative ml-1" th:if="${summary.memberCount > 4}" th:text="|+${summary.memberCount - 4}|"></span>
                        </div>
                     </div>
                  </div>

                  <div class="flex justify-end border-t border-base-300 bg-base-200/30 px-5 py-4">
                     <a class="btn btn-outline btn-sm" th:href="@{/registration-periods/{periodId}/student-group/{groupId}(periodId=${summary.group.registrationPeriod.id},groupId=${summary.group.id})}"><span class="iconify" data-icon="bi:arrow-up-right"></span><span th:text="#{student-groups.action.view-group}"></span></a>
                  </div>
               </div>
            </article>
         </div>
         <div class="alert alert-info" th:if="${#lists.isEmpty(groups)}" th:text="#{student-groups.mine.empty}"></div>
      </th:block>
   </body>
</html>
