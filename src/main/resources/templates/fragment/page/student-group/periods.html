<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
<body><th:block layout:fragment="page-content">
  <div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3" th:if="${!#lists.isEmpty(periods)}">
    <article class="card card-border border-base-300 shadow-sm" th:each="period : ${periods}">
      <div class="card-body p-6">
        <h2 class="card-title" th:text="${period.name}"></h2>
        <p class="text-sm text-base-content/60" th:text="#{student-groups.period.end(${#temporals.format(period.studentRegistrationEnd, 'dd/MM/yyyy HH:mm')})}"></p>
        <div class="card-actions justify-end">
          <a class="btn btn-primary" th:href="@{/registration-periods/{periodId}/student-group(periodId=${period.id})}" th:text="#{student-groups.action.open}"></a>
        </div>
      </div>
    </article>
  </div>
  <div role="alert" class="alert alert-info" th:if="${#lists.isEmpty(periods)}" th:text="#{student-groups.periods.empty}"></div>
</th:block></body></html>
