<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions">
         <a class="btn btn-outline btn-sm"
            th:href="@{/registration-periods/{periodId}/student-group/{groupId}(periodId=${group.registrationPeriod.id},groupId=${group.id})}">
            <span class="iconify" data-icon="bi:arrow-left"></span>
            <span th:text="#{navigation.action.back}"></span>
         </a>
      </th:block>
      <th:block layout:fragment="page-content">
         <article class="card card-border w-full max-w-3xl overflow-hidden border-base-300 bg-base-100 shadow-sm">
            <div class="card-body gap-0 p-0">
               <header class="border-b border-base-300 p-5 sm:p-6">
                  <div class="flex flex-wrap items-center justify-between gap-3 border-b border-base-300 pb-3">
                     <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-base-content/60">
                        <span class="flex items-center gap-1.5">
                           <span class="iconify text-primary" data-icon="bi:calendar3"></span>
                           <span th:text="${group.registrationPeriod.name}"></span>
                        </span>
                        <span class="font-mono" th:text="|#{student-groups.topic-code} #${topic.id}|"></span>
                     </div>
                     <span class="badge badge-soft"
                        th:classappend="${topic.status.name() == 'APPROVED'} ? ' badge-success' : (${topic.status.name() == 'REJECTED'} ? ' badge-error' : ' badge-warning')"
                        th:text="#{__${'topics.status.' + topic.status.name()}__}"></span>
                  </div>
                  <p class="mt-3 flex items-center gap-1.5 text-xs text-base-content/60">
                     <span class="iconify text-primary" data-icon="bi:building"></span>
                     <span th:text="${topic.department.name}"></span>
                  </p>
                  <h2 class="mt-2 text-xl font-semibold leading-snug sm:text-2xl"
                     th:text="${topic.title}"></h2>
               </header>

               <div class="space-y-6 p-5 sm:p-6">
                  <section>
                     <h3 class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-base-content/60">
                        <span class="iconify text-primary" data-icon="bi:person-badge"></span>
                        <span th:text="#{student-groups.adviser}"></span>
                     </h3>
                     <ul class="grid gap-3 md:grid-cols-2">
                        <li class="rounded-field border border-base-300 bg-base-200/50 p-4"
                           th:each="adviser : ${topic.advisers}">
                           <p class="font-semibold" th:text="${adviser.fullName}"></p>
                           <p class="mt-0.5 font-mono text-xs text-base-content/60"
                              th:text="${adviser.userCode}"></p>
                           <div class="mt-3 space-y-1.5 border-t border-base-300 pt-3 text-sm">
                              <a class="link link-hover flex min-w-0 items-center gap-2 text-primary"
                                 th:href="|mailto:${adviser.email}|">
                                 <span class="iconify shrink-0" data-icon="bi:envelope"></span>
                                 <span class="truncate" th:text="${adviser.email}"></span>
                              </a>
                              <p class="flex items-center gap-2 text-base-content/70"
                                 th:if="${adviser.phone != null and !adviser.phone.isBlank()}">
                                 <span class="iconify" data-icon="bi:telephone"></span>
                                 <span th:text="${adviser.phone}"></span>
                              </p>
                           </div>
                        </li>
                     </ul>
                  </section>

                  <section class="border-t border-base-300 pt-5">
                     <h3 class="mb-3 flex items-center gap-2 text-xs font-semibold uppercase tracking-wide text-base-content/60">
                        <span class="iconify text-primary" data-icon="bi:card-text"></span>
                        <span th:text="#{student-groups.topic.content}"></span>
                     </h3>
                     <div class="rounded-field border border-base-300 bg-base-200/40 p-4">
                        <p class="whitespace-pre-line text-sm leading-relaxed text-base-content/80"
                           th:text="${topic.description}"></p>
                     </div>
                  </section>
               </div>
            </div>
         </article>
      </th:block>
   </body>
</html>
