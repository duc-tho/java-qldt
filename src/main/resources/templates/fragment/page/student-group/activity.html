<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
   <th:block th:fragment="timeline(activities)">
      <div class="flex items-center justify-between gap-3 border-b border-base-300 pb-3">
         <h2 class="card-title text-base"><span class="iconify" data-icon="bi:clock-history"></span><span th:text="#{student-groups.activity.title}"></span></h2>
         <span class="badge badge-ghost badge-sm" th:text="${#lists.size(activities)}"></span>
      </div>
      <p class="text-sm text-base-content/60" th:if="${#lists.isEmpty(activities)}" th:text="#{student-groups.activity.empty}"></p>
      <ol class="space-y-3 overflow-y-auto pr-2" th:unless="${#lists.isEmpty(activities)}">
         <li class="rounded-box border border-base-300 border-l-4 bg-base-200/40 p-3" th:each="activity : ${activities}" th:classappend="${activity.type.name() == 'APPROVED'} ? ' border-l-success' : (${activity.type.name() == 'REJECTED'} ? ' border-l-error' : (${activity.type.name() == 'APPROVAL_REQUESTED'} ? ' border-l-warning' : ' border-l-primary'))">
            <div class="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
               <p class="font-semibold" th:text="#{__${'student-groups.activity.' + activity.type.name()}__}"></p>
               <time class="text-xs tabular-nums text-base-content/60" th:text="${#temporals.format(activity.occurredAt, 'dd/MM/yyyy HH:mm')}"></time>
            </div>
            <p class="mt-2 text-sm leading-relaxed text-base-content/80" th:text="${#messages.msg('student-groups.activity.description.' + activity.type.name(), activity.actor.fullName, activity.subject != null ? activity.subject.fullName : '')}"></p>
            <p class="mt-1 break-words text-sm text-base-content/70" th:if="${activity.detail != null and !activity.detail.isBlank()}">
               <span class="font-medium" th:text="${activity.type.name() == 'REJECTED'} ? #{student-groups.activity.reason} : #{student-groups.activity.topic}"></span>
               <span th:text="${activity.detail}"></span>
            </p>
         </li>
      </ol>
   </th:block>
</html>
