<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <section aria-labelledby="open-proposals-title">
            <h2 id="open-proposals-title" class="text-xl font-semibold"
               th:text="#{topics.proposals.open-section}"></h2>
            <div class="mt-5 grid gap-5 md:grid-cols-2" th:if="${!#lists.isEmpty(openPeriods)}">
               <th:block th:each="period : ${openPeriods}">
                  <article th:replace="~{fragment/page/topic-proposal/period-card :: period-card(${period}, true)}"></article>
               </th:block>
            </div>
            <p class="mt-4 text-sm text-base-content/60" th:if="${#lists.isEmpty(openPeriods)}"
               th:text="#{topics.proposals.open-empty}"></p>
         </section>

         <section class="mt-8" aria-labelledby="closed-proposals-title">
            <h2 id="closed-proposals-title" class="text-xl font-semibold"
               th:text="#{topics.proposals.closed-section}"></h2>
            <div class="mt-5 grid gap-5 md:grid-cols-2" th:if="${!#lists.isEmpty(closedPeriods)}">
               <th:block th:each="period : ${closedPeriods}">
                  <article th:replace="~{fragment/page/topic-proposal/period-card :: period-card(${period}, false)}"></article>
               </th:block>
            </div>
            <p class="mt-4 text-sm text-base-content/60" th:if="${#lists.isEmpty(closedPeriods)}"
               th:text="#{topics.proposals.closed-empty}"></p>
         </section>
      </th:block>
   </body>
</html>
