<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
   <article th:fragment="period-card(period, isOpen)"
      th:with="periodTopics=${topicsByPeriodId[period.id]},visibleLimit=5"
      class="card card-border overflow-hidden border-base-300 bg-base-100 shadow-sm">
      <div class="flex items-center justify-between gap-3 border-b border-base-300 px-5 py-4">
         <h3 class="card-title min-w-0 gap-2.5 text-lg">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-field bg-base-200 text-primary">
               <span class="iconify" data-icon="bi:journal-plus" data-width="18"></span>
            </span>
            <span class="truncate" th:text="${period.name}" th:title="${period.name}"></span>
         </h3>
         <span class="badge badge-outline shrink-0"
            th:text="#{topics.proposals.count(${periodTopics == null ? 0 : #lists.size(periodTopics)})}"></span>
      </div>

      <div class="flex flex-1 flex-col px-5 py-4">
         <ul class="max-h-60 overflow-hidden"
            th:if="${periodTopics != null and !#lists.isEmpty(periodTopics)}">
            <li th:each="topic, topicStat : ${periodTopics}" th:if="${topicStat.index < visibleLimit}">
               <a class="btn btn-ghost btn-sm flex h-11 w-full justify-between gap-3 px-3 text-left font-normal"
                  th:href="@{/registration-periods/{periodId}/topics/{topicId}(periodId=${period.id},topicId=${topic.id})}"
                  th:title="${topic.title}">
                  <span class="min-w-0 truncate text-sm font-medium" th:text="${topic.title}"></span>
                  <span class="badge badge-soft badge-sm shrink-0"
                     th:classappend="${topic.status.name() == 'APPROVED'} ? ' badge-success' : (${topic.status.name() == 'REJECTED'} ? ' badge-error' : ' badge-warning')"
                     th:text="#{__${'topics.status.' + topic.status.name()}__}"></span>
               </a>
            </li>
         </ul>
         <p class="mt-2 px-3 text-sm font-medium text-base-content/60"
            th:if="${periodTopics != null and #lists.size(periodTopics) > visibleLimit}"
            th:text="#{topics.proposals.more(${#lists.size(periodTopics) - visibleLimit})}"></p>
         <p class="text-sm text-base-content/60" th:if="${periodTopics == null or #lists.isEmpty(periodTopics)}"
            th:text="#{topics.lecturer-list.empty}"></p>

         <div class="mt-5 grid grid-cols-2 gap-3 border-t border-base-300 pt-4">
            <a class="btn btn-outline w-full active:translate-y-px"
               th:href="@{/topic-proposals/{periodId}/topics(periodId=${period.id})}"
               th:text="#{topics.action.details}"></a>
            <a class="btn btn-primary w-full active:translate-y-px" th:if="${isOpen}"
               th:href="@{/registration-periods/{periodId}/topics/propose(periodId=${period.id})}"
               th:text="#{topics.action.new-proposal}"></a>
            <button class="btn btn-disabled w-full" th:unless="${isOpen}" type="button" disabled
               aria-disabled="true" th:title="#{topics.action.proposal-closed}"
               th:text="#{topics.action.new-proposal}"></button>
         </div>
      </div>

      <footer class="border-t border-base-300 bg-base-200/80 px-5 py-3">
         <span class="badge badge-warning badge-soft h-auto max-w-full whitespace-normal px-3 py-2 text-left"
            th:text="#{topics.period.end(${#temporals.format(period.lecturerRegistrationEnd, 'dd/MM/yyyy HH:mm')})}"></span>
      </footer>
   </article>
</html>
