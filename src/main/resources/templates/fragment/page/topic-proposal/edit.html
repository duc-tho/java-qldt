<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div class="grid items-start gap-6 lg:grid-cols-[minmax(0,3fr)_minmax(16rem,2fr)]">
            <form class="card card-border border-base-300 w-full max-w-3xl" method="post"
            th:action="@{/topic-proposals/{periodId}/topics/{topicId}(periodId=${periodId},topicId=${topicId})}"
            th:object="${data}">
            <div class="card-body gap-4">
               <div role="alert" class="alert alert-error alert-soft" th:if="${#fields.hasGlobalErrors()}"
                  th:errors="*{global}"></div>
               <label class="fieldset"><span class="label" th:text="#{topics.field.title}"></span>
                  <input class="input w-full" th:field="*{title}">
                  <span class="text-error text-sm" th:errors="*{title}"></span></label>
               <label class="fieldset"><span class="label" th:text="#{topics.field.department}"></span>
                  <select class="select w-full" th:field="*{departmentId}">
                     <option th:each="department : ${departments}" th:value="${department.id}"
                        th:text="${department.name}"></option>
                  </select><span class="text-error text-sm" th:errors="*{departmentId}"></span></label>
               <label class="fieldset"><span class="label" th:text="#{topics.field.description}"></span>
                  <textarea class="textarea w-full" rows="6" th:field="*{description}"></textarea>
                  <span class="text-error text-sm" th:errors="*{description}"></span></label>
               <div th:replace="~{fragment/page/topic/adviser-picker :: picker}"></div>
               <span class="text-error text-sm" th:errors="*{adviserIds}"></span>
               <div class="card-actions justify-end"><a class="btn"
                  th:href="@{/topic-proposals/{periodId}/topics(periodId=${periodId})}"
                  th:text="#{crud.form.cancel}"></a><button class="btn btn-primary"
                  th:text="#{crud.form.save}"></button></div>
            </div>
            </form>
            <aside th:replace="~{fragment/page/topic/proposal-rules :: rules}"></aside>
         </div>
      </th:block>
   </body>
</html>
