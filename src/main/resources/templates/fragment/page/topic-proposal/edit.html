<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}"><body><th:block layout:fragment="page-content"><form class="card card-border border-base-300" method="post" th:action="@{/topic-proposals/{periodId}/topics/{topicId}(periodId=${periodId},topicId=${topicId})}" th:object="${data}"><div class="card-body gap-4"><label class="fieldset"><span class="label" th:text="#{topics.field.title}"></span><input class="input w-full" th:field="*{title}"></label><label class="fieldset"><span class="label" th:text="#{topics.field.department}"></span><select class="select w-full" th:field="*{departmentId}"><option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option></select></label><label class="fieldset"><span class="label" th:text="#{topics.field.description}"></span><textarea class="textarea w-full" rows="6" th:field="*{description}"></textarea></label><label class="fieldset"><span class="label" th:text="#{topics.field.advisers}"></span><select class="select w-full min-h-28" multiple th:field="*{adviserIds}"><option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.fullName}"></option></select></label><div class="card-actions justify-end"><a class="btn" th:href="@{/topic-proposals/{periodId}/topics(periodId=${periodId})}" th:text="#{crud.form.cancel}"></a><button class="btn btn-primary" th:text="#{crud.form.save}"></button></div></div></form></th:block></body></html>
