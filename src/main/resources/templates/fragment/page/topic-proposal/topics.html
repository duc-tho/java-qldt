<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <div class="flex flex-wrap items-center justify-between gap-4 mb-5">
            <p class="text-base-content/70" th:text="${period.name}"></p>
            <a
               th:if="${isProposalOpen}"
               class="btn btn-primary"
               th:href="@{/registration-periods/{periodId}/topics/propose(periodId=${period.id})}"
               ><span class="iconify" data-icon="bi:journal-plus"></span
               ><span th:text="#{topics.action.propose}"></span
            ></a>
            <button
               th:unless="${isProposalOpen}"
               class="btn btn-disabled"
               type="button"
               disabled
               aria-disabled="true"
               tabindex="-1"
               role="button"
               th:text="#{topics.action.proposal-closed}"
            ></button>
         </div>
         <div
            class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"
            th:if="${!#lists.isEmpty(topics)}"
         >
            <article
               class="card card-border border-base-300 shadow-sm"
               th:each="topic : ${topics}"
            >
               <div class="card-body p-6">
                  <h2 class="card-title">
                     <span
                        ><span
                           class="iconify inline-block align-middle mr-2 text-primary text-xl"
                           data-icon="bi:journal-text"
                        ></span
                        ><span th:text="${topic.title}"></span
                     ></span>
                  </h2>
                  <span
                     class="badge badge-outline"
                     th:text="${topic.department.name}"
                  ></span>
                  <span
                     class="badge badge-soft"
                     th:classappend="${topic.status.name() == 'APPROVED'} ? ' badge-success' : (${topic.status.name() == 'REJECTED'} ? ' badge-error' : ' badge-warning')"
                     th:text="#{__${'topics.status.' + topic.status.name()}__}"
                  ></span>
                  <p
                     class="text-base-content/70"
                     th:text="${topic.description}"
                  ></p>
                  <div role="alert" class="alert alert-error alert-soft" th:if="${topic.status.name() == 'REJECTED' and topic.proposedBy != null and topic.proposedBy.id == currentUserId}">
                     <span class="iconify" data-icon="bi:exclamation-circle"></span>
                     <span th:text="${topic.rejectionReason}"></span>
                  </div>
                  <div class="flex flex-wrap gap-2">
                     <span
                        class="badge badge-primary"
                        th:each="adviser : ${topic.advisers}"
                        ><span class="iconify mr-1" data-icon="bi:person"></span
                        ><span th:text="${adviser.fullName}"></span
                     ></span>
                  </div>
                  <div class="card-actions justify-end" th:if="${(topic.status.name() == 'PROPOSED' or topic.status.name() == 'REJECTED') and topic.proposedBy != null and topic.proposedBy.id == currentUserId}">
                     <a class="btn btn-sm" th:href="@{/topic-proposals/{periodId}/topics/{topicId}/edit(periodId=${period.id},topicId=${topic.id})}"><span class="iconify" data-icon="bi:pencil"></span><span th:text="#{topics.action.edit}"></span></a>
                     <form method="post" th:action="@{/topic-proposals/{periodId}/topics/{topicId}/delete(periodId=${period.id},topicId=${topic.id})}"><button class="btn btn-sm btn-error btn-outline"><span class="iconify" data-icon="bi:trash"></span><span th:text="#{topics.action.delete}"></span></button></form>
                  </div>
               </div>
            </article>
         </div>
         <div
            role="alert"
            class="alert alert-info"
            th:if="${#lists.isEmpty(topics)}"
            th:text="#{topics.lecturer-list.empty}"
         ></div>
      </th:block>
   </body>
</html>
