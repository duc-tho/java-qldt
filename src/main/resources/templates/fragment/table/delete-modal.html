<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="delete-modal">
    <dialog id="crud-delete-modal" class="modal">
        <div class="modal-box">
            <h3 class="text-lg font-bold">
                <span class="iconify inline text-error" data-icon="bi:exclamation-triangle" data-width="20"></span>
                Xác nhận xóa
            </h3>
            <p class="py-4">
                Bạn có chắc muốn xóa <span id="crud-delete-name" class="font-semibold"></span>?
            </p>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">
                        <span class="iconify inline" data-icon="bi:x-lg" data-width="14"></span>
                        Hủy
                    </button>
                </form>
                <button id="crud-delete-confirm" type="button" class="btn btn-error"
                    hx-on::after-request="if (event.detail.successful) this.closest('dialog').close()">
                    <span class="iconify inline" data-icon="bi:trash" data-width="14"></span>
                    Xóa
                </button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>đóng</button>
        </form>
    </dialog>

    <script>
        document.addEventListener('click', (event) => {
            const trigger = event.target.closest('[data-delete-url], [data-batch-delete-url]');
            if (!trigger) {
                return;
            }

            const dialog = document.getElementById('crud-delete-modal');
            const name = document.getElementById('crud-delete-name');
            const confirmButton = document.getElementById('crud-delete-confirm');
            const table = document.getElementById('crud-table');
            if (!dialog || !name || !confirmButton) {
                return;
            }

            let url = trigger.dataset.deleteUrl;
            let label = trigger.dataset.deleteName || '';

            if (trigger.hasAttribute('data-batch-delete-url')) {
                const ids = Array.from(table ? table.querySelectorAll('[name="ids"]:checked') : [])
                    .map((checkbox) => checkbox.value);
                if (ids.length === 0) {
                    return;
                }
                url = trigger.dataset.batchDeleteUrl + '?' + ids.map((id) => 'ids=' + encodeURIComponent(id)).join('&');
                label = ids.length + ' bản ghi đã chọn';
            }

            confirmButton.setAttribute('hx-delete', url);
            if (table) {
                confirmButton.setAttribute('hx-target', '#crud-table');
                confirmButton.setAttribute('hx-swap', 'outerHTML');
                confirmButton.setAttribute('hx-include',
                    "[name='search'], [name='sort'], [name='dir'], [name='size']");
            } else {
                confirmButton.removeAttribute('hx-target');
                confirmButton.removeAttribute('hx-swap');
                confirmButton.removeAttribute('hx-include');
            }
            htmx.process(confirmButton);

            name.textContent = label;
            dialog.showModal();
        });
    </script>
</th:block>

</html>
