<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/app.html}">
   <head>
      <title th:text="${#messages.msg(pageTitle)}"></title>
   </head>

   <body>
      <th:block layout:fragment="main">
         <div class="flex flex-col gap-4">
            <div class="flex items-center gap-1">
               <th:block th:replace="~{fragment/ui/navigation-actions :: pageBack(#{navigation.action.back}, #{navigation.item.home})}"></th:block>
               <div class="breadcrumbs text-sm">
                  <ul>
                     <li><a href="/" th:text="#{navigation.item.home}"></a></li>
                     <li th:if="${breadcrumbParentUrl != null}">
                        <a
                           th:href="${breadcrumbParentUrl}"
                           th:text="${#messages.msgOrNull(breadcrumbParentLabel) ?: breadcrumbParentLabel}"
                        ></a>
                     </li>
                     <li th:text="${#messages.msg(pageTitle)}"></li>
                  </ul>
               </div>
            </div>
            <div
               class="flex flex-wrap items-center justify-between gap-4 gap-y-3"
            >
               <div class="min-w-0">
                  <div class="flex items-center gap-3">
                     <div
                        th:if="${pageIcon}"
                        class="size-11 shrink-0 rounded-xl bg-primary/10 text-primary flex items-center justify-center shadow-md"
                     >
                        <span
                           class="iconify"
                           th:attr="data-icon=${pageIcon}"
                           data-width="22"
                        ></span>
                     </div>
                     <div>
                        <div class="flex items-center gap-2">
                           <h1
                              class="text-2xl font-semibold leading-tight text-base-content"
                              th:text="${pageHeading != null ? pageHeading : #messages.msg(pageTitle)}"
                           ></h1>
                           <span
                              th:if="${table != null}"
                              class="badge badge-primary badge-soft"
                              th:with="countUnit=${#messages.msgOrNull(pageTitle.replace('.title', '.unit'))}"
                              th:text="|${table.data.totalElements} ${countUnit != null ? countUnit : #messages.msg('page.count.default')}|"
                           ></span>
                        </div>
                        <th:block th:with="descriptionKey=${pageDesc != null ? pageDesc : pageTitle.replace('.title', '.description')}">
                           <p
                              th:if="${#messages.msgOrNull(descriptionKey) != null}"
                              class="mt-1 text-sm text-base-content/70"
                              th:text="${#messages.msg(descriptionKey)}"
                           ></p>
                        </th:block>
                     </div>
                  </div>
                  <th:block layout:fragment="page-meta"></th:block>
               </div>

               <div class="flex items-center gap-2">
                  <th:block layout:fragment="actions"></th:block>
               </div>
            </div>

            <div class="border-t-2 border-dashed border-base-300"></div>

            <th:block th:if="${deleteError != null}">
               <div th:replace="~{fragment/base/alert :: alert('error', ~{::span})}">
                  <span th:text="#{__${deleteError}__}"></span>
               </div>
            </th:block>

            <th:block layout:fragment="page-content"></th:block>
         </div>

         <div th:replace="~{fragment/crud/delete-modal :: delete-modal}"></div>
      </th:block>
   </body>
</html>
