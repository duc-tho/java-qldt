<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi" data-theme="light">

<head>
    <title>Master Layout</title>
    <link rel="stylesheet" type="text/css" th:href="@{/assets/app.css}" />
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script defer th:src="@{/assets/app.js}"></script>
</head>

<body>
    <aside layout:insert="~{layout/ui/sidebar}">
        <header layout:fragment="navbar">
            <div layout:insert="~{layout/ui/nav}"></div>
        </header>

        <main>
            <section layout:fragment="side-content">
                <section layout:fragment="content">
                </section>
            </section>
        </main>
    </aside>
</body>

</html>
