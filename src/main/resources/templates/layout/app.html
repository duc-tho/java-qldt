<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/master.html}">

<head>
    <title>App Layout</title>
</head>

<body>
    <th:block layout:fragment="body">
        <div class="drawer lg:drawer-open">
            <input id="my-drawer-4" type="checkbox" class="drawer-toggle inline" />

            <div class="drawer-content flex min-h-svh flex-col">
                <div th:replace="~{layout/ui/nav.html}"></div>

                <main class="flex-1 max-w-(--breakpoint-2xl) w-full mx-auto px-3 py-4 sm:px-4 xl:px-8">
                    <th:block layout:fragment="main">
                    </th:block>
                </main>

                <div th:replace="~{layout/ui/footer.html}"></div>
            </div>

            <div class="drawer-side is-drawer-close:overflow-visible">
                <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
                <div class="flex min-h-full flex-col items-start bg-base-200 is-drawer-close:w-16 is-drawer-open:w-64">
                    <div th:replace="~{layout/ui/header.html}"></div>
                    <div th:replace="~{layout/ui/sidebar.html :: sidebar-menu}"></div>
                </div>
            </div>
        </div>
    </th:block>
</body>

</html>
