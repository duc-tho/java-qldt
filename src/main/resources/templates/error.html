<!doctype html>
<html
   xmlns:th="http://www.thymeleaf.org"
   layout:decorate="~{layout/master.html}"
>
   <head>
      <title th:text="${status + ' · ' + #messages.msg('application.title')}"></title>
   </head>

   <body>
      <main
         layout:fragment="body"
         class="hero min-h-svh bg-base-100 px-6 py-12"
         th:with="errorGroup=${status >= 500 ? '5xx' : '4xx'}"
      >
         <div
            class="hero-content w-full max-w-3xl flex-col items-start gap-8"
            th:with="statusKey=${'error.page.' + status}, fallbackKey=${'error.page.' + errorGroup}"
         >
            <div class="flex w-full flex-col gap-5 sm:flex-row sm:items-center sm:gap-8">
               <p
                  class="text-7xl font-light tracking-tight text-base-content sm:text-8xl"
                  th:text="${status}"
               >
                  500
               </p>

               <div class="hidden h-20 w-px bg-base-300 sm:block"></div>

               <div class="min-w-0 border-t border-base-300 pt-5 sm:border-0 sm:pt-0">
                  <h1
                     class="text-2xl font-semibold text-base-content sm:text-3xl"
                     th:text="${#messages.msgOrNull(statusKey + '.title') ?: #messages.msg(fallbackKey + '.title')}"
                  >
                     Đã xảy ra lỗi
                  </h1>
                  <p
                     class="mt-3 max-w-xl leading-7 text-base-content/70"
                     th:text="${#messages.msgOrNull(statusKey + '.description') ?: #messages.msg(fallbackKey + '.description')}"
                  >
                     Không thể hoàn tất yêu cầu của bạn.
                  </p>
               </div>
            </div>

            <th:block
               th:replace="~{fragment/base/button :: linkStyled(@{/}, #{error.page.home}, 'bi:house-door', 'btn btn-primary', null)}"
            ></th:block>
         </div>
      </main>
   </body>
</html>
