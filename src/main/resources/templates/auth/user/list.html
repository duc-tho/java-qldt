<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{crud/layout/crud-layout.html}">

<head>
    <title th:text="${pageTitle}">Quản lý người dùng</title>
</head>

<body>
    <th:block layout:fragment="actions">
        <button
            type="button"
            class="btn btn-primary btn-sm"
            th:attr="hx-get=|${baseUrl + '/new'}|"
            hx-target="#crud-modal-content"
            hx-swap="innerHTML"
            hx-on::after-request="if (event.detail.successful) document.getElementById('crud-modal').showModal()"
        >
            + Thêm mới
        </button>
    </th:block>

    <th:block layout:fragment="content">
        <div th:replace="~{crud/table/table :: crud-table(${data}, ${columns}, ${baseUrl})}"></div>

        <dialog id="crud-modal" class="modal">
            <div class="modal-box">
                <div class="flex items-start justify-between">
                    <h3 class="text-lg font-bold">Người dùng</h3>
                    <button type="button" class="btn btn-sm btn-circle btn-ghost"
                            onclick="this.closest('dialog').close()">✕</button>
                </div>
                <div id="crud-modal-content" class="mt-2"></div>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>đóng</button>
            </form>
        </dialog>
    </th:block>
</body>

</html>
