<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="form-fields(data, isReadonly)">
    <div class="flex flex-col gap-3">
        <div class="form-control">
            <label class="label">
                <span class="label-text font-bold">Họ tên</span>
            </label>
            <input type="text" name="fullName" class="input input-bordered w-full"
                th:classappend="${#fields.hasErrors('fullName')} ? ' input-error'" th:value="*{fullName}"
                th:readonly="${isReadonly}" />
            <label class="label" th:if="${#fields.hasErrors('fullName')}">
                <span class="label-text-alt text-error" th:errors="*{fullName}"></span>
            </label>
        </div>

        <div class="form-control">
            <label class="label">
                <span class="label-text font-bold">Email</span>
            </label>
            <input type="email" name="email" class="input input-bordered w-full"
                th:classappend="${#fields.hasErrors('email')} ? ' input-error'" th:value="*{email}"
                th:readonly="${isReadonly}" />
            <label class="label" th:if="${#fields.hasErrors('email')}">
                <span class="label-text-alt text-error" th:errors="*{email}"></span>
            </label>
        </div>

        <div class="form-control">
            <label class="label">
                <span class="label-text font-bold">Tên đăng nhập</span>
            </label>
            <input type="text" name="username" class="input input-bordered w-full"
                th:classappend="${#fields.hasErrors('username')} ? ' input-error'" th:value="*{username}"
                th:readonly="${isReadonly}" />
            <label class="label" th:if="${#fields.hasErrors('username')}">
                <span class="label-text-alt text-error" th:errors="*{username}"></span>
            </label>
        </div>

        <div class="form-control" th:unless="${isReadonly}">
            <label class="label">
                <span class="label-text font-bold">Mật khẩu</span>
            </label>
            <input type="password" name="password" class="input input-bordered w-full"
                th:classappend="${#fields.hasErrors('password')} ? ' input-error'"
                placeholder="Để trống nếu không đổi" />
            <label class="label" th:if="${#fields.hasErrors('password')}">
                <span class="label-text-alt text-error" th:errors="*{password}"></span>
            </label>
        </div>

        <div class="form-control">
            <label class="label">
                <span class="label-text font-bold">Số điện thoại</span>
            </label>
            <input type="text" name="phone" class="input input-bordered w-full"
                th:classappend="${#fields.hasErrors('phone')} ? ' input-error'" th:value="*{phone}"
                th:readonly="${isReadonly}" />
            <label class="label" th:if="${#fields.hasErrors('phone')}">
                <span class="label-text-alt text-error" th:errors="*{phone}"></span>
            </label>
        </div>
    </div>
</th:block>

</html>
