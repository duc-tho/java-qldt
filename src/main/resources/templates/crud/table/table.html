<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="crud-table(data, columns, baseUrl)">
    <div id="crud-table">
        <div class="flex items-center gap-2 mb-4">
            <input
                type="text"
                name="search"
                th:value="${param.search}"
                placeholder="Tìm kiếm..."
                class="input input-bordered w-full max-w-xs"
                th:attr="hx-get=|${baseUrl}|"
                hx-trigger="input changed delay:300ms"
                hx-target="#crud-table"
                hx-include="[name='sort'], [name='dir']"
            />
            <input type="hidden" name="sort" th:value="${sortField}" />
            <input type="hidden" name="dir" th:value="${sortDir}" />
        </div>

        <div class="overflow-x-auto">
            <table class="table table-zebra w-full">
                <thead>
                    <tr>
                        <th:block th:each="col : ${columns}">
                            <th>
                                <a
                                    class="cursor-pointer link"
                                    th:attr='hx-get=|${baseUrl}?sort=${col.field}&dir=${col.field == sortField && sortDir == "asc" ? "desc" : "asc"}|'
                                    hx-target="#crud-table"
                                    hx-include="[name='search']"
                                >
                                    <span th:text="${col.label}"></span>
                                    <span th:if="${col.field == sortField}"
                                          th:text="${sortDir == 'asc'} ? ' ▲' : ' ▼'"></span>
                                </a>
                            </th>
                        </th:block>
                        <th class="w-32">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${data.content}">
                        <th:block th:each="col : ${columns}">
                            <td th:text="${col.getValue(item)}"></td>
                        </th:block>
                        <td>
                            <div class="flex gap-1">
                                <a th:href="${baseUrl + '/' + item.id}"
                                   class="btn btn-ghost btn-xs">Xem</a>
                                <button type="button" class="btn btn-ghost btn-xs"
                                        th:attr='hx-get=|${baseUrl + "/" + item.id + "/edit"}|'
                                        hx-target="#crud-modal-content"
                                        hx-swap="innerHTML"
                                        hx-on::after-request="if (event.detail.successful) document.getElementById('crud-modal').showModal()">
                                    Sửa
                                </button>
                                <button type="button" class="btn btn-ghost btn-xs text-error"
                                        th:attr="data-delete-url=|${baseUrl + '/' + item.id}|,data-delete-name=|${columns[0].getValue(item)}|">
                                    Xóa
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${data.totalPages > 1}"
             th:replace="~{crud/table/pagination :: crud-pagination(${data}, ${baseUrl})}"></div>
    </div>
</th:block>
</html>
