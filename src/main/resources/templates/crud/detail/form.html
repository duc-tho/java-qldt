<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<th:block th:fragment="crud-form(data, actionUrl, isReadonly, fieldsTemplate)">
    <form th:action="${actionUrl}" th:method="${isReadonly} ? 'GET' : 'POST'" th:object="${data}" novalidate
        th:attr="hx-post=${!isReadonly ? actionUrl : null}" hx-target="#crud-table" hx-swap="outerHTML"
        hx-on::after-request="if (event.detail.successful) this.closest('dialog').close()">

        <div class="card bg-base-200 border-base-300 border">
            <div class="card-body">
                <div th:if="${#fields.hasAnyErrors()}" role="alert"
                    class="alert alert-error alert-soft flex gap-2 flex-col">
                    <p th:each="err : ${#fields.errors('*')}" th:text="${err}"></p>
                </div>

                <th:block th:replace="~{${fieldsTemplate} :: form-fields(${data}, ${isReadonly})}"></th:block>

                <div class="card-actions justify-end mt-4">
                    <a th:if="${isReadonly}" th:href="${actionUrl}" class="btn btn-ghost">Quay lại</a>
                    <button th:if="${!isReadonly}" type="button" class="btn btn-ghost"
                        onclick="this.closest('dialog').close()">Hủy</button>
                    <button type="submit" class="btn btn-primary" th:if="${!isReadonly}">Lưu</button>
                </div>
            </div>
        </div>
    </form>
</th:block>

</html>
