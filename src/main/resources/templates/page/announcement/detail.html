<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="actions"
         ><th:block th:if="${form.readonly and canEdit}">
            <th:block th:replace="~{fragment/base/button :: linkStyled(${form.actionUrl + '/edit'}, #{crud.action.edit}, null, 'btn btn-primary btn-sm', null)}"></th:block>
         </th:block>
         <form
            th:if="${form.readonly and canEdit}"
            th:action="${form.actionUrl + '/withdraw'}"
            method="post"
            class="inline"
         >
            <input
               type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"
            /><th:block th:replace="~{fragment/base/button :: submit(#{announcements.action.withdraw}, null, 'btn btn-warning btn-sm', false)}"></th:block></form></th:block
      ><th:block layout:fragment="page-content"
         ><div th:replace="~{fragment/crud/form :: crud-form(${form})}"></div
      ></th:block>
   </body>
</html>
