<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-meta" th:if="${isStaff}">
         <div class="mt-3 ml-14 flex flex-wrap gap-2" th:if="${form.readonly}">
            <th:block th:replace="~{fragment/feature/period/status-badges :: badges(${period.periodType}, ${periodStage})}"></th:block>
         </div>
      </th:block>
      <th:block layout:fragment="actions" th:if="${isStaff}">
         <th:block th:if="${form.readonly}" sec:authorize="hasAnyRole('HEAD_OF_FACULTY', 'ADMIN')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
            <th:block th:replace="~{fragment/base/button :: linkStyled(${form.actionUrl + '/sua'}, #{crud.action.edit}, 'bi:pencil-square', 'btn btn-primary btn-sm', null)}"></th:block>
            <th:block th:replace="~{fragment/crud/delete-action :: delete(${form.actionUrl + '/xoa'}, ${form.data.name}, #{crud.action.delete})}"></th:block>
         </th:block>
      </th:block>
      <th:block layout:fragment="page-content">
         <th:block th:if="${isStaff}">
         <div
            class="grid grid-cols-1 items-start gap-6 xl:grid-cols-[minmax(0,2fr)_minmax(18rem,1fr)]"
         >
            <div class="min-w-0 space-y-6">
               <th:block th:if="${form.readonly and nextDeadline != null}">
                  <th:block th:replace="~{fragment/base/alert :: content('alert alert-warning alert-soft', 'alert', ~{::deadline-alert-content})}">
                     <th:block th:fragment="deadline-alert-content">
                  <span class="iconify text-xl" data-icon="bi:alarm"></span>
                  <div>
                     <p
                        class="font-semibold"
                        th:text="|#{registration_periods.deadline.next}: #{__${nextDeadlineLabel}__} · ${#temporals.format(nextDeadline, 'dd/MM/yyyy HH:mm')}|"
                     ></p>
                     <p
                        class="text-sm"
                        th:text="#{registration_periods.deadline.description}"
                     ></p>
                  </div>
                     </th:block>
                  </th:block>
               </th:block>
               <div
                  th:replace="~{fragment/crud/form :: crud-form(${form})}"
               ></div>
            </div>
            <th:block th:if="${form.readonly}">
            <th:block th:replace="~{fragment/feature/period/timeline :: timeline}"></th:block>
            </th:block>
         </div>

         <th:block th:if="${form.readonly}">
            <div class="mt-6 flex flex-wrap gap-2">
               <span th:replace="~{fragment/base/badge :: text(#{topics.section.title} + ': ' + ${topicCount}, 'badge badge-soft')}"></span>
               <span th:replace="~{fragment/base/badge :: text(#{student-groups.page.list.title} + ': ' + ${groupCount}, 'badge badge-soft')}"></span>
               <th:block th:if="${period.periodType.name() == 'KLTN'}">
                  <span th:replace="~{fragment/base/badge :: text(#{councils.page.list.title} + ': ' + ${councilCount}, 'badge badge-soft')}"></span>
               </th:block>
            </div>
            <nav class="mt-8 flex flex-wrap gap-3" aria-label="Các chức năng của đợt">
               <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/de-tai(id=${period.id})}, #{topics.section.title}, 'bi:journal-text', 'btn btn-outline btn-sm', null)}"></th:block>
               <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/nhom(id=${period.id})}, #{student-groups.page.list.title}, 'bi:people', 'btn btn-outline btn-sm', null)}"></th:block>
               <th:block th:if="${period.periodType.name() == 'KLTN'}">
                  <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/hoi-dong(id=${period.id})}, #{councils.page.list.title}, 'bi:people-fill', 'btn btn-outline btn-sm', null)}"></th:block>
               </th:block>
               <th:block th:if="${period.periodType.name() == 'TLCN'}">
                  <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/phan-cong(id=${period.id})}, #{reviewer-assignments.page.title}, 'bi:person-check', 'btn btn-outline btn-sm', null)}"></th:block>
               </th:block>
               <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{id}/ket-qua(id=${period.id})}, #{result-publications.title}, 'bi:award', 'btn btn-outline btn-sm', null)}"></th:block>
            </nav>
         </th:block>
         </th:block>
         <th:block th:unless="${isStaff}">
            <div th:replace="~{fragment/feature/period/viewer-summary :: viewer-summary(${period}, ${periodStage}, ${now}, ${isLecturer}, ${canPropose}, ${canCreateGroup}, ${groupId})}"></div>
         </th:block>
         <div class="mt-8 space-y-6" th:if="${!isStaff or form.readonly}">
            <th:block th:replace="~{fragment/feature/period/topics-panel :: panel(${period}, ${periodTopics})}"></th:block>
            <th:block th:replace="~{fragment/feature/period/groups-panel :: panel(${period}, ${groupSummaries}, ${canCreateGroup}, ${groupId})}"></th:block>
            <th:block th:replace="~{fragment/feature/period/evaluation-panel :: panel(${period}, ${isStaff}, ${isLecturer}, ${councilSummaries}, ${reviewerAssignmentTopics}, ${assignedCount}, ${resultsPublished})}"></th:block>
            <th:block th:if="${isStaff}" th:replace="~{fragment/feature/result/publication :: result-publication(${period})}"></th:block>
         </div>
      </th:block>
   </body>
</html>
