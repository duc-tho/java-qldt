<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
          <div th:class="${showProposalRules == true or pageTitle == 'topics.page.propose.title'} ? 'grid items-start gap-6 lg:grid-cols-[minmax(0,3fr)_minmax(16rem,2fr)]' : ''">
             <div th:replace="~{fragment/crud/form :: crud-form(${form})}"></div>
             <th:block th:if="${showProposalRules == true or pageTitle == 'topics.page.propose.title'}">
                <aside th:replace="~{fragment/feature/topic/proposal-rules :: rules}"></aside>
             </th:block>
          </div>
      </th:block>
   </body>
</html>
