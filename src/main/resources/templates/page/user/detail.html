<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <head>
      <title th:text="${#messages.msg(pageTitle)}"></title>
   </head>

   <body>
      <th:block layout:fragment="actions">
         <th:block th:if="${form.readonly}">
            <th:block th:replace="~{fragment/base/button :: link(${form.actionUrl + '/edit'}, #{crud.action.edit}, 'bi:pencil-square', 'primary')}"></th:block>
            <th:block th:replace="~{fragment/crud/delete-action :: delete(${form.actionUrl + '/delete'}, ${form.data.fullName}, #{crud.action.delete})}"></th:block>
         </th:block>
      </th:block>

      <th:block layout:fragment="page-content">
         <div th:replace="~{fragment/crud/form :: crud-form(${form})}"></div>
      </th:block>
   </body>
</html>
