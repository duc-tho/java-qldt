<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/app.html}">
   <head>
      <title th:text="#{home.title}"></title>
   </head>

   <body>
      <th:block layout:fragment="main">
         <div class="mx-auto w-full max-w-7xl space-y-6">
            <header class="overflow-hidden rounded-box bg-primary px-5 py-6 text-primary-content sm:px-7 sm:py-8">
               <div class="flex items-start justify-between gap-6">
                  <div class="min-w-0">
                     <p class="text-sm font-medium text-primary-content/75" th:text="#{dashboard.eyebrow}"></p>
                     <h1 class="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl"
                        th:text="#{dashboard.greeting(${dashboard.user.fullName})}"></h1>
                     <p class="mt-2 max-w-2xl text-sm text-primary-content/80 sm:text-base"
                        th:text="#{dashboard.description}"></p>
                  </div>
                  <span class="iconify hidden size-12 shrink-0 opacity-70 sm:block"
                     data-icon="bi:grid-1x2" aria-hidden="true"></span>
               </div>
            </header>

            <div class="grid items-start gap-6 lg:grid-cols-[minmax(0,2fr)_minmax(18rem,1fr)]">
               <section aria-labelledby="dashboard-work-title" class="min-w-0">
                  <div class="mb-4 flex items-end justify-between gap-4">
                     <div>
                        <h2 id="dashboard-work-title" class="text-xl font-semibold text-base-content"
                           th:text="#{dashboard.work.title}"></h2>
                        <p class="mt-1 text-sm text-base-content/65" th:text="#{dashboard.work.description}"></p>
                     </div>
                     <span class="badge badge-ghost badge-sm shrink-0"
                        th:text="#{dashboard.work.count(${dashboard.actions.size()})}"></span>
                  </div>

                  <div th:if="${!dashboard.actions.isEmpty()}" class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                     <a th:each="action : ${dashboard.actions}"
                        th:href="@{${action.type.url}}"
                        class="card card-sm bg-base-200 transition duration-200 hover:-translate-y-0.5 hover:bg-base-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
                        <div class="card-body gap-3">
                           <div class="flex items-start justify-between gap-3">
                              <div class="flex size-10 items-center justify-center rounded-field bg-base-100 text-base-content shadow-sm">
                                 <span class="iconify size-5" th:attr="data-icon=${action.type.icon}" aria-hidden="true"></span>
                              </div>
                              <span class="iconify size-4 text-base-content/45" data-icon="bi:arrow-up-right" aria-hidden="true"></span>
                           </div>
                           <div class="stats bg-transparent shadow-none">
                              <div class="stat min-w-0 p-0">
                                 <div class="stat-value text-3xl tabular-nums" th:text="${action.value}"></div>
                                 <div class="stat-title mt-1 whitespace-normal font-semibold text-base-content"
                                    th:text="#{__${action.type.titleKey}__}"></div>
                                 <div class="stat-desc mt-1 line-clamp-2 min-h-10 whitespace-normal text-base-content/65"
                                    th:text="#{__${action.type.descriptionKey}__}"></div>
                              </div>
                           </div>
                        </div>
                     </a>
                  </div>

                  <div th:if="${dashboard.actions.isEmpty()}"
                     class="rounded-box border border-dashed border-base-300 bg-base-200 p-8 text-center">
                     <span class="iconify mx-auto size-8 text-base-content/45" data-icon="bi:inbox" aria-hidden="true"></span>
                     <p class="mt-3 font-medium" th:text="#{dashboard.work.empty}"></p>
                  </div>
               </section>

               <aside aria-labelledby="dashboard-announcements-title"
                  class="card card-border card-sm bg-base-100 lg:sticky lg:top-4">
                  <div class="card-body gap-0 p-0">
                     <div class="flex items-center justify-between gap-3 border-b border-base-300 px-4 py-4">
                        <div class="flex min-w-0 items-center gap-3">
                           <div class="flex size-9 shrink-0 items-center justify-center rounded-field bg-base-200">
                              <span class="iconify size-5" data-icon="bi:megaphone" aria-hidden="true"></span>
                           </div>
                           <div class="min-w-0">
                              <h2 id="dashboard-announcements-title" class="font-semibold"
                                 th:text="#{dashboard.announcements.title}"></h2>
                              <p class="text-xs text-base-content/60"
                                 th:text="#{dashboard.announcements.count(${dashboard.announcements.size()})}"></p>
                           </div>
                        </div>
                        <a th:href="@{/thong-bao}" class="btn btn-ghost btn-xs shrink-0" th:text="#{dashboard.announcements.view-all}"></a>
                     </div>

                     <ul th:if="${!dashboard.announcements.isEmpty()}"
                        class="list max-h-[calc(100dvh-14rem)] overflow-y-auto p-2">
                        <li th:each="announcement : ${dashboard.announcements}" class="list-row p-0">
                           <a th:href="@{/thong-bao/{id}(id=${announcement.id})}"
                              class="block min-w-0 rounded-field px-3 py-3 transition-colors hover:bg-base-200 focus-visible:outline-2 focus-visible:outline-primary">
                              <div class="flex items-start justify-between gap-3">
                                 <p class="line-clamp-2 min-w-0 font-medium leading-5" th:text="${announcement.title}"></p>
                                 <span class="iconify mt-0.5 size-4 shrink-0 text-base-content/35"
                                    data-icon="bi:chevron-right" aria-hidden="true"></span>
                              </div>
                              <time class="mt-1 block text-xs tabular-nums text-base-content/55"
                                 th:datetime="${announcement.createdAt}"
                                 th:text="${#temporals.format(announcement.createdAt, 'dd/MM/yyyy HH:mm')}"></time>
                           </a>
                        </li>
                     </ul>

                     <div th:if="${dashboard.announcements.isEmpty()}" class="px-5 py-10 text-center">
                        <span class="iconify mx-auto size-8 text-base-content/35" data-icon="bi:bell-slash" aria-hidden="true"></span>
                        <p class="mt-3 text-sm text-base-content/65" th:text="#{dashboard.announcements.empty}"></p>
                     </div>
                  </div>
               </aside>
            </div>
         </div>
      </th:block>
   </body>
</html>
