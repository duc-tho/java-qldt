<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/page.html}">
   <body>
      <th:block layout:fragment="page-content">
         <section class="space-y-5">
            <th:block th:if="${#lists.isEmpty(registrations)}"><th:block th:replace="~{fragment/base/alert :: iconText('alert alert-info alert-soft', 'alert', #{councils.workspace.empty}, 'bi:info-circle')}" ></th:block></th:block>

            <div
               class="overflow-x-auto rounded-box border border-base-300"
               th:unless="${#lists.isEmpty(registrations)}"
            >
               <th:block th:replace="~{fragment/base/table :: table('table table-md', ~{::#shared-table-head-1}, ~{::#shared-table-body-1})}">
                  <thead id="shared-table-head-1" th:fragment="shared-table-head-1" class="bg-base-200">
                     <tr>
                        <th th:text="#{councils.workspace.topic}"></th>
                        <th th:text="#{councils.workspace.group}"></th>
                        <th th:text="#{councils.workspace.period}"></th>
                        <th th:text="#{councils.workspace.type}"></th>
                        <th class="text-right" th:text="#{crud.table.actions}"></th>
                     </tr>
                  </thead>
                  <th:block id="shared-table-body-1" th:fragment="shared-table-body-1">
                  <tbody>
                     <tr th:each="registration : ${registrations}">
                        <td class="font-medium" th:text="${registration.topic.title}"></td>
                        <td><a class="link link-primary" th:href="@{/dot/{periodId}/nhom/{groupId}(periodId=${registration.studentGroup.registrationPeriod.id},groupId=${registration.studentGroup.id})}" th:text="${registration.studentGroup.name}"></a></td>
                        <td th:text="${registration.topic.registrationPeriod.name}"></td>
                        <td th:text="#{__${'period-types.' + registration.topic.registrationPeriod.periodType.name()}__}"></td>
                        <td class="text-right">
                           <th:block th:replace="~{fragment/base/button :: linkStyled(@{/dot/{periodId}/danh-gia/{id}(periodId=${registration.studentGroup.registrationPeriod.id},id=${registration.id})}, #{councils.workspace.open}, 'bi:clipboard2-check', 'btn btn-outline btn-sm', null)}"></th:block>
                        </td>
                     </tr>
                  </tbody>
               
                  </th:block></th:block>
            </div>
         </section>
      </th:block>
   </body>
</html>
