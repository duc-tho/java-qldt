spring:
  profiles:
    active: dev
  application:
    name: qldt
  messages:
    basename: i18n/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB

qldt:
  dashboard:
    announcement-limit: 8
  report-storage:
    root: ./local-report-storage
