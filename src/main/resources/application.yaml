spring:
  profiles:
    active: ${PROFILES_ACTIVE:dev-win}
  application:
    name: qldt
  messages:
    basename: i18n/messages
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB

qldt:
  report-storage:
    root: ${REPORT_STORAGE_ROOT:./local-report-storage}
